[build]
# 移除 jobs = 1 以允许并行编译，显著提升构建速度
incremental = true

[env]
# 使用 .sqlx/ 离线缓存验证 SQL，避免 rust-analyzer 和 CI 环境连接数据库
SQLX_OFFLINE = "true"

[source.crates-io]
replace-with = "rsproxy-sparse"

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[net]
git-fetch-with-cli = true

# 2026-08-11: 移除此处的 [profile.release] 覆盖段（opt-level=2 / lto=thin /
# codegen-units=4）。它会静默降级根 Cargo.toml 声明的 release 配置
# （opt-level=3 / lto=true / codegen-units=1 / panic=abort / strip=true），
# 导致发布产物更慢更大。发布构建以根 Cargo.toml 为唯一真相源；
# 若 CI 需要快速构建，请在 CI 中用显式 --profile 或环境变量控制。

[profile.dev]
incremental = true

# Test aliases — zero-thinking test commands.
# cargo nt --lib          (lib tests with test-utils)
# cargo nt --test unit    (unit test target)
[alias]
nt = "nextest run --profile test --features test-utils"
