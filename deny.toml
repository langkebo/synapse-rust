# cargo-deny configuration for synapse-rust.
#
# cargo-deny blocks four classes of supply-chain risk:
#   - advisories: known CVEs / unmaintained crates
#   - bans:       disallowed / duplicate dependency versions
#   - licenses:   SPDX-allowlist for the dependency graph
#   - sources:    registries a build may pull from
#
# This file is intentionally permissive on advisories only for the
# crates that already have an accepted exception in
# `.cargo/audit.toml`. Everything else will fail CI.
#
# See: docs/synapse-rust/COMPREHENSIVE_AUDIT_REPORT_2026-06-03.md
#      (recommendation step "引入 cargo-deny / cargo-audit / cargo-mutants 入 CI")

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # RUSTSEC-2023-0071 — rsa 0.9.10 Marvin Attack (PKCS#1 v1.5 decryption
    # timing side-channel). Direct usage in
    # `src/services/builtin_oidc_provider.rs` is restricted to *signing*
    # only; no decryption code path. Review-by 2026-06-30 (target: ES256
    # migration).
    "RUSTSEC-2023-0071",
    # RUSTSEC-2024-0388 — derivative 2.2.0 unmaintained. Transitive via
    # synapse-common. Compile-time proc-macro only; no runtime risk.
    # Review-by 2026-12-31.
    "RUSTSEC-2024-0388",
    # RUSTSEC-2024-0436 — paste 1.0.15 unmaintained. Transitive via
    # image → ravif → rav1e → paste. Compile-time macro use only.
    "RUSTSEC-2024-0436",
    # RUSTSEC-2026-0173 — proc-macro-error2 unmaintained. Transitive via
    # validator. Compile-time macro use only.
    "RUSTSEC-2026-0173",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
# ── DC5: 已知的多版本并存（均为主版本不兼容，由第三方传递，无法用 cargo update 消除） ──
#
# 原理：Rust 的版本解析允许同一 crate 的不同主版本共存（如 rand 0.8.x 与 0.9.x），
# 因为它们 API 不兼容。以下条目均由于关键传递依赖尚未升级到新主版本导致：
#
# - rand 0.8.7 : rsa 0.9.10（JWT 签名核心）/ sqlx-postgres 0.8.6（数据库驱动）
# - rand 0.9.5 : workspace 直接依赖，用于 RNG 核心逻辑
# - rand 0.10.2: 已列入 skip（dev-only, quickcheck）
#
# - getrandom 0.2.17: rand_core 0.6 → crypto-common → aead → aes-gcm（E2EE crypto）
# - getrandom 0.3.4 : rand_core 0.9 → rand 0.9（workspace 直接依赖）
# - getrandom 0.4.3 : 已列入 skip（dev-only, tempfile → insta）
#
# - rand_core 0.6.4 : getrandom 0.2 链，用于 E2EE crypto
# - rand_core 0.9.5 : rand 0.9 链（workspace 直接依赖）
# - rand_core 0.10.1: 已列入 skip（dev-only, quickcheck → rand 0.10）
#
# - hashbrown 0.14.5: dashmap 6.2 + hashlink 0.8 → config → yaml-rust2
# - hashbrown 0.15.5: hashlink 0.10 → sqlx-core 0.8.6（数据库驱动）
# - hashbrown 0.17.1: indexmap 2.x → h2 → hyper → axum（HTTP 框架）
#
# 维护义务：上游 crate 升级到新主版本后，请移除对应 skip 条目并验证。
# 审计周期：每季度检查上游是否已迁移（rsa 0.10+、sqlx 0.9+、dashmap 7.x）。
skip = [
    # Dev-only 工具，其依赖树不影响生产二进制
    { name = "criterion", version = "*" },
    { name = "quickcheck", version = "*" },
    { name = "quickcheck_macros", version = "*" },
    { name = "arbitrary", version = "*" },
    { name = "mockall", version = "*" },
    { name = "wiremock", version = "*" },
    { name = "tempfile", version = "*" },
    { name = "fake", version = "*" },
    # DC5: rand/rand_core 旧主版本，由 rsa 0.9.10（JWT 签名）和 sqlx-postgres 0.8.6（数据库）传递
    # rsa 0.9.10 依赖 num-bigint-dig → rand 0.8；sqlx-postgres 因为 uuid 特性依赖 rand 0.8
    { name = "rand", version = "0.8" },
    { name = "rand_core", version = "0.6" },
    # DC5: getrandom 旧主版本，E2EE crypto 链（aead/aes-gcm → crypto-common → rand_core 0.6 → getrandom 0.2）
    # aes-gcm 是 E2EE 核心依赖，无法替换；需等待上游升级 rand_core
    { name = "getrandom", version = "0.2" },
    # DC5: hashbrown 旧主版本，dashmap 6.x（并发 HashMap）和 config（YAML 配置解析）传递
    # dashmap 6.2 依赖 hashbrown 0.14；config → yaml-rust2 → hashlink 0.8 → hashbrown 0.14
    { name = "hashbrown", version = "0.14" },
    # DC5: hashbrown 中主版本，sqlx-core 0.8.6 通过 hashlink 0.10 传递
    { name = "hashbrown", version = "0.15" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "OpenSSL",
    "MPL-2.0",
    "0BSD",
    "NCSA",
    "AGPL-3.0-only",
]
# webpki-roots 是 Mozilla 根证书数据文件，采用 CDLA-Permissive-2.0
# （社区数据许可-宽松版），仅用于 TLS 根证书分发，业界惯例按 crate 例外放行。
# 2026-08-11 修复：此前该许可未在任何 allow/exception 中，导致
# `cargo deny check licenses`（CI supply_chain_gate）失败。
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# 注：.cargo/config.toml 将 crates.io 的下载层重定向到 rsproxy.cn 镜像以加速
# （Cargo.lock 仍记录规范 crates.io 源，checksum 强制校验，镜像无法替换内容）。
# 此处将镜像 URL 显式列入白名单，使来源策略与实际行为一致；
# 如对镜像信任有顾虑，可移除 .cargo/config.toml 的 source 替换直连 crates.io。
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
    "https://rsproxy.cn/index/",
]
allow-git = []
