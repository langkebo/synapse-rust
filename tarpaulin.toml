# Tarpaulin coverage configuration
# See: https://crates.io/crates/cargo-tarpaulin

[default]
# Output format
out = ["Html", "Lcov", "Json"]

# Output directory
output-dir = "coverage"

# B.3: hard floor 40% overall (tarpaulin's own `--fail-under`). Per-file policy
# is enforced by scripts/check_file_coverage.py against the committed baseline:
# baseline-known files must not regress, new files must clear core ≥70% (the
# 29-prefix list in scripts/ci/core_file_coverage_prefixes.txt, currently
# matching 258 files) or the 30% ramp-up floor otherwise.
fail-under = 40

# Include only library code (exclude tests, examples, benches)
include-lines = ["src/**/*.rs"]

# Exclude patterns
exclude-files = [
    "src/test_utils.rs",
    "tests/**",
    "benches/**",
    "**/test_mocks.rs",
    "**/test_mocks/**",
]

# Features to enable
features = "test-utils"

# B.3: raised from 2 -> 8 to match nextest profile (DB pool max=40).
args = ["--test-threads=8"]

# Skip doc tests (they're not part of coverage measurement)
skip-clean = false

# Generate HTML report with line-by-line coverage
[report]
# Color output
color = "Always"

# Show uncovered lines
verbose = true
