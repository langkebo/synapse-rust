[package]
name = "synapse-web"
version.workspace = true
edition = "2021"
rust-version = "1.93.0"
authors = ["Synapse Rust Team"]
description = "HTTP boundary for Synapse Rust: Axum routes, extractors, middleware and the federation glue they need"
license = "AGPL-3.0-only"

[lints]
workspace = true

[features]
# Mirrors the root package's feature surface: the route modules are gated on the
# same extension switches, and the root crate forwards each one here.
default = ["core-private-chat", "widgets", "external-services", "beacons"]
test-utils = ["dep:synapse-test-utils", "synapse-services/test-utils", "synapse-e2ee/test-utils", "synapse-federation/test-utils"]

core-private-chat = ["friends", "burn-after-read"]
friends = ["synapse-services/friends"]
voice-extended = ["synapse-services/voice-extended"]
saml-sso = ["synapse-services/saml-sso"]
cas-sso = ["synapse-services/cas-sso"]
beacons = ["synapse-services/beacons"]
voip-tracking = ["synapse-services/voip-tracking"]
widgets = ["synapse-services/widgets"]
server-notifications = ["synapse-services/server-notifications"]
burn-after-read = ["synapse-services/burn-after-read"]
privacy-ext = ["synapse-services/privacy-ext"]
external-services = ["synapse-services/external-services"]
builtin-oidc = ["synapse-services/builtin-oidc"]
all-extensions = [
    "friends", "voice-extended",
    "saml-sso", "cas-sso",
    "beacons", "voip-tracking", "widgets", "server-notifications",
    "burn-after-read", "privacy-ext", "external-services",
    "builtin-oidc"
]

[dependencies]
synapse-common = { path = "../synapse-common" }
synapse-cache = { path = "../synapse-cache" }
synapse-e2ee = { path = "../synapse-e2ee", default-features = false }
synapse-federation = { path = "../synapse-federation" }
synapse-services = { path = "../synapse-services" }
synapse-test-utils = { path = "../synapse-test-utils", optional = true }

tokio = { workspace = true, features = ["full", "test-util"] }
tokio-util = { workspace = true, features = ["io"] }

axum = { workspace = true, features = ["macros", "multipart"] }
# `stream` is what lets the write-forwarding hop pipe a request body instead of buffering
# it (see `middleware/write_forwarding::streaming_body`). The root crate already enables it;
# features are additive, so this only makes the requirement explicit where it is used.
reqwest = { workspace = true, features = ["stream"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["fs", "cors", "trace", "compression-gzip", "limit"] }
http = { workspace = true }
ipnetwork = "0.20"

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

rand = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true, features = ["oid"] }
hmac = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = "2.0"

tracing = { workspace = true, features = ["attributes"] }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "serde"] }
futures = { workspace = true }
bytes = { workspace = true }
regex = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
validator = { version = "0.20.0", features = ["derive"] }
infer = "0.19.0"

# 单元测试（`#[cfg(test)]`）直接使用 `synapse_test_utils::{env_lock, EnvGuard}`。
# 生产代码里的 `synapse-test-utils` 是 `test-utils` feature 下的可选依赖，但不带
# feature 跑 `cargo test -p synapse-web --lib` 时 `#[cfg(test)]` 也需要它；因此
# 另在 dev-dependencies 中声明（Cargo 会在测试构建中合并两者）。
[dev-dependencies]
# MAINT-01: `#[cfg(test)]` code uses `synapse_common::test_isolation` (gated on
# `any(test, feature = "test-utils")` in synapse-common); a dependency's
# `cfg(test)` is invisible here, hence the dev-dep feature switch.
synapse-common = { path = "../synapse-common", features = ["test-utils"] }
synapse-test-utils = { path = "../synapse-test-utils" }
# 仅 `#[cfg(test)]` 使用（health.rs 的限流配置序列化、login_lockout 的故障注入），
# 放 dev-dependencies 避免进入 release 依赖图。
serde_norway = { workspace = true }
deadpool-redis = { workspace = true }
