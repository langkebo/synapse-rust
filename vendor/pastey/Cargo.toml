[package]
# This crate is a vendored copy of pastey 0.2.3 (https://github.com/as1100k/pastey)
# with the package name changed to `paste` so that `cargo [patch.crates-io]`
# can redirect the unmaintained `paste` crate (RUSTSEC-2024-0436) to this
# actively-maintained fork with zero source-code changes anywhere in the
# workspace.  Source files (lib.rs, attr.rs, error.rs, segment.rs) are copied
# verbatim from pastey 0.2.3 and re-licensed under the original MIT/Apache-2.0
# dual licence of pastey.
#
# Version number is bumped past 1.0.15 to avoid lockfile collisions with the
# original unmaintained crate when the patch is removed.
name = "paste"
version = "1.0.16"
edition = "2018"
description = "Vendored copy of pastey 0.2.3 (fork of paste) — re-exported as `paste` for [patch.crates-io] redirect"
license = "MIT OR Apache-2.0"
repository = "https://github.com/as1100k/pastey"
rust-version = "1.54"

[lib]
proc-macro = true

# pastey uses `coverage_nightly` cfg internally; allow it to avoid warnings
# on stable/beta.  This does not affect the workspace's own deny lints —
# it only applies to the vendored copy.
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(coverage_nightly)'] }
