[package]
name = "synapse-common"
version = "0.1.0"
edition = "2021"
rust-version = "1.93.0"
authors = ["Synapse Rust Team"]
description = "Common utilities and types for Synapse Rust"
license = "AGPL-3.0-only"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[features]
default = ["server"]
server = ["dep:axum", "dep:tower-http"]
runtime-ddl = []
test-utils = []
friends = []
voice-extended = []
saml-sso = []
cas-sso = []
beacons = []
voip-tracking = []
widgets = []
server-notifications = []
burn-after-read = []
privacy-ext = []
external-services = []
builtin-oidc = []
openapi-docs = ["dep:utoipa"]

[dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
async-trait = { workspace = true }

axum = { workspace = true, optional = true, features = ["macros"] }
tower-http = { workspace = true, optional = true, features = ["fs", "cors", "trace", "compression-gzip", "limit"] }
http = { workspace = true }

sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "chrono", "json", "uuid", "ipnetwork", "migrate"] }

redis = { workspace = true, features = ["tokio-rustls-comp"] }
deadpool-redis = { workspace = true }
moka = { workspace = true, features = ["future", "sync"] }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

rand = { workspace = true }
sha2 = { workspace = true, features = ["oid"] }
hmac = { workspace = true }
hkdf = "0.12"
base64 = { workspace = true }

argon2 = "0.5"
aes-gcm = "0.10"
ed25519-dalek = "2.0"


config = { version = "0.14", default-features = false, features = ["yaml", "convert-case"] }


metrics = "0.23"

tracing = { workspace = true, features = ["attributes"] }
tracing-opentelemetry = "0.32"
opentelemetry = { version = "0.31", features = ["metrics", "logs"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json", "registry"] }

chrono = { workspace = true, features = ["serde"] }

thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
futures = { workspace = true }
parking_lot = { workspace = true }
regex = { workspace = true }
quick-xml = "0.41"
url = { workspace = true }
reqwest = { workspace = true, features = ["json"] }

validator = { version = "0.20.0", features = ["derive"] }
ammonia = "4.1"

hex = "0.4.3"
dns-lookup = "3.0.1"
ipnet = "2.12.0"

utoipa = { version = "5", features = ["axum_extras"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
fake = "2.9"
quickcheck = "1.0"
quickcheck_macros = "1.0"
tempfile = "3"
arbitrary = { version = "1", features = ["derive"] }
mockall = "0.13"
wiremock = "0.6"
