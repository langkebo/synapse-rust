# Extension Map Configuration
# Updated: 2026-09-11 (real feature gating; aligned with the v10 extensions file)
#
# Format: <filename>=<feature_name>[,<feature_name>...]
# Each line maps a migration file to the feature flag(s) used in
# ENABLED_EXTENSIONS. A comma-separated list means OR: the file is applied when
# ANY of the listed features is enabled.
#
# Semantics implemented by docker/deploy/scripts/container-migrate.sh:
#   - file NOT in this map     -> treated as CORE -> always applied
#   - file in this map         -> applied only when at least one of its
#                                 features is enabled
#   - ENABLED_EXTENSIONS=none  -> every mapped file is skipped
#
# ---------------------------------------------------------------------------
# 00000001_extensions_v10.sql
# ---------------------------------------------------------------------------
# This is a *consolidated* extension file bundling four independent features
# (each introduced by an `-- Extension: <name> (feature: <f>)` block):
#
#   cas-sso         -> cas_tickets, cas_proxy_tickets, cas_proxy_granting_tickets,
#                      cas_services, cas_user_attributes, cas_slo_sessions
#   saml-sso        -> saml_sessions, saml_user_mapping, saml_identity_providers,
#                      saml_auth_events, saml_logout_requests
#   friends         -> friends, friend_requests, friend_categories
#   voice-extended  -> voice_messages
#
# Before 2026-09-11 this file was mapped to nothing, so `should_apply_migration`
# classified it as core and applied it unconditionally: `ENABLED_EXTENSIONS=none`
# still created CAS/SAML/friends/voice tables. Listing all four features restores
# real gating — the file is applied when any of them is enabled, and skipped for
# `none` or for feature sets sharing no feature with it.
#
# Limitation: the map cannot express "apply only the cas-sso part of this file".
# If per-feature table gating is required, split this file back into per-feature
# files (00000001_extensions_cas.sql, ...) and map each separately.
00000001_extensions_v10.sql=cas-sso,saml-sso,friends,voice-extended
