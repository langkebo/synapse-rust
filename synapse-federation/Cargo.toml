[package]
name = "synapse-federation"
version = "0.1.0"
edition = "2021"
rust-version = "1.93.0"
authors = ["Synapse Rust Team"]
description = "Federation protocol implementation for Synapse Rust"
license = "AGPL-3.0-only"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[features]
friends = ["synapse-common/friends"]
test-utils = ["synapse-common/test-utils"]

[dependencies]
synapse-common = { path = "../synapse-common" }
synapse-cache = { path = "../synapse-cache" }
synapse-storage = { path = "../synapse-storage" }

tokio = { workspace = true, features = ["full", "test-util"] }
async-trait = { workspace = true }

sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "chrono", "json", "uuid", "ipnetwork", "migrate", "macros"] }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

base64 = { workspace = true }
ed25519-dalek = "2.0"
sha2 = { workspace = true, features = ["oid"] }
rand = { workspace = true }

reqwest = { workspace = true, features = ["json"] }
urlencoding = { workspace = true }

chrono = { workspace = true, features = ["serde"] }

thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

moka = { workspace = true, features = ["future", "sync"] }
parking_lot = { workspace = true }

tracing = { workspace = true, features = ["attributes"] }

[dev-dependencies]
wiremock = "0.6"
