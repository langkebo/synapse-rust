[package]
name = "synapse-test-utils"
version.workspace = true
edition = "2021"
rust-version = "1.93.0"
authors = ["Synapse Rust Team"]
description = "Shared test infrastructure for Synapse Rust: schema leasing, env guards, pooled test databases"
license = "AGPL-3.0-only"

[lints]
workspace = true

[dependencies]
# This crate *is* test infrastructure, so it always needs synapse-common's
# `test-utils` modules (`test_schema_guard`, `test_isolation`,
# `test_schema_orphans`, `test_database_guard`). MAINT-01 gated those modules;
# enabling the feature here is safe because this crate is only reachable through
# the `test-utils` feature of its consumers, never from a production build.
synapse-common = { path = "../synapse-common", features = ["test-utils"] }
synapse-services = { path = "../synapse-services" }

sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "chrono", "json", "uuid", "ipnetwork", "migrate", "macros", "bigdecimal"] }
tokio = { workspace = true, features = ["full", "test-util"] }
tracing = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# atexit hook for the schema janitor: registered by this crate's **test** build only
# (B' — keeps the `unsafe` out of the production build).
libc = "0.2"

