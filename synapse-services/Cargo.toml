[package]
name = "synapse-services"
version.workspace = true
edition = "2021"
rust-version = "1.93.0"
authors = ["Synapse Rust Team"]
description = "Service layer for Synapse Rust"
license = "AGPL-3.0-only"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[features]
default = []
test-utils = ["synapse-common/test-utils", "synapse-storage/test-utils", "synapse-e2ee/test-utils", "synapse-federation/test-utils"]
core-private-chat = ["friends", "burn-after-read"]
friends = ["synapse-common/friends", "synapse-storage/friends", "synapse-federation/friends"]
voice-extended = ["synapse-common/voice-extended", "synapse-storage/voice-extended"]
saml-sso = ["synapse-common/saml-sso", "synapse-storage/saml-sso"]
cas-sso = ["synapse-common/cas-sso", "synapse-storage/cas-sso"]
beacons = ["synapse-common/beacons", "synapse-storage/beacons"]
voip-tracking = ["synapse-common/voip-tracking", "synapse-storage/voip-tracking"]
widgets = ["synapse-common/widgets", "synapse-storage/widgets"]
server-notifications = ["synapse-common/server-notifications", "synapse-storage/server-notifications"]
burn-after-read = ["synapse-common/burn-after-read", "synapse-storage/burn-after-read"]
privacy-ext = ["synapse-common/privacy-ext", "synapse-storage/privacy-ext"]
external-services = ["synapse-common/external-services", "synapse-storage/external-services"]
builtin-oidc = ["synapse-common/builtin-oidc", "synapse-storage/builtin-oidc", "dep:rsa"]

[dependencies]
synapse-common = { path = "../synapse-common" }
synapse-cache = { path = "../synapse-cache" }
synapse-storage = { path = "../synapse-storage" }
synapse-e2ee = { path = "../synapse-e2ee", default-features = false }
synapse-federation = { path = "../synapse-federation" }

tokio = { workspace = true, features = ["full", "test-util"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }

sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "chrono", "json", "uuid", "ipnetwork", "migrate", "macros"] }

redis = { workspace = true, features = ["tokio-rustls-comp"] }
deadpool-redis = { workspace = true }
moka = { workspace = true, features = ["future", "sync"] }
lru = "0.18.2"  # ≥0.18.2 修复 RUSTSEC-2026-0253 (pop() UAF) + RUSTSEC-2026-0002 (IterMut Stacked Borrows)

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_norway = { workspace = true }

rand = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true, features = ["oid"] }
hmac = { workspace = true }
base64 = { workspace = true }

argon2 = "0.6"
aes-gcm = "0.11"
jsonwebtoken = "9"
# ⚠️ 停在 0.9：`rsa 0.10` 至今只有 **rc.19**（2026-10-22 实测 crates.io），且它同时换掉
# `signature` / `pkcs1` / `pkcs8` 三代 trait，风险与其余五族不同量级 ⇒ 本批不动，
# 等 0.10.0 正式发版再单独一批。
# ⚠️ 与它交互**必须用 rsa 自带的 re-export**：`rsa::sha2::Sha256`（rsa 绑 digest 0.10，
# 本仓已到 digest 0.11，两个 `Sha256` 同名不同型）、`rsa::rand_core::OsRng`
# （rsa 绑 rand_core 0.6，本仓 `rand 0.9` 是 rand_core 0.9）。踩过两次。
# 只在 `builtin-oidc`（非默认 feature）下需要；`oidc_service` 的测试用 dev-dependency
# 单独引入，保证默认 `cargo test -p synapse-services` 仍能跑这些用例。
rsa = { version = "0.9", features = ["pem", "sha2"], optional = true }
# P-256 (NIST secp256r1) ECDSA for OIDC ES256 signing (RFC 7518 §3.4).
# - `arithmetic` feature: PublicKey::public_key() + to_sec1_point() for x/y export
# - `getrandom` feature: SecretKey::generate() via system CSPRNG (no rand_core needed)
# `p256 0.14` 已是 crates.io 上的最新稳定版（2026-10-22 实测）⇒ 本批无需改动。
p256 = { version = "0.14", features = ["arithmetic", "getrandom"] }

image = "0.25"
infer = "0.19.0"
x509-cert = "0.2"
ring = "0.17"


tracing = { workspace = true, features = ["attributes"] }
opentelemetry = { version = "0.31", features = ["metrics", "logs"] }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }

chrono = { workspace = true, features = ["serde"] }

thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
futures = { workspace = true }
dashmap = { version = "6.2", features = ["serde"] }
regex = { workspace = true }

reqwest = { workspace = true, features = ["json"] }

url = { workspace = true }
webp-animation = "0.10.0"

[dev-dependencies]
# atexit hook for the schema janitor: registered by this crate's **test** build only
# (B' — keeps the `unsafe` out of the production build).
libc = "0.2"
tempfile = "3"
wiremock = "0.6"
axum = { workspace = true }
serial_test = "3"
# 仅 `oidc_service` 的单元测试使用；`[dependencies]` 里是 builtin-oidc 才启用的
# optional 依赖，这里显式引入以免默认 feature 下测试构建缺 crate。
rsa = { version = "0.9", features = ["pem", "sha2"] }
