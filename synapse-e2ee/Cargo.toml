[package]
name = "synapse-e2ee"
version.workspace = true
edition = "2021"
rust-version = "1.93.0"
authors = ["Synapse Rust Team"]
description = "E2EE (End-to-End Encryption) module for Synapse Rust"
license = "AGPL-3.0-only"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[features]
default = []
test-utils = ["synapse-common/test-utils", "synapse-storage/test-utils"]

[dependencies]
synapse-common = { path = "../synapse-common" }
synapse-cache = { path = "../synapse-cache" }
synapse-storage = { path = "../synapse-storage" }

tokio = { workspace = true, features = ["full", "test-util"] }
async-trait = { workspace = true }

sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "chrono", "json", "uuid", "ipnetwork", "migrate", "macros"] }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

chrono = { workspace = true, features = ["serde"] }

thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
tracing = { workspace = true, features = ["attributes"] }

rand = { workspace = true }
sha2 = { workspace = true, features = ["oid"] }
hkdf = "0.13"
base64 = { workspace = true }
zeroize = { workspace = true }

aes-gcm = "0.11"
aes = "0.9"
ctr = "0.10"
chacha20poly1305 = "0.11"
ed25519-dalek = "2.0"

# ⚠️ vendored 上游库，**不随本仓升级节奏走**：`vodozemac 0.11` 自带自己的
# `ed25519-dalek 3` / `sha2 0.11` / `p256` 版本组合（它已经是 digest 0.11 世代）。
# 强行对齐只会制造重复依赖或版本冲突 ⇒ 本项目对 megolm/olm 的密码学**只用它的 API**，
# 不直接碰它内部的 RustCrypto 类型。
vodozemac = "0.11"

dashmap = { version = "6.2", features = ["serde"] }
