[package]
name = "synapse-e2ee"
version = "0.1.0"
edition = "2021"
rust-version = "1.93.0"
authors = ["Synapse Rust Team"]
description = "E2EE (End-to-End Encryption) module for Synapse Rust"
license = "AGPL-3.0-only"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[features]
default = []
test-utils = ["synapse-common/test-utils", "synapse-storage/test-utils"]

[dependencies]
synapse-common = { path = "../synapse-common" }
synapse-cache = { path = "../synapse-cache" }
synapse-storage = { path = "../synapse-storage" }

tokio = { workspace = true, features = ["full", "test-util"] }
async-trait = { workspace = true }

sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "chrono", "json", "uuid", "ipnetwork", "migrate", "macros"] }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

chrono = { workspace = true, features = ["serde"] }

thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
tracing = { workspace = true, features = ["attributes"] }

rand = { workspace = true }
sha2 = { workspace = true, features = ["oid"] }
hmac = { workspace = true }
hkdf = "0.12"
base64 = { workspace = true }
zeroize = { workspace = true }

aes-gcm = "0.10"
chacha20poly1305 = "0.10"
ed25519-dalek = "2.0"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
generic-array = "0.14"
typenum = "1"

vodozemac = "0.9"

dashmap = { version = "6", features = ["serde"] }
