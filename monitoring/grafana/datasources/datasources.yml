# =============================================================================
# Grafana 数据源配置
# =============================================================================
# 自动创建 Prometheus 数据源
# 位置：monitoring/grafana/datasources/datasources.yml
# =============================================================================

apiVersion: 1

# 删除已有的测试数据源
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Alertmanager
    orgId: 1

# 定义数据源
datasources:
  # -------------------------------------------------------------------------
  # 1. Prometheus 主数据源
  # -------------------------------------------------------------------------
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # HTTP 超时设置
      timeInterval: "15s"
      queryTimeout: "2m"
      # 查询优化
      cacheLevel: "Medium"
      # 直方图支持
      incrementInterval: "+1s"
    secureJsonData:
      tlsSkipVerify: false
    
    # 数据源 UID（可用于引用）
    uid: prometheus

  # -------------------------------------------------------------------------
  # 2. Loki 日志数据源（可选，如使用 Loki 日志栈）
  # -------------------------------------------------------------------------
  # - name: Loki
  #   type: loki
  #   access: proxy
  #   url: http://loki:3100
  #   isDefault: false
  #   jsonData:
  #     derivedFields:
  #       - datasourceUid: prometheus
  #         matcherRegex: "\\[(.+?)\\]"
  #         name: TraceID
  #         url: $${1}
  
  # -------------------------------------------------------------------------
  # 3. Alertmanager 数据源（用于告警可视化）
  # -------------------------------------------------------------------------
  - name: Alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData:
      implementation: prometheus
