# =============================================================================
# Prometheus 配置 - 开发栈变体（含 Mock 数据抓取）
# =============================================================================
# 位置：monitoring/prometheus/prometheus-with-mock.yml
#
# 用途：本地没有真实用户/流量时，让面板与告警有数据可看（联调自检用）。
#
# ⚠️ 与 monitoring/prometheus/prometheus.yml 的关系：
#   本文件是**开发变体**，唯一允许的差异是**多一个 `mock-*` job**。
#   其余 job 必须与 base 文件保持一致 —— 这条不变量由
#   `scripts/ci/check_prometheus_config.py` 守卫（防止第三份漂移副本）。
#
# ⚠️ 为什么 Mock 走 Pushgateway 而不是「文件」：
#   曾经写成 `static_configs.targets: ["file:///.../mock_synapse_metrics.prom"]`
#   + 同名 `file_sd_configs.files: ['.../*.prom']`，两者都是错的：
#     - `static_configs.targets` 只能是 `host:port`，`file://` 会被当成主机名去解析；
#     - `file_sd_configs` 的产物是**目标列表**（JSON/YAML 里的 targets/labels），
#       不是 Prometheus 文本格式的指标样本 → promtool 直接报
#       `path name "..." is not valid for file discovery`。
#   Prometheus **没有**「直接抓本地文件」的能力；一次性/离线指标的标准通道是
#   Pushgateway。用法见 scripts/mock-data/generate_mock_data.py。
# =============================================================================

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    monitor: "synapse-rust"
    env: "${ENVIRONMENT:-development}"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 10s

rule_files:
  - "/etc/prometheus/alerting-rules.yml"

scrape_configs:
  # ===========================================================================
  # 1. 真实服务 - Synapse-Rust
  # ===========================================================================
  - job_name: "synapse-rust"
    static_configs:
      - targets: ["synapse-rust:8008"]
    metrics_path: "/_prometheus/metrics"
    scrape_interval: 15s
    scrape_timeout: 10s
    relabel_configs:
      - target_label: env
        replacement: "${ENVIRONMENT:-development}"
      - source_labels: [__address__]
        target_label: instance
        replacement: "synapse-rust-main"
    metric_relabel_configs:
      # ⚠️ `drop` 而非 `keep`：keep 会把应用指标全丢掉（详见 prometheus.yml 注释）。
      - source_labels: [__name__]
        regex: '(go_.*|process_.*|promhttp_.*)'
        action: drop

  # ===========================================================================
  # 2. Mock 数据 - Pushgateway 通道（开发自检专用）
  # ===========================================================================
  # 依赖 docker/docker-compose.monitoring.yml 中的 `pushgateway` 服务。
  # 推送方式（由 generate_mock_data.py 生成文本后）：
  #   curl --data-binary @mock_synapse_metrics.prom \
  #        http://127.0.0.1:9091/metrics/job/mock-synapse/instance/dev
  - job_name: "mock-synapse"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
    metrics_path: "/metrics"
    scrape_interval: 30s
    scrape_timeout: 10s
    relabel_configs:
      # pushgateway 的 instance 标签由推送路径决定，这里补 env 便于与真实数据区分
      - target_label: env
        replacement: "development"

  # ===========================================================================
  # 3. Node Exporter
  # ===========================================================================
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
    metrics_path: "/metrics"
    scrape_interval: 30s
    scrape_timeout: 10s

  # ===========================================================================
  # 4. Prometheus 自身
  # ===========================================================================
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    metrics_path: "/metrics"
    scrape_interval: 30s
    scrape_timeout: 10s

  # ===========================================================================
  # 5. Alertmanager 自身
  # ===========================================================================
  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
    metrics_path: "/metrics"
    scrape_interval: 30s
    scrape_timeout: 10s
