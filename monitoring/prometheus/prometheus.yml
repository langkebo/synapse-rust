# =============================================================================
# Prometheus 配置文件
# =============================================================================
# 用于 synapse-rust 监控栈
# 位置: monitoring/prometheus/prometheus.yml
# =============================================================================

global:
  # 全局抓取间隔
  scrape_interval: 15s
  # 抓取超时时间
  scrape_timeout: 10s
  # 评估规则间隔
  evaluation_interval: 15s
  # 默认外部标签
  external_labels:
    monitor: "synapse-rust"
    env: "${ENVIRONMENT:-production}"

# 报警管理器配置
#
# ⚠️ 这里**只能**出现 Prometheus 侧认识的字面量：`static_configs` /
# `file_sd_configs` / `dns_sd_configs` / `scheme` / `timeout` / `api_version` /
# `path_prefix` / `bearer_token*` / `basic_auth` / `tls_config` 等。
#
# 曾误把 Alertmanager **自身** 的 `repeat_interval` / `send_resolved` 写在此处，
# 导致 `promtool check config` 直接失败：
#     field repeat_interval not found in type config.AlertmanagerConfig
#     field send_resolved not found in type config.AlertmanagerConfig
# Prometheus 会因配置非法而**拒绝启动**。
# 这两项的正确归属是 Alertmanager 的 `global` / `route`（本仓已写在
# monitoring/alertmanager/alertmanager.yml：global.repeat_interval = 4h，
# critical 子路由 1h），无需也无法在 Prometheus 侧重复声明。
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      # 采集/推送超时；Alertmanager 不可达时不影响 Prometheus 自身抓取
      timeout: 10s

# 规则文件
rule_files:
  - "/etc/prometheus/alerting-rules.yml"

# 抓取配置
#
# ⚠️ 纪律：这里**只声明真实存在的目标**。
#   一个指向不存在主机的 job 不会报错，只会永久 `down` 并让所有依赖它的面板静默
#   变成 No data（本仓 coturn 就是这样长期 down 而无人察觉）。因此下面刻意**没有**
#   postgres_exporter（db:9187）/ redis_exporter（redis:9121）/ Grafana 自监控：
#   `docker/docker-compose.monitoring.yml` 里并不存在这三个服务/凭据文件。
#   如需 DB / 缓存可观测性，请先在 compose 中加 exporter 服务，再回来补 job
#   （见 monitoring/DEPLOYMENT.md 的「后续项」）。
scrape_configs:
  # ===========================================================================
  # 1. Synapse-Rust 主服务
  # ===========================================================================
  - job_name: "synapse-rust"
    static_configs:
      - targets: ["synapse-rust:8008"]
    metrics_path: "/_prometheus/metrics"
    scrape_interval: 15s
    scrape_timeout: 10s
    relabel_configs:
      # 标记环境
      - target_label: env
        replacement: "${ENVIRONMENT:-production}"
      # 标记服务版本
      - target_label: version
        replacement: "${SYNAPSE_VERSION:-latest}"
      # 添加实例标签
      - source_labels: [__address__]
        target_label: instance
        replacement: "synapse-rust-main"
    metric_relabel_configs:
      # ⚠️ 必须是 `drop` 而不是 `keep`！
      # 这里曾是 `action: keep` + 正则 `(go_.*|process_.*|promhttp_.*)`，
      # 语义与注释（"过滤不需要的指标"）**完全相反**：keep 只保留 Go 运行时自带的
      # 三个前缀，把 synapse_* / http_requests_total / room_* / megolm_* 等
      # **全部应用指标丢掉** → 所有业务面板恒为 No data，且不报任何错。
      - source_labels: [__name__]
        regex: '(go_.*|process_.*|promhttp_.*)'
        action: drop

  # ===========================================================================
  # 2. Node Exporter (主机系统指标)
  # ===========================================================================
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
    metrics_path: "/metrics"
    scrape_interval: 30s
    scrape_timeout: 10s
    relabel_configs:
      - target_label: service
        replacement: "node-exporter"

  # ===========================================================================
  # 3. Prometheus 自身监控
  # ===========================================================================
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    metrics_path: "/metrics"
    scrape_interval: 30s
    scrape_timeout: 10s
    relabel_configs:
      - target_label: service
        replacement: "prometheus"

  # ===========================================================================
  # 4. Alertmanager 自身监控
  # ===========================================================================
  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
    metrics_path: "/metrics"
    scrape_interval: 30s
    scrape_timeout: 10s
    relabel_configs:
      - target_label: service
        replacement: "alertmanager"

# ===========================================================================
# 存储优化配置
# ===========================================================================
# 注意：以下配置通过命令行参数传递
# --storage.tsdb.retention.time=15d       # 数据保留 15 天
# --storage.tsdb.retention.size=10GB      # 最大存储 10GB
# --storage.tsdb.no-lockfile              # 禁用锁文件（Docker 场景）
# --storage.tsdb.wal-segment-size=128MB   # WAL 分段大小

# ===========================================================================
# 查询优化配置
# ===========================================================================
# --query.max-concurrency=20              # 最大并发查询数
# --query.timeout=2m                      # 查询超时
# --query.max-samples=50000000            # 最大样本数
# --query.lookback-delta=5m               # 回溯时间窗口

