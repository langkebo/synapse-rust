# Alertmanager 告警规则配置
# 对应 prometheus-custom-metrics.md Phase 3 实施
# 最后更新：2026-09-30

groups:
  - name: synapse-basic-health
    interval: 30s
    rules:
      # ======================================================================
      # CRITICAL: 基础健康检查
      # ======================================================================

      # HTTP 5xx 错误率 > 5%
      - alert: HighHTTPErrorRate
        expr: |
          sum(rate(http_requests_total{status_code=~"5.."}[5m]))
          /
          sum(rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
          category: http
        annotations:
          summary: "🚨 HTTP 5xx 错误率过高 (当前: {{ $value | humanizePercentage }})"
          description: "Synapse-Rust 服务器最近 5 分钟 HTTP 5xx 错误率为 {{ $value | humanizePercentage }}, 超过阈值 5%。\n实例：{{ $labels.instance }}\n立即检查服务日志和依赖项状态。"
          runbook_url: https://wiki.example.com/runbooks/synapse-http-errors

      # 服务不可用
      - alert: SynapseServiceDown
        expr: up{job="synapse-rust"} == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "🚨 Synapse-Rust 服务不可用"
          description: "Prometheus 无法连接到 Synapse-Rust 服务实例 {{ $labels.instance }}\n持续时间：{{ $value }} 秒\n请立即检查容器状态和网络连接。"

      # 数据库查询错误激增
      #
      # 指标口径：`db_query_errors` 由 `From<sqlx::Error> for ApiError` 递增，是本仓
      # **唯一**逐语句的数据库失败计数器。此前的 `db_queries_total{outcome="error"}`
      # 没有调用点（sqlx 的逐语句 tracing 事件只给 elapsed、不给成败），告警永不触发。
      - alert: HighDatabaseErrorRate
        expr: |
          rate(db_query_errors[5m]) > 10
        for: 2m
        labels:
          severity: critical
          category: database
        annotations:
          summary: "🚨 数据库查询错误率激增 ({{ $value }}/s)"
          description: "SYNAPSE 数据库查询错误率在 5 分钟内超过 10 次/秒\n请检查数据库连接和 SQL 语句。"

  - name: synapse-latency-slo
    interval: 30s
    rules:
      # ======================================================================
      # WARNING: 延迟 SLO 告警
      # ======================================================================

      # 房间创建 P99 > 5 秒
      - alert: SlowRoomCreation
        expr: |
          histogram_quantile(0.99,
            sum(rate(room_creation_duration_seconds_bucket[5m])) by (le)
          ) > 5
        for: 5m
        labels:
          severity: warning
          category: latency
        annotations:
          summary: "⚠️ 房间创建 P99 延迟过高 ({{ $value | humanizeDuration }})"
          description: "SYNAPSE 房间创建的 P99 延迟达到 {{ $value | humanizeDuration }}, 超过 SLO 阈值 5 秒\n影响范围：新用户创建房间体验严重下降\n建议：检查数据库性能和网络延迟"

      # 消息投递 P95 > 1 秒
      - alert: SlowMessageDelivery
        expr: |
          histogram_quantile(0.95,
            sum(rate(message_delivery_latency_seconds_bucket[5m])) by (le)
          ) > 1
        for: 10m
        labels:
          severity: warning
          category: latency
        annotations:
          summary: "⚠️ 消息投递 P95 延迟 > 1 秒 (当前：{{ $value | humanizeDuration }})"
          description: "SYNAPSE 消息投递端到端延迟 P95 超过 1 秒\n阶段分布:\n{{ range $labels.stage }}  - {{ $labels.stage }}: {{ $values.stage }}\n{{ end }}\n可能原因：队列积压、下游服务延迟"

      # Sync 延迟 P95 > 2 秒
      - alert: SlowSyncLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(sync_duration_ms_bucket[5m])) by (le)
          ) > 2000
        for: 5m
        labels:
          severity: warning
          category: latency
        annotations:
          summary: "⚠️ /sync 接口 P95 延迟 > 2 秒 (当前：{{ $value }}ms)"
          description: "SYNAPSE /sync 接口 P95 延迟达到 {{ $value }}ms, 超过 SLO 阈值 2000ms\n客户端类型影响:\n{{ range $labels.client_type }}  - {{ $labels.client_type }}: 受影响\n{{ end }}\n建议：优化事件处理和推送机制"

      # E2EE 握手延迟 P95 > 3 秒
      - alert: SlowE2EEHandshake
        expr: |
          histogram_quantile(0.95,
            sum(rate(e2ee_handshake_duration_seconds_bucket[5m])) by (le)
          ) > 3
        for: 10m
        labels:
          severity: warning
          category: encryption
        annotations:
          summary: "⚠️ E2EE 握手 P95 延迟 > 3 秒 (当前：{{ $value | humanizeDuration }})"
          description: "SYNAPSE E2EE 密钥交换 P95 延迟过高\n算法分布:\n{{ range $labels.algorithm }}  - {{ $labels.algorithm }}: {{ $values.algorithm }}\n{{ end }}\n可能原因：设备数量过多、网络延迟"

  - name: synapse-resource-utilization
    interval: 30s
    rules:
      # ======================================================================
      # WARNING: 资源利用率和容量告警
      # ======================================================================

      # 数据库连接池利用率 > 90%
      - alert: HighDatabaseConnectionUtilization
        expr: |
          db_connections_active / (db_connections_active + db_connections_idle) > 0.9
        for: 5m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: "⚠️ 数据库连接池利用率过高 ({{ $value | humanizePercentage }})"
          description: "SYNAPSE 数据库连接池接近耗尽\n活跃连接：{{ $labels.active }}\n空闲连接：{{ $labels.idle }}\n建议：增加连接池大小或优化查询性能"

      # 消息队列积压
      - alert: MessageQueueBacklog
        expr: message_queue_depth > 100
        for: 5m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: "⚠️ 消息队列积压严重 (depth={{ $value }})"
          description: "SYNAPSE 消息队列深度达到 {{ $value }}, 超过阈值 100\n持续堆积可能导致消息投递延迟增加\n建议：检查消费者性能和下游服务健康度"

      # Cache 命中率下降
      - alert: LowCacheHitRate
        expr: |
          sum(cache_operations_total{result="hit"}) /
          sum(cache_operations_total) < 0.8
        for: 10m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "⚠️ 缓存命中率下降 (当前：{{ $value | humanizePercentage }})"
          description: "SYNAPSE 整体缓存命中率下降到 {{ $value | humanizePercentage }}, 低于 80% 阈值\n缓存类型分布:\n{{ range $labels.cache_type }}  - {{ $labels.cache_type }}: {{ $values.cache_type }}\n{{ end }}\n建议：检查缓存失效策略和数据访问模式"

      # Redis 连接错误
      - alert: RedisConnectionErrors
        expr: |
          rate(cache_operations_total{backend="redis",result="error"}[5m]) > 5
        for: 2m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "🚨 Redis 连接错误频发 ({{ $value }}/s)"
          description: "SYNAPSE Redis 缓存后端错误率超过 5 次/秒\n可能原因：Redis 服务宕机、网络连接问题\n建议：立即检查 Redis 服务状态"

  - name: synapse-federation-health
    interval: 30s
    rules:
      # ======================================================================
      # WARNING: Federation 健康度告警
      # ======================================================================

      # Federation 错误率 > 10%
      - alert: HighFederationErrorRate
        expr: |
          sum(rate(federation_operations_total{result!="success"}[5m])) /
          sum(rate(federation_operations_total[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
          category: federation
        annotations:
          summary: "⚠️ Federation 操作错误率过高 ({{ $value | humanizePercentage }})"
          description: "SYNAPSE 对外 Federation 请求错误率达到 {{ $value | humanizePercentage }}\n目标服务器分布:\n{{ range $labels.target_server }}  - {{ $labels.target_server }}: {{ $values.target_server }}\n{{ end }}\n建议：检查远程服务器可达性和签名验证"

      # Federation 超时率上升
      - alert: HighFederationTimeoutRate
        expr: |
          sum(rate(federation_operation_duration_seconds_bucket{result=~"timeout"}[5m])) /
          sum(rate(federation_operation_duration_seconds_count[5m])) > 0.2
        for: 10m
        labels:
          severity: warning
          category: federation
        annotations:
          summary: "⚠️ Federation 请求超时率 > 20%"
          description: "SYNAPSE Federation 请求超时比例过高\n超时分类:\n{{ range $labels.timeout_class }}  - {{ $labels.timeout_class }}: {{ $values.timeout_class }}\n{{ end }}\n建议：检查网络质量和远程服务器性能"

  - name: synapse-business-metrics
    interval: 30s
    rules:
      # ======================================================================
      # INFO: 业务指标监控
      # ======================================================================

      # 房间创建失败率异常
      - alert: AbnormalRoomCreateFailureRate
        expr: |
          sum(rate(room_operations_total{operation="create",outcome="error"}[5m])) /
          sum(rate(room_operations_total{operation="create"}[5m])) > 0.05
        for: 5m
        labels:
          severity: info
          category: business
        annotations:
          summary: "ℹ️ 房间创建失败率异常 ({{ $value | humanizePercentage }})"
          description: "SYNAPSE 房间创建失败率达到 {{ $value | humanizePercentage }}\n错误类型分布:\n{{ range $labels.error_type }}  - {{ $labels.error_type }}: {{ $values.error_type }}\n{{ end }}\n建议：分析失败原因和用户行为模式"

      # 认证失败率突增
      - alert: SpikeInAuthFailures
        expr: |
          rate(auth_failures_total[5m]) > 2 * avg_over_time(rate(auth_failures_total[5m])[1h:])
        for: 10m
        labels:
          severity: info
          category: security
        annotations:
          summary: "ℹ️ 认证失败率突增至正常值的 2 倍"
          description: "SYNAPSE 认证失败率异常升高\n可能原因：暴力破解攻击、用户凭据变更、客户端版本问题\n建议：检查登录日志和安全日志"

      # E2EE 覆盖率下降
      - alert: E2EECoverageDrop
        expr: |
          sum(rate(messages_sent_total{encryption="true"}[1h])) /
          sum(rate(messages_sent_total[1h])) < 0.7
        for: 30m
        labels:
          severity: info
          category: encryption
        annotations:
          summary: "ℹ️ E2EE 加密覆盖率下降至 70% 以下"
          description: "SYNAPSE 仅有 {{ $value | humanizePercentage }} 的消息使用端到端加密\n建议：调查未加密消息的用户群体和房间类型"
