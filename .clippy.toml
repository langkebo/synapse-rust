# NOTE (audit E7 / CQ-04): these thresholds are consumed *only* by a `pedantic`
# clippy lint (`cognitive_complexity`, `type_complexity`,
# `single_char_binding_names`, `too_many_arguments`, `too_many_lines`).
# This workspace never enables the `pedantic` group — see `[lints.clippy]` /
# `[workspace.lints.clippy]` in Cargo.toml and the clippy step in
# `.github/workflows/ci.yml`, which pass `-D warnings` but no
# `-W clippy::pedantic`. Consequently the five thresholds below still enforce
# nothing *via clippy*; they are retained as intent for the day `pedantic` is
# adopted.
#
# Exception (CQ-04): `too-many-lines-threshold = 500` is now independently
# enforced in CI by `scripts/ci/check_file_size_ratchet.py` (job `repo-sanity`,
# step "File-size ratchet"), which reads `scripts/ci/file_size_baseline`. Keep
# this value and that script's THRESHOLD in sync.
cognitive-complexity-threshold = 25
type-complexity-threshold = 200
single-char-binding-names-threshold = 4
too-many-arguments-threshold = 7
too-many-lines-threshold = 500
