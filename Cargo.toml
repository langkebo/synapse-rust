[package]
name = "synapse-rust"
version = "6.2.0"
edition = "2021"
rust-version = "1.93.0"
authors = ["Synapse Rust Team"]
description = "Matrix Homeserver implemented in Rust"
license = "AGPL-3.0-only"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "allow"
todo = "warn"
unimplemented = "warn"
unused_async = "deny"
redundant_clone = "deny"
inefficient_to_string = "warn"
manual_ok_or = "deny"
map_unwrap_or = "deny"
if_not_else = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "warn"
redundant_else = "warn"

[features]
# P-056: `widgets` added to default — widget endpoints are required by the
#        deployment (WidgetManager / WidgetContainer).
# P-067: `external-services` added to default — admin external_service routes
#        must respond (previously 404 due to missing feature flag).
# H-6: `server` feature removed — it had zero `#[cfg(feature = "server")]` gates
#      in any crate, so the flag was dead (axum/tower-http are unconditional
#      dependencies in synapse-common's error.rs anyway).
default = ["core-private-chat", "widgets", "external-services", "beacons"]
performance-tests = []
test-utils = ["dep:synapse-test-utils", "synapse-services/test-utils", "synapse-storage/test-utils", "synapse-e2ee/test-utils", "synapse-federation/test-utils", "synapse-web/test-utils"]

# Non-core feature modules (can be disabled to produce a minimal build)
core-private-chat = ["friends", "burn-after-read", "synapse-web/core-private-chat"]
friends = ["synapse-services/friends", "synapse-web/friends"]
voice-extended = ["synapse-services/voice-extended", "synapse-web/voice-extended"]
saml-sso = ["synapse-services/saml-sso", "synapse-web/saml-sso"]
cas-sso = ["synapse-services/cas-sso", "synapse-web/cas-sso"]
beacons = ["synapse-services/beacons", "synapse-web/beacons"]
voip-tracking = ["synapse-services/voip-tracking", "synapse-storage/voip-tracking", "synapse-web/voip-tracking"]
widgets = ["synapse-services/widgets", "synapse-web/widgets"]
server-notifications = ["synapse-services/server-notifications", "synapse-web/server-notifications"]
burn-after-read = ["synapse-services/burn-after-read", "synapse-web/burn-after-read"]
privacy-ext = ["synapse-services/privacy-ext", "synapse-storage/privacy-ext", "synapse-web/privacy-ext"]
external-services = ["synapse-services/external-services", "synapse-web/external-services"]
builtin-oidc = ["synapse-services/builtin-oidc", "synapse-web/builtin-oidc"]

# Meta-feature: enable all extensions (default for backwards compatibility)
all-extensions = [
    "friends", "voice-extended",
    "saml-sso", "cas-sso",
    "beacons", "voip-tracking", "widgets", "server-notifications",
    "burn-after-read", "privacy-ext", "external-services",
    "builtin-oidc",
    "synapse-web/all-extensions"
]
[dependencies]
tokio = { version = "1.49", features = ["full", "test-util"] }
tokio-util = { version = "0.7", features = ["io"] }
async-trait = "0.1"

axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-gzip", "limit"] }
hyper = "1"
http = "1"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "chrono", "json", "uuid", "ipnetwork", "migrate", "macros", "bigdecimal"] }
ipnetwork = "0.20"

redis = { version = "0.29", features = ["tokio-rustls-comp"] }
deadpool-redis = "0.20"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

rand = "0.9"
sha1 = "0.10"
sha2 = { version = "0.10", features = ["oid"] }
hmac = "0.12"
base64 = "0.22"

ed25519-dalek = "2.0"

vodozemac = ">=0.10.0"

config = { version = "0.14", default-features = false, features = ["yaml", "convert-case"] }



tracing = { version = "0.1", features = ["attributes"] }
tracing-opentelemetry = "0.32"
opentelemetry = { version = "0.31", features = ["metrics", "logs"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

chrono = { version = "0.4", features = ["serde"] }

thiserror = "2.0"
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
bytes = "1"
regex = "1.10"
url = "2.5"
urlencoding = "2.1"

reqwest = { version = "0.12", features = ["json", "stream"] }
validator = { version = "0.20.0", features = ["derive"] }
infer = "0.19.0"
synapse-common = { path = "synapse-common" }
synapse-cache = { path = "synapse-cache" }
synapse-e2ee = { path = "synapse-e2ee", default-features = false }
synapse-federation = { path = "synapse-federation" }
synapse-services = { path = "synapse-services" }
synapse-storage = { path = "synapse-storage" }
synapse-test-utils = { path = "synapse-test-utils", optional = true }
synapse-web = { path = "synapse-web", default-features = false }

image = "0.25"
hex = "0.4.3"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }

# jemalloc 全局分配器：profiling feature 用于定位内存泄漏（OOM 排查）。
# 运行时由 MALLOC_CONF 控制采样/自动 dump，详见 docker/deploy/.env 的 MALLOC_CONF。
tikv-jemallocator = { version = "0.6", features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }

[dev-dependencies]
# atexit hook for the schema janitor: registered by this crate's **test** build only
# (B' — keeps the `unsafe` out of the production build).
libc = "0.2"
criterion = { version = "0.5", features = ["async_tokio"] }
fake = "2.9"
quickcheck = "1.0"
quickcheck_macros = "1.0"
tempfile = "3"
arbitrary = { version = "1", features = ["derive"] }
mockall = "0.13"
wiremock = "0.6"
# insta: snapshot testing for locking API output shapes
# Usage: see `.claude/skills/tdd-rust/SKILL.md` §5
insta = { version = "1.41", features = ["json", "redactions", "filters"] }

[profile.dev]
opt-level = 1
debug = true

[profile.test]
opt-level = 0
debug = 1
codegen-units = 256
incremental = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
# 保留行号表 + 关闭 strip：供 jemalloc prof 的 jeprof 符号化（地址 → 源码行）。
debug = "line-tables-only"
strip = false
incremental = false

[profile.bench]
inherits = "release"
debug = true
# 低内存配置：thin-lto + 多 codegen-units 防止 VM OOM
# release 编译（cargo build --release）依然保持高压制
lto = "thin"
codegen-units = 16

# release-perf：8GB+ CI 环境推荐使用的 profile
# 保留 release 的优化水平：opt-level=3 + full lto
[profile.release-perf]
inherits = "release"
lto = true
codegen-units = 1

[[bin]]
name = "bench_harness"
path = "scripts/bench_harness.rs"

[[bench]]
name = "performance_api_benchmarks"
path = "benches/performance_api_benchmarks.rs"
harness = false

[[bench]]
name = "performance_federation_benchmarks"
path = "benches/performance_federation_benchmarks.rs"
harness = false

[[bench]]
name = "performance_sliding_sync_benchmarks"
path = "benches/performance_sliding_sync_benchmarks.rs"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "performance_membership_benchmarks"
path = "benches/performance_membership_benchmarks.rs"
harness = false

# E4: DB-backed pagination gate. Deliberately has no `required-features` so the
# `benchmark.yml::pagination-perf-gate` job can run it with the default feature
# set (the in-memory pagination bench stays in `performance_api_benchmarks`).
[[bench]]
name = "performance_pagination_benchmarks"
path = "benches/performance_pagination_benchmarks.rs"
harness = false

[workspace]
members = [
    "synapse-common",
    "synapse-cache",
    "synapse-storage",
    "synapse-e2ee",
    "synapse-federation",
    "synapse-services",
    "synapse-test-utils",
    "synapse-web",
]
# `vendor/pastey` is a `[patch.crates-io]` fork (see the T-PASTE-PATCH note
# below) and is intentionally NOT a workspace member. It must still be listed
# here: without it, `cargo metadata` fails with "current package believes it's
# in a workspace when it's not", which takes down every tool built on
# `cargo metadata` (cargo-machete, cargo-deny, cargo-audit, rust-analyzer, ...).
exclude = ["vendor/pastey"]

# DC4: Centralized dependency version management.
# All crate members inherit versions from here; features are still declared
# per crate to avoid unnecessary compilation when feature sets differ (e.g. sqlx).
# Shared lint configuration. Crates opting in with `[lints] workspace = true`
# inherit these; the root package keeps its own `[lints.clippy]` block above
# until it is migrated too.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "allow"
todo = "warn"
unimplemented = "warn"
unused_async = "deny"
redundant_clone = "deny"
inefficient_to_string = "warn"
manual_ok_or = "deny"
map_unwrap_or = "deny"
if_not_else = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "warn"
redundant_else = "warn"

[workspace.dependencies]
tokio = { version = "1.49", features = ["full"] }
tokio-util = { version = "0.7" }
async-trait = "0.1"
axum = { version = "0.8" }
tower = "0.5"
tower-http = { version = "0.6" }
hyper = "1"
http = "1"
sqlx = { version = "0.8" }
redis = { version = "0.29" }
deadpool-redis = "0.20"
serde = { version = "1.0" }
serde_json = "1.0"
serde_yaml = "0.9"
rand = "0.9"
sha1 = "0.10"
sha2 = { version = "0.10" }
hmac = "0.12"
base64 = "0.22"
chrono = { version = "0.4" }
thiserror = "2.0"
uuid = { version = "1" }
futures = "0.3"
bytes = "1"
regex = "1.10"
url = "2.5"
urlencoding = "2.1"
reqwest = { version = "0.12" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
moka = { version = "0.12" }
parking_lot = "0.12"
zeroize = "1"
# Educe 0.7 replaces derivative 2.2: identical Debug derive API, removes RUSTSEC-2024-0401.
# Minimum Rust 1.89, project MSRV 1.93 ✓
# Migration: #[derive(... derivative::Derivative)] #[derivative(Debug)] → #[derive(... educe::Educe)] #[educe(Debug)]
#           #[derivative(Debug = "ignore")] → #[educe(Debug(ignore))]
educe = "0.7"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"
required-features = ["test-utils", "privacy-ext", "voice-extended", "voip-tracking", "beacons", "server-notifications"]

[[test]]
name = "unit"
path = "tests/unit/mod.rs"
required-features = ["test-utils"]

[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"
required-features = ["test-utils"]

[[test]]
name = "performance_manual"
path = "tests/performance/mod.rs"
required-features = ["performance-tests", "test-utils"]

# T-PASTE-PATCH: replace unmaintained paste (RUSTSEC-2024-0436) with the
# actively-maintained pastey fork (RUSTSEC-recommended replacement).
#
# Cargo's [patch.crates-io] requires the patch source crate's name to match
# the patched crate's name.  pastey is published as `pastey`, so we cannot
# patch `paste` directly.  We fork pastey 0.2.3 into `vendor/pastey/` with
# the package name changed to `paste`, allowing the redirect.
#
# Source files in `vendor/pastey/src/` are an exact copy of pastey 0.2.3
# (MIT/Apache-2.0 dual licence, https://github.com/as1100k/pastey) with
# only the `name` field in Cargo.toml changed from `pastey` to `paste`.
# All Rust source is byte-for-byte identical to upstream.
#
# Dependency chain being de-unmaintained:
#   synapse-rust (image 0.25)
#     └── exr 1.74.2
#         └── pulp 0.22.3
#             └── paste 1.0.15   ← unmaintained (RUSTSEC-2024-0436)
#                        ↓ (replaced by)
#             vendor/pastey v1.0.16   ← pastey 0.2.3 fork, name = "paste"
#
# The version number is bumped to 1.0.16 to avoid lockfile collisions with
# the unmaintained upstream 1.0.15; this makes the patch trivially visible
# in `cargo tree` and any rollback unambiguous.
#
# Source code in the workspace continues to use `use paste::paste;` exactly
# as before — zero code changes required.
[patch.crates-io]
paste = { path = "vendor/pastey" }
