[package]
name = "synapse-rust"
version = "6.2.0"
edition = "2021"
rust-version = "1.93.0"
authors = ["Synapse Rust Team"]
description = "Matrix Homeserver implemented in Rust"
license = "AGPL-3.0-only"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "allow"
todo = "warn"
unimplemented = "warn"
unused_async = "deny"
redundant_clone = "deny"
inefficient_to_string = "warn"
manual_ok_or = "deny"
map_unwrap_or = "deny"
if_not_else = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "warn"
redundant_else = "warn"

[features]
# P-056: `widgets` added to default — widget endpoints are required by the
#        deployment (WidgetManager / WidgetContainer).
# P-067: `external-services` added to default — admin external_service routes
#        must respond (previously 404 due to missing feature flag).
default = ["server", "core-private-chat", "widgets", "external-services", "beacons"]
server = ["dep:axum", "dep:tower-http"]
runtime-ddl = ["synapse-services/runtime-ddl", "synapse-storage/runtime-ddl"]
performance-tests = []
test-utils = ["synapse-services/test-utils"]

# Non-core feature modules (can be disabled to produce a minimal build)
core-private-chat = ["friends", "burn-after-read"]
friends = ["synapse-services/friends"]
voice-extended = ["server", "synapse-services/voice-extended"]
saml-sso = ["synapse-services/saml-sso"]
cas-sso = ["synapse-services/cas-sso"]
beacons = ["synapse-services/beacons"]
voip-tracking = ["synapse-services/voip-tracking", "synapse-storage/voip-tracking"]
widgets = ["synapse-services/widgets"]
server-notifications = ["synapse-services/server-notifications"]
burn-after-read = ["synapse-services/burn-after-read"]
privacy-ext = ["synapse-services/privacy-ext", "synapse-storage/privacy-ext"]
external-services = ["synapse-services/external-services"]
builtin-oidc = ["synapse-services/builtin-oidc"]

# Meta-feature: enable all extensions (default for backwards compatibility)
all-extensions = [
    "friends", "voice-extended",
    "saml-sso", "cas-sso",
    "beacons", "voip-tracking", "widgets", "server-notifications",
    "burn-after-read", "privacy-ext", "external-services",
    "builtin-oidc"
]

# OpenAPI documentation generation (Swagger UI at /_swagger)
openapi-docs = ["dep:utoipa", "dep:utoipa-swagger-ui"]

[dependencies]
tokio = { version = "1.49", features = ["full", "test-util"] }
tokio-util = { version = "0.7", features = ["io"] }
async-trait = "0.1"

axum = { version = "0.8", optional = true, features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", optional = true, features = ["fs", "cors", "trace", "compression-gzip", "limit"] }
hyper = "1"
http = "1"

# OpenAPI / Swagger UI (optional)
utoipa = { version = "5", features = ["axum_extras"], optional = true }
utoipa-swagger-ui = { version = "9", features = ["axum", "cache"], optional = true }

sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "chrono", "json", "uuid", "ipnetwork", "migrate", "macros", "bigdecimal"] }
ipnetwork = "0.20"

redis = { version = "0.29", features = ["tokio-rustls-comp"] }
deadpool-redis = "0.20"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

rand = "0.9"
sha1 = "0.10"
sha2 = { version = "0.10", features = ["oid"] }
hmac = "0.12"
base64 = "0.22"

ed25519-dalek = "2.0"

vodozemac = "0.9"

config = { version = "0.14", default-features = false, features = ["yaml", "convert-case"] }



tracing = { version = "0.1", features = ["attributes"] }
tracing-opentelemetry = "0.32"
opentelemetry = { version = "0.31", features = ["metrics", "logs"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

chrono = { version = "0.4", features = ["serde"] }

thiserror = "2.0"
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
bytes = "1"
regex = "1.10"
url = "2.5"
urlencoding = "2.1"

reqwest = { version = "0.12", features = ["json", "stream"] }
validator = { version = "0.20.0", features = ["derive"] }
infer = "0.19.0"
synapse-common = { path = "synapse-common" }
synapse-cache = { path = "synapse-cache" }
synapse-e2ee = { path = "synapse-e2ee", default-features = false }
synapse-federation = { path = "synapse-federation" }
synapse-services = { path = "synapse-services" }
synapse-storage = { path = "synapse-storage" }

image = "0.25"
hex = "0.4.3"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
fake = "2.9"
quickcheck = "1.0"
quickcheck_macros = "1.0"
tempfile = "3"
arbitrary = { version = "1", features = ["derive"] }
mockall = "0.13"
wiremock = "0.6"
# insta: snapshot testing for locking API output shapes
# Usage: see `.claude/skills/tdd-rust/SKILL.md` §5
insta = { version = "1.41", features = ["json", "redactions", "filters"] }

[profile.dev]
opt-level = 1
debug = true

[profile.test]
opt-level = 0
debug = 1
codegen-units = 256
incremental = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false

[profile.bench]
inherits = "release"
debug = true

[[bin]]
name = "bench_harness"
path = "scripts/bench_harness.rs"

[[bench]]
name = "performance_api_benchmarks"
path = "benches/performance_api_benchmarks.rs"
harness = false

[[bench]]
name = "performance_federation_benchmarks"
path = "benches/performance_federation_benchmarks.rs"
harness = false

[[bench]]
name = "performance_sliding_sync_benchmarks"
path = "benches/performance_sliding_sync_benchmarks.rs"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "performance_membership_benchmarks"
path = "benches/performance_membership_benchmarks.rs"
harness = false

[workspace]
members = [
    "synapse-common",
    "synapse-cache",
    "synapse-storage",
    "synapse-e2ee",
    "synapse-federation",
    "synapse-services",
]

# DC4: Centralized dependency version management.
# All crate members inherit versions from here; features are still declared
# per crate to avoid unnecessary compilation when feature sets differ (e.g. sqlx).
[workspace.dependencies]
tokio = { version = "1.49", features = ["full"] }
tokio-util = { version = "0.7" }
async-trait = "0.1"
axum = { version = "0.8" }
tower = "0.5"
tower-http = { version = "0.6" }
hyper = "1"
http = "1"
sqlx = { version = "0.8" }
redis = { version = "0.29" }
deadpool-redis = "0.20"
serde = { version = "1.0" }
serde_json = "1.0"
serde_yaml = "0.9"
rand = "0.9"
sha1 = "0.10"
sha2 = { version = "0.10" }
hmac = "0.12"
base64 = "0.22"
chrono = { version = "0.4" }
thiserror = "2.0"
uuid = { version = "1" }
futures = "0.3"
bytes = "1"
regex = "1.10"
url = "2.5"
urlencoding = "2.1"
reqwest = { version = "0.12" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
moka = { version = "0.12" }
parking_lot = "0.12"
zeroize = "1"
derivative = "2.2"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"
required-features = ["test-utils", "privacy-ext", "voice-extended", "voip-tracking", "beacons", "server-notifications"]

[[test]]
name = "unit"
path = "tests/unit/mod.rs"
required-features = ["test-utils"]

[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"
required-features = ["test-utils"]

[[test]]
name = "performance_manual"
path = "tests/performance/mod.rs"
required-features = ["performance-tests", "test-utils"]
