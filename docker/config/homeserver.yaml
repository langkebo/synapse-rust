server:
  name: "${SERVER_NAME:-localhost}"
  host: "0.0.0.0"
  port: 8008
  public_baseurl: "${PUBLIC_BASEURL:-http://localhost:8008}"
  signing_key_path: "/app/data/signing.key"
  macaroon_secret_key: "${MACAROON_SECRET:?MACAROON_SECRET is required}"
  form_secret: "${FORM_SECRET:?FORM_SECRET is required}"
  server_name: "${SERVER_NAME:-localhost}"
  registration_shared_secret: "${REGISTRATION_SECRET:?REGISTRATION_SECRET is required}"
  max_upload_size: 52428800
  # 单个请求的墙钟上限（秒）。缺省（不写）即 30s；长轮询端点（/sync、/events）另有
  # 上限（缺省 90s，并会与请求里的 ?timeout= 取较大者再加 15s 余量）。
  # 两者由 `request_timeout_middleware` 强制执行，超时返回 504 + M_REQUEST_TIMEOUT。
  # 调小它要连同媒体上传/大 body 请求与联邦入站一起评估。
  # request_timeout_secs: 30
  # long_poll_request_timeout_secs: 90
  max_image_resolution: 8000000
  # 生产栈默认**关闭**开放注册：任何人都可自助注册会带来垃圾账号/资源耗尽风险。
  # 需要开放时用 `SYNAPSE__SERVER__ENABLE_REGISTRATION=true` 显式覆盖
  # （bool 字段无法在 YAML 里用 `${VAR}` 插值，只能走 `SYNAPSE__` 环境变量）。
  enable_registration: false
  enable_registration_captcha: false
  background_tasks_interval: 300
  expire_access_token: true
  expire_access_token_lifetime: 86400
  refresh_token_sliding_window_size: 3600
  warmup_pool: true
  # 可选：服务端 megolm at-rest 密钥（保护**本仓库自有扩展**存储的 megolm 会话）。
  # Matrix 规范不要求 homeserver 持有 megolm 密钥（Megolm 是客户端棘轮；服务器只存
  # 不透明密文、key backup 也是客户端加密的 blob），上游 Synapse 无需此键即可启动。
  # 故默认不配置：未设置时从 server.macaroon_secret_key 派生并打 warn；只有**显式
  # 配置却读不出/非 base64/长度不对**才拒绝启动。显式配置可让该密钥与 macaroon
  # 轮换解耦（轮换 macaroon 会使已存的服务端 megolm 行不可解密）。
  # megolm_encryption_key_path: "/app/data/megolm.key"
  # 服务端 megolm 轮换执行器的**设备身份**（`key_rotation_log.device_id` 是 NOT NULL）。
  # 未配置 = 不执行服务端侧 megolm 轮换（执行器不启动并 warn 一次）—— 这是默认，
  # 也正是适合"按 Matrix 规范把 megolm 留在客户端"的部署的状态。
  # 只有本部署确实持有**服务端侧** megolm 会话（bridge / server-side-Megolm）时才需要设置，
  # 值为服务器自己这台"设备"的设备号；刻意不提供合成默认值（合成值在审计日志里与真值不可区分）。
  # megolm_device_id: "SERVER_MEGOLM"
  # Background-task tuning (seconds). Defaults shown; 0 falls back to compile-time constant.
  # federation_retry_max_count: 5
  # drain_timeout_secs: 30
  # megolm_cleanup_interval_secs: 21600
  # pruning_interval_secs: 86400
  # Scheduled DB housekeeping intervals (seconds).
  # health_check_interval_secs: 10
  # performance_check_interval_secs: 300
  # integrity_check_interval_secs: 3600
  # maintenance_interval_secs: 86400

rate_limit:
  # ⚠️ 测试/调试阶段关闭（与 `docker/config/rate_limit.yaml` 的 `enabled` 保持一致）。
  # 本字段只在**没有** rate_limit.yaml 时作为回退值生效；两处同时为 false 是为了让
  # "限流开着还是关着" 在一个 `grep '^enabled'` 里就能看清，避免只改一处造成错觉。
  # ✅ 正式部署前两处都要改回 true（自检见 rate_limit.yaml 顶部注释）。
  enabled: false
  default:
    per_second: 20
    burst_size: 40
  # 举报端点 per-user 限流（handler 直接读本段；限流中间件的生效值在 rate_limit.yaml）。
  # 上游 #20036 对 /rooms/{room_id}/report 应用 rc_reports 限流；路径中间件不支持
  # 精确匹配 /rooms/*/report，故在 handler 内按用户取桶。
  rc_reports:
    per_second: 1
    burst_size: 10
  # ⚠️ 本段两半各有来源，不要只看一处：
  # - **限流中间件**：本段运行时**不生效** —— 服务以 RATE_LIMIT_CONFIG_PATH 指向的
  #   `rate_limit.yaml` 整体**替换**（replace，不是字段级合并）整个 `rate_limit:` 段
  #   （见 `synapse-web/src/middleware/rate_limit.rs`）。限流的真正生效值见
  #   `docker/config/rate_limit.yaml`。
  # - **登录锁定**：本段**生效** —— `synapse-web/src/routes/auth_compat.rs` 直接读
  #   `ctx.config.rate_limit`（即本文件这一半）的 `trust_forwarded` /
  #   `ip_header_priority` / `trusted_proxies`，并接受 `SYNAPSE__RATE_LIMIT__*`
  #   环境变量覆盖。要让代理后的真实 IP 生效，两处都要改（见
  #   `docs/audit/DEPLOY_ACTIONS_2026-09-18.md` §G）。
  endpoints: []
  ip_header_priority:
    - "x-forwarded-for"
    - "x-real-ip"
    - "forwarded"
  # 代理信任（登录锁定的客户端 IP 取值也走这里）。子网必须等于 docker compose
  # 网络的 ipam 子网，见 `docker/docker-compose.yml` 的 `networks.synapse-network`。
  trust_forwarded: true
  trusted_proxies:
    - "192.168.97.0/24"
  include_headers: true
  exempt_paths:
    - "/"
    - "/_matrix/client/versions"
  exempt_path_prefixes: []
  endpoint_aliases: {}
  fail_open_on_error: false
  sync:
    enabled: true
    initial:
      per_second: 2
      burst_size: 4
    incremental:
      per_second: 20
      burst_size: 40

database:
  host: "postgres"
  port: 5432
  username: "${DB_USER:-synapse}"
  password: "${DB_PASSWORD:?DB_PASSWORD is required}"
  name: "${DB_NAME:-synapse}"
  # Note: pool_size field removed (2026-09-17, H-1). It was a false knob
  # — actual upper bound is max_size (default 50). See DB_REVIEW_2026-09-17.md §1.
  max_size: 50
  min_idle: 10
  connection_timeout: 60
  # Pool lifetime / idle timeout (seconds). Defaults shown.
  max_lifetime_secs: 1800
  idle_timeout_secs: 600
  min_idle_floor: 5
  # PG session-level timeouts (seconds). 0 disables.
  statement_timeout_secs: 30
  lock_timeout_secs: 10
  idle_in_transaction_timeout_secs: 60

redis:
  host: "redis"
  port: 6379
  password: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
  key_prefix: "${REDIS_KEY_PREFIX:-synapse:}"
  pool_size: 20
  enabled: true
  connection_timeout_ms: 5000
  command_timeout_ms: 3000

logging:
  level: "${RUST_LOG:-info}"
  format: "text"

search:
  enabled: false
  elasticsearch_url: "http://localhost:9200"

# MSC3806 — content scanner for uploads. Optional components are **explicitly**
# disabled rather than left absent, so "no filtering" is a visible decision.
# To enable: set `enabled: true`, choose `scanner_type` (`clam_av` or `webhook`)
# and configure its endpoint (ClamAV socket/host+port, or `webhook_url`).
# When enabled, an unsafe verdict blocks the upload with 403 M_FORBIDDEN and a
# scanner failure blocks it fail-closed.
content_scanner:
  enabled: false

federation:
  enabled: true
  allow_ingress: true
  server_name: "${SERVER_NAME:-localhost}"
  federation_port: 8448
  max_transaction_payload: 10485760
  signing_key: "${FEDERATION_SIGNING_KEY:?FEDERATION_SIGNING_KEY is required}"
  key_id: "${FEDERATION_KEY_ID:-ed25519:local}"
  signing_key_master_key: "${FEDERATION_MASTER_KEY:-}"
  allow_plaintext_signing_keys: false
  trusted_key_servers:
    - server_name: "matrix.org"
  signature_cache_ttl: 3600
  key_cache_ttl: 3600
  key_rotation_grace_period_ms: 600000
  key_fetch_max_concurrency: 32
  key_fetch_timeout_ms: 5000
  process_inbound_edus: true
  inbound_edus_max_per_txn: 100
  inbound_edu_max_concurrency: 32
  inbound_edu_acquire_timeout_ms: 1000
  inbound_edu_per_origin_max_concurrency: 8
  process_inbound_presence_edus: true
  inbound_presence_updates_max_per_txn: 50
  inbound_presence_backoff_ms: 15000
  join_max_concurrency: 16
  join_acquire_timeout_ms: 2000

security:
  secret: "${SECRET_KEY:?SECRET_KEY is required}"
  expiry_time: 86400
  refresh_token_expiry: 604800
  # P1-02: lowered from m=65536/t=3 to m=32768/t=2 to cut per-login Argon2 cost.
  # Only affects newly created hashes; existing hashes keep their embedded params.
  argon2_m_cost: 32768
  argon2_t_cost: 2
  argon2_p_cost: 4
  allow_legacy_hashes: false
  login_failure_lockout_threshold: 5
  login_lockout_duration_seconds: 300
  # 渐进退避上限：第 1 档 = login_lockout_duration_seconds，之后每在锁定状态下再试
  # 一次升一档（×2），封顶本值。固定等长锁定既拦不住持续爆破，又对误操作用户同等伤害。
  login_lockout_max_duration_seconds: 3600
  # 登录失败锁定总开关。
  #
  # ⚠️ 当前为 **false**：测试/调试阶段与限流一起关闭（用户 2026-10-18 指示）。
  # 关闭后 `check_login_lockout` 直接放行、`record_login_failure` 不计数，
  # 联调/压测不会再被 429 打断；代价是暴力破解防护为零，**只允许本机/内网测试环境**。
  # 启动时会打印一次 `WARN ... Login lockout is DISABLED`。
  #
  # ✅ 正式部署前必须改回 true。
  # 需要现场复核 I-03 行为（前 5 次 403 M_FORBIDDEN、第 6 次 429 且
  # retry_after_ms = login_lockout_duration_seconds）时，也临时改 true。
  login_lockout_enabled: false
  # 单个出口 IP 的登录失败上限（跨用户名聚合，SEC-05）。
  # 必须 ≥ login_failure_lockout_threshold，否则更具体的桶永远先触发。
  login_lockout_max_ip_attempts: 30
  # 登录锁定豁免名单（IP 或 CIDR）。**默认空** —— 放宽必须是显式动作。
  #
  # 为什么需要：按 IP 聚合的锁定会把同一出口的**所有**用户名一起拒掉
  # （默认 30 次 / 300 秒）。CI runner、内网 NAT、本机联调都在这个出口后面，
  # 一旦被锁，自动化登录全部失败 —— 2026-10-10 实测 API 全量测试因此静默
  # 降级为匿名探测却仍报「100/100 优秀」。
  #
  # 注意：豁免只作用于**锁定**（不拒绝、不计数）；密码校验与限流照常生效。
  # ⚠️ 本字段**不能**用 SYNAPSE__... 环境变量覆盖（实测 config crate 对
  #    Vec<String> 的 env 覆盖不可用），只能写在这里。
  # 下面两条只放行回环地址（外部不可达，安全）；跑测试的出口 IP 请按需追加，
  # 例如 CI runner 出口或内网网段：
  #   - 192.168.0.0/16
  #   - 203.0.113.7
  login_lockout_ip_allowlist:
    - 127.0.0.1/32
    - ::1/128
  # C9: 管理员 MFA 的 TOTP 共享密钥（base32）。默认空——dev 栈不设置
  # ADMIN_MFA_SHARED_SECRET 时 admin_mfa_required 保持 false；部署栈由
  # docker-compose 注入 SYNAPSE__SECURITY__ADMIN_MFA_REQUIRED=true 并强制本项非空。
  admin_mfa_shared_secret: "${ADMIN_MFA_SHARED_SECRET:-}"

admin_registration:
  enabled: true
  shared_secret: "${ADMIN_SECRET:?ADMIN_SECRET is required}"
  nonce_timeout_seconds: 60
  allow_external_access: false
  production_only: false

worker:
  enabled: false
  # ⚠️ 必须是 `${WORKER_INSTANCE_NAME:-master}` 而不是字面量 "master"：`resolve_env_variables`
  # 会解析这个占位符（`worker.instance_name` 在它的覆盖列表里），于是多进程栈里每个 worker
  # 服务设的 `WORKER_INSTANCE_NAME` 才能真正改变**该进程自称的实例名**
  # （`current_instance_worker_type` / `global_maintenance_owner` / 注册行都读它）。
  # 写成字面量时那 5 个 worker 进程会**全部自称 master**，per-service 的实例名成了摆设。
  # 不设环境变量时解析结果仍是 "master" ⇒ 单进程部署零变化。
  instance_name: "${WORKER_INSTANCE_NAME:-master}"
  # W-B：静态拓扑校验发现 error 时是否拒绝启动。
  #   默认 false = 与既有部署行为一致（校验结果只打 warn，进程照常启动）；
  #   设为 true 后非法 worker 配置会让进程**启动即失败**，而不是把错误推迟到
  #   运行期以「事件不落库」的形式暴露。
  #   部署前想先拿到退出码（不改运行时行为）可用：
  #     synapse-rust --validate-topology   # 0=可部署 1=配置有错 2=配置加载失败
  topology:
    strict: false
  # W-F：把「本实例拥有哪些路由」从注释级声明变成**可执行的准入**。
  #   默认 false ⇒ 与既有部署完全一致（任何实例都能应答全部路由）。
  #   设 true 且本实例**不是 master** 时，凡不属于其角色前缀的路径一律 404 M_NOT_FOUND；
  #   前缀表 = `WorkerType::owned_route_prefixes`（`synapse-storage/src/worker/models.rs`），
  #   匹配规则（`*` = 一段或多段）与放行清单（`/health`、`/metrics`、`/versions`、
  #   `.well-known/*`）见 `synapse-services/src/worker/surface_gate.rs`。
  #   ⇒ 反代才能真的把 `/_matrix/client/*/sync` 只打到 sync 实例，而不是"打过去 502"。
  #   ⚠️ master 永不受限；参考栈里的 `synapse_worker` 进程**只开 /metrics、不读这个开关**。
  #   要做请求分流，必须以**根二进制**起每个角色（各自 port + WORKER_INSTANCE_NAME）。
  surface_gate: false
  # ── 参考多进程拓扑（W-D）─────────────────────────────────────────────────
  # 以下键**只在 SYNAPSE__WORKER__ENABLED=true 时生效**：单进程部署走
  # `worker.enabled: false` 的早退分支（校验直接 valid），instance_map 没有消费者。
  # 多进程栈：
  #   docker compose -f docker/docker-compose.yml -f docker/docker-compose.workers.yml up -d
  #
  # ⚠️ 这里**故意不声明 background_worker**：`global_maintenance_owner()` 只要发现有实例
  #    名为 background_worker，就把「全局维护」（prune / appservice 调度 …）的归属判给它；
  #    而本仓的 worker 进程（`synapse_worker`）只消费 Redis 队列、**不跑那些维护任务**
  #    ⇒ 声明它等于让维护静默停摆（master 会因为"归属不是我"而跳过，见
  #    `should_run_global_maintenance` 的调用点）。要加它，必须让**根二进制**以
  #    WORKER_INSTANCE_NAME=background_worker 运行，或先统一 duty 模型（审计 W-7）。
  #
  # host/port 是**声明**而非连接参数：本仓 instance_map 的消费者只有拓扑校验与运行时
  # 对账（谁"应该在场"），没有按它建连的代码；容器栈里写服务名便于运维对照。
  instance_map:
    client_reader:
      host: "client_reader"
      port: 8008
      tls: false
    event_persister:
      host: "event_persister"
      port: 8008
      tls: false
    sync_worker:
      host: "sync_worker"
      port: 8008
      tls: false
    federation_reader:
      host: "federation_reader"
      port: 8008
      tls: false
    media_repository:
      host: "media_repository"
      port: 8008
      tls: false
  replication:
    enabled: true
    server_name: "${SERVER_NAME:-localhost}"
    http:
      enabled: true
      host: "127.0.0.1"
      port: 9093
      secret: "${WORKER_REPLICATION_SECRET:?WORKER_REPLICATION_SECRET is required}"

cors:
  allowed_origins:
    - "https://matrix.test"
    - "https://element.test"
    - "http://localhost:8008"
    - "http://127.0.0.1:8008"
    - "http://localhost:6130"
    - "http://127.0.0.1:6130"
    - "tauri://localhost"
    - "https://tauri.localhost"
    - "vector://vector"
    - "vector://riot"

  allow_credentials: true
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "Authorization"
    - "Content-Type"
    - "Accept"
    - "Origin"
    - "X-Requested-With"
  max_age_seconds: 3600

voip:
  turn_uris:
    - "turn:matrix.test:3478?transport=udp"
    - "turn:matrix.test:3478?transport=tcp"
    - "turns:matrix.test:5349?transport=tcp"
  # 必须与本地 coturn 的 static-auth-secret 一致（见 /Users/ljf/Desktop/hu_ts/coturn/turnserver.conf）
  # 必填：不提供 TURN_SHARED_SECRET 时启动即报错，避免使用弱默认密钥。
  turn_shared_secret: "${TURN_SHARED_SECRET:?TURN_SHARED_SECRET is required}"
  turn_user_lifetime: "1h"
  turn_allow_guests: false
  stun_uris:
    - "stun:matrix.test:3478"

url_preview:
  enabled: false

push:
  enabled: false

retention:
  lifecycle_cleanup_enabled: true
  lifecycle_cleanup_interval_secs: 900
  audit_retention_days: 30

telemetry:
  enabled: true
  service_name: "synapse-rust"
  service_version: "6.0.4"
  service_namespace: "matrix"
  trace_enabled: false
  metrics_enabled: true
  logs_enabled: false
  otlp_endpoint: "${OTLP_ENDPOINT:-http://otel-collector:4317}"
  sampling_ratio: 0.1
  batch_export: true
  export_timeout_seconds: 30
  max_queue_size: 2048
  max_export_batch_size: 512
  scheduled_delay_millis: 5000
  resource_attributes:
    deployment.environment: "production"
    service.instance.id: "${HOSTNAME:-synapse-rust}"

prometheus:
  enabled: true
  port: 9090
  path: "/metrics"
