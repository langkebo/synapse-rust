enabled: true
default:
  per_second: 500
  burst_size: 1000
endpoints:
  - path: "/_matrix/client/versions"
    rule:
      per_second: 100
      burst_size: 300
  - path: "/.well-known/matrix/client"
    rule:
      per_second: 100
      burst_size: 300
  - path: "/.well-known/matrix/server"
    rule:
      per_second: 100
      burst_size: 300
  - path: "/health"
    rule:
      per_second: 100
      burst_size: 300
  - path: "/_matrix/client/v3/login"
    match_type: "prefix"
    rule:
      per_second: 50
      burst_size: 100
  - path: "/_matrix/client/r0/login"
    match_type: "prefix"
    rule:
      per_second: 50
      burst_size: 100
  - path: "/_matrix/client/v3/register"
    match_type: "prefix"
    rule:
      per_second: 5
      burst_size: 10
  - path: "/_matrix/client/v3/account/password"
    match_type: "prefix"
    rule:
      per_second: 5
      burst_size: 10
  - path: "/_matrix/client/v3/register/email/requestToken"
    match_type: "prefix"
    rule:
      per_second: 5
      burst_size: 10
  - path: "/_matrix/client/v3/refresh"
    match_type: "prefix"
    rule:
      per_second: 20
      burst_size: 50
  - path: "/_matrix/client/v3/keys/upload"
    match_type: "prefix"
    rule:
      per_second: 50
      burst_size: 100
ip_header_priority:
  - "x-forwarded-for"
  - "x-real-ip"
  - "forwarded"
include_headers: true
exempt_paths:
  - "/"
  - "/metrics"
  - "/_matrix/client/v3/sync"
  - "/_matrix/client/r0/sync"
  - "/_matrix/client/v3/events"
  - "/_matrix/client/r0/events"
exempt_path_prefixes:
  - "/_matrix/client/v3/sync"
  - "/_matrix/client/r0/sync"
  - "/_matrix/client/v3/events"
  - "/_matrix/client/r0/events"
endpoint_aliases: {}
fail_open_on_error: true
sync:
  enabled: true
  initial:
    per_second: 50
    burst_size: 100
  incremental:
    per_second: 500
    burst_size: 1000
