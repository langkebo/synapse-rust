# =============================================================================
# ✅ 限流已开启（`enabled: true`）。
# =============================================================================
# 本文件是限流中间件的**唯一生效配置**：`RATE_LIMIT_CONFIG_PATH` 指向它，
# 加载后整体**替换** homeserver.yaml 的 `rate_limit:` 段（replace，不是合并）。
# 因此这里的 `enabled` 一旦为 false，中间件对每个请求直接放行，
# 下面所有 `default` / `endpoints` / `sync` 规则**全部不生效**。
#
# 历史：测试/调试阶段曾整体关闭（联调/压测/API 全量测试会被限流误伤成 429），
# 现已恢复开启。若再次关闭，需同时改 homeserver.yaml 的 `rate_limit.enabled`，
# 并接受批量脚本（api_test / k6）与登录锁定共用 IP 桶带来的误伤。
#
# 自检：`grep -n '^enabled:' docker/config/rate_limit.yaml` 必须是 true；
#    `docker compose logs synapse | grep -i 'rate limit'` 不得出现 "DISABLED"。
# `trust_forwarded` / `trusted_proxies` 已按部署网络子网配置，桶按真实客户端 IP 聚合。
# =============================================================================
enabled: true
default:
  per_second: 500
  burst_size: 1000
endpoints:
  - path: "/_matrix/client/versions"
    rule:
      per_second: 100
      burst_size: 300
  - path: "/.well-known/matrix/client"
    rule:
      per_second: 100
      burst_size: 300
  - path: "/.well-known/matrix/server"
    rule:
      per_second: 100
      burst_size: 300
  - path: "/health"
    rule:
      per_second: 100
      burst_size: 300
  - path: "/_matrix/client/v3/login"
    match_type: "prefix"
    rule:
      per_second: 50
      burst_size: 100
  - path: "/_matrix/client/r0/login"
    match_type: "prefix"
    rule:
      per_second: 50
      burst_size: 100
  - path: "/_matrix/client/v3/register"
    match_type: "prefix"
    rule:
      per_second: 5
      burst_size: 10
  # 验证码状态查询是**只读轮询**端点（客户端等待短信/邮件时反复查询），
  # 不应与注册尝试共享 5/s 的桶，否则正常轮询会被 429 误伤。
  - path: "/_matrix/client/v3/register/captcha/status"
    rule:
      per_second: 20
      burst_size: 40
  - path: "/_matrix/client/v3/account/password"
    match_type: "prefix"
    rule:
      per_second: 5
      burst_size: 10
  - path: "/_matrix/client/v3/register/email/requestToken"
    match_type: "prefix"
    rule:
      per_second: 5
      burst_size: 10
  - path: "/_matrix/client/v3/refresh"
    match_type: "prefix"
    rule:
      per_second: 20
      burst_size: 50
  - path: "/_matrix/client/v3/keys/upload"
    match_type: "prefix"
    rule:
      per_second: 50
      burst_size: 100
ip_header_priority:
  - "x-forwarded-for"
  - "x-real-ip"
  - "forwarded"
# 代理信任（I-03 配套）。**只有** 当请求的对端地址落在 `trusted_proxies` 内时才采信
# 上面的转发头；否则一律用 TCP 对端地址。
#
# 为什么必须配：应用在 nginx 之后，裸看对端地址会把**所有**客户端算成 nginx 的
# 容器 IP，于是按 IP 的限流桶、登录锁定桶都变成"全站一个桶"——
# 一个攻击者打满 30 次，全站登录被一起锁死（这也正是联调报告里
# "登录失败不限流/或者所有人一起被锁"两种相反现象的同一个根因）。
#
# 取值 = docker compose 网络子网（`docker/docker-compose.yml` 的
# `networks.synapse-network.ipam.config.subnet`，默认 192.168.97.0/24）。
# 改子网必须同步改这里，否则转发头被忽略（症状：限流桶又回到 nginx 上）。
#
# 生效时机：仅当本文件 `enabled: true` 时；测试阶段的登录锁定另由
# `security.login_lockout_enabled` 控制（见 homeserver.yaml）。
trust_forwarded: true
trusted_proxies:
  - "192.168.97.0/24"
include_headers: true
exempt_paths:
  - "/"
  - "/metrics"
  - "/_matrix/client/v3/sync"
  - "/_matrix/client/r0/sync"
  - "/_matrix/client/v3/events"
  - "/_matrix/client/r0/events"
exempt_path_prefixes:
  - "/_matrix/client/v3/sync"
  - "/_matrix/client/r0/sync"
  - "/_matrix/client/v3/events"
  - "/_matrix/client/r0/events"
endpoint_aliases: {}
# fail-closed: 限流后端出错（或 Redis 不可用）时拒绝请求，不放行。
# 与 homeserver.yaml 的 rate_limit.fail_open_on_error 保持一致。
fail_open_on_error: false
sync:
  enabled: true
  initial:
    per_second: 50
    burst_size: 100
  incremental:
    per_second: 500
    burst_size: 1000
