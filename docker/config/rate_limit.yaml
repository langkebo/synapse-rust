enabled: true
default:
  per_second: 50
  burst_size: 100
endpoints:
  - path: "/_matrix/client/versions"
    rule:
      per_second: 10
      burst_size: 30
  - path: "/.well-known/matrix/client"
    rule:
      per_second: 10
      burst_size: 30
  - path: "/.well-known/matrix/server"
    rule:
      per_second: 10
      burst_size: 30
  - path: "/health"
    rule:
      per_second: 10
      burst_size: 30
  - path: "/_matrix/client/v3/login"
    match_type: "prefix"
    rule:
      per_second: 5
      burst_size: 50
  - path: "/_matrix/client/r0/login"
    match_type: "prefix"
    rule:
      per_second: 5
      burst_size: 50
  - path: "/_matrix/client/v3/register"
    match_type: "prefix"
    rule:
      per_second: 1
      burst_size: 10
  - path: "/_matrix/client/v3/account/password"
    match_type: "prefix"
    rule:
      per_second: 1
      burst_size: 3
  - path: "/_matrix/client/v3/register/email/requestToken"
    match_type: "prefix"
    rule:
      per_second: 1
      burst_size: 3
  - path: "/_matrix/client/v3/refresh"
    match_type: "prefix"
    rule:
      per_second: 2
      burst_size: 5
  - path: "/_matrix/client/v3/keys/upload"
    match_type: "prefix"
    rule:
      per_second: 5
      burst_size: 10
ip_header_priority:
  - "x-forwarded-for"
  - "x-real-ip"
  - "forwarded"
include_headers: true
exempt_paths:
  - "/"
exempt_path_prefixes:
  - "/_matrix/client/v3/sync"
  - "/_matrix/client/r0/sync"
  - "/_matrix/client/v3/events"
  - "/_matrix/client/r0/events"
endpoint_aliases: {}
fail_open_on_error: false
sync:
  # 本地开发用宽松值：关闭专用 sync 限流，避免在 https://matrix.test 上
  # 反复登录/抓包/压力试验时吃假阳性 429。
  #
  # ⚠️ 这**不是**生产设置。`/sync` 被路由 ledger 标记为 rate_limit_exempt，
  # 不受通用 IP 限流约束，因此本段是它唯一的限流来源；关闭后 `timeout=0`
  # 紧循环可无限刷（实测 120/120 全 200）。
  # 生产取值见 `docker/deploy/config/rate_limit.yaml`（enabled: true）。
  enabled: false
  initial:
    per_second: 5
    burst_size: 10
  incremental:
    per_second: 50
    burst_size: 100
