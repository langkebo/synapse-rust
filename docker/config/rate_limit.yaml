enabled: true
default:
  per_second: 500
  burst_size: 1000
endpoints:
  - path: "/_matrix/client/versions"
    rule:
      per_second: 100
      burst_size: 300
  - path: "/.well-known/matrix/client"
    rule:
      per_second: 100
      burst_size: 300
  - path: "/.well-known/matrix/server"
    rule:
      per_second: 100
      burst_size: 300
  - path: "/health"
    rule:
      per_second: 100
      burst_size: 300
  - path: "/_matrix/client/v3/login"
    match_type: "prefix"
    rule:
      per_second: 50
      burst_size: 100
  - path: "/_matrix/client/r0/login"
    match_type: "prefix"
    rule:
      per_second: 50
      burst_size: 100
  - path: "/_matrix/client/v3/register"
    match_type: "prefix"
    rule:
      per_second: 5
      burst_size: 10
  # 验证码状态查询是**只读轮询**端点（客户端等待短信/邮件时反复查询），
  # 不应与注册尝试共享 5/s 的桶，否则正常轮询会被 429 误伤。
  - path: "/_matrix/client/v3/register/captcha/status"
    rule:
      per_second: 20
      burst_size: 40
  - path: "/_matrix/client/v3/account/password"
    match_type: "prefix"
    rule:
      per_second: 5
      burst_size: 10
  - path: "/_matrix/client/v3/register/email/requestToken"
    match_type: "prefix"
    rule:
      per_second: 5
      burst_size: 10
  - path: "/_matrix/client/v3/refresh"
    match_type: "prefix"
    rule:
      per_second: 20
      burst_size: 50
  - path: "/_matrix/client/v3/keys/upload"
    match_type: "prefix"
    rule:
      per_second: 50
      burst_size: 100
ip_header_priority:
  - "x-forwarded-for"
  - "x-real-ip"
  - "forwarded"
include_headers: true
exempt_paths:
  - "/"
  - "/metrics"
  - "/_matrix/client/v3/sync"
  - "/_matrix/client/r0/sync"
  - "/_matrix/client/v3/events"
  - "/_matrix/client/r0/events"
exempt_path_prefixes:
  - "/_matrix/client/v3/sync"
  - "/_matrix/client/r0/sync"
  - "/_matrix/client/v3/events"
  - "/_matrix/client/r0/events"
endpoint_aliases: {}
# fail-closed: 限流后端出错（或 Redis 不可用）时拒绝请求，不放行。
# 与 homeserver.yaml 的 rate_limit.fail_open_on_error 保持一致。
fail_open_on_error: false
sync:
  enabled: true
  initial:
    per_second: 50
    burst_size: 100
  incremental:
    per_second: 500
    burst_size: 1000
