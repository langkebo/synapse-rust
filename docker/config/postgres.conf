# PostgreSQL Configuration for Synapse Rust
# ============================================================================
# 唯一真相源（canonical）。docker/deploy/docker-compose.yml 直接挂载本文件，
# 不存在副本；修改后 `docker compose up -d --force-recreate postgres` 生效。
# ============================================================================

# ============================================================================
# 连接配置
# ============================================================================
listen_addresses = '*'
port = 5432
# 250 = 连接预算不变式的下限（每进程池上限 50 × 最大并发进程 4 + 保留 20 = 220，
# 取 250 留余量）。此值必须与 docker/deploy/README.md 的预算表一致，且
# pool × 进程数 + 保留 ≤ 本值；scripts/ci/check_connection_budget.py 会断言二者。
max_connections = 250
superuser_reserved_connections = 3

# ============================================================================
# 内存配置
# ============================================================================
shared_buffers = 256MB
effective_cache_size = 512MB
maintenance_work_mem = 64MB
# 16MB → 4MB（2026-10-15，DB_REVIEW §5 / 方案 B3）：work_mem 是**每个排序/哈希节点**的上限，
# 不是每连接上限。250 连接下 16MB 的理论上限是 4GB，远超容器的 mem_limit=1536MB，
# 而 cgroup OOM 杀的是 postmaster ⇒ 整库重启。4MB × 预算并发 100 = 400MB，预算才闭合。
# 少数需要大内存的查询请用 `SET LOCAL work_mem` 逐语句放大，不要全局放大。
# 不变式由 scripts/ci/check_connection_budget.py 断言（读本文件真值 + compose 的 mem_limit）。
work_mem = 4MB
temp_buffers = 8MB

# ============================================================================
# 查询规划
# ============================================================================
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# ============================================================================
# 扩展 (需要重启数据库生效)
# ============================================================================
shared_preload_libraries = 'pg_stat_statements'

# ============================================================================
# Write Ahead Log (WAL)
# ============================================================================
wal_level = replica
max_wal_size = 512MB
min_wal_size = 64MB
checkpoint_timeout = 30min
checkpoint_completion_target = 0.9

# ============================================================================
# 异步提交
# ============================================================================
synchronous_commit = on
wal_sync_method = fdatasync

# ============================================================================
# 复制
# ============================================================================
max_replication_slots = 10
wal_sender_timeout = 60s
wal_receiver_timeout = 60s

# ============================================================================
# WAL 归档 —— 2026-10-30 起**关闭**（方案 B：不做 PITR）
# ============================================================================
# 关闭理由：归档在本部署**没有消费方**。备份走 `pg_dump -Fc`
# （scripts/backup_database.sh），全仓没有 pg_basebackup / restore_command /
# PITR 恢复流程 ⇒ 归档只产出磁盘风险，换不来任何恢复能力。
#
# 实测事故（2026-10-30，两件事同时成立）：
#   1) 只写不删：docker/deploy/wal_archive 达 59 GB / 3760 段（10-15 → 10-24，
#      约 6.5 GB/天；archive_timeout=900s 使低写入时段也每 15 分钟切一段）。
#      全仓没有 archive_cleanup_command，也没有任何 cron/systemd 清理。
#      该目录与 ./backups（158 MB）、Docker 数据卷**同处一个文件系统** ⇒ 写满即
#      DB 无法写 WAL（PANIC）且备份也写不进去，两者同时挂。
#   2) 归档永久死锁：原 archive_command 用 `test ! -f DEST/%f` 做守卫，一旦目标
#      目录已存在同名段（实测 000000010000000E000000E8，两侧 mtime 均为 10-24
#      09:01），守卫恒假 ⇒ 命令恒返回 1 ⇒ PG 无限重试同一段、永不推进，WAL 无法
#      回收。实测 pg_stat_archiver.failed_count=26967、archive_status 里 994 个
#      .ready、pg_wal 涨到 15.5 GB / 996 段。
#
# 重新启用归档**必须**先补齐（缺一不可，否则等于重演上述事故）：
#   1) 幂等归档命令：`test ! -f DEST/%f || exit 0` —— "目标已存在"是成功，不是失败；
#   2) 清理：archive_cleanup_command（pg_archivecleanup 或 find -mtime）+ 目录体积告警；
#   3) 每周 pg_basebackup + 至少一次真实恢复演练（没有基座备份，WAL 无法用于恢复）；
#   4) 归档目录迁到**独立卷**，不与 PGDATA / backups 同盘；
#   5) 同步恢复告警（PostgresArchiveFailing / PostgresArchiveStalled 已随本次关闭一并移除）。
#
# `archive_mode` 是 postmaster 级参数 ⇒ 任何改动都需要：
#   docker compose up -d --force-recreate postgres
archive_mode = off
# 归档关闭时以下两项不生效，随归档一并注释（保留原文便于重新启用时对照）。
# archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && mkdir -p /var/lib/postgresql/wal_archive && cp %p /var/lib/postgresql/wal_archive/%f'
# archive_timeout = 900s
# 归档/备库异常时的短期缓冲（与归档开关无关，保留）。
wal_keep_size = 256MB

# ============================================================================
# 日志
# ============================================================================
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0

# ============================================================================
# 统计信息
# ============================================================================
track_activities = on
track_counts = on
track_io_timing = on
track_functions = none

# ============================================================================
# 自动清理
# ============================================================================
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.025

# ============================================================================
# 客户端连接默认值
# ============================================================================
datestyle = 'iso, mdy'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.english'

# ============================================================================
# 会话超时（实例级兜底）—— PERF-10
# ============================================================================
# 应用侧已经**按连接**兜底：src/server/database.rs 的 after_connect 对每个连接执行
# set_config('statement_timeout'|'lock_timeout'|'idle_in_transaction_session_timeout')，
# 取值来自 synapse-common/src/config/database.rs（默认 30s / 10s / 60s）；迁移器还会在
# 每条语句前显式 SET statement_timeout = '30s'。因此本小节的取值**不服务应用**，只防
# 「直连 psql 的运维查询无限挂起」把连接与锁一直占住。
#
# 由此得到两条约束（scripts/ci/check_connection_budget.py 会断言）：
#   1. 两个键必须**显式存在** —— 缺省即回到"直连无上限"，等于本条目没修；
#   2. 实例级**不得比应用默认更严**（statement_timeout ≥ 30s、idle ≥ 60s）。
#      若写成 10s，应用连接不受影响（会话级 set_config 会覆盖），但运维手工执行的
#      CREATE INDEX / VACUUM 会被提前掐断，属于"看起来更安全、实际只坑运维"。
#
# 长维护需要在**同一会话**内自行放开：SET statement_timeout = 0;
statement_timeout = 5min
idle_in_transaction_session_timeout = 60s

# ============================================================================
# 锁定
# ============================================================================
deadlock_timeout = 1s
max_locks_per_transaction = 64

# ============================================================================
# 错误处理
# ============================================================================
exit_on_error = off
restart_after_crash = on
