# PostgreSQL Configuration for Synapse Rust
# ============================================================================
# 唯一真相源（canonical）。docker/deploy/docker-compose.yml 直接挂载本文件，
# 不存在副本；修改后 `docker compose up -d --force-recreate postgres` 生效。
# ============================================================================

# ============================================================================
# 连接配置
# ============================================================================
listen_addresses = '*'
port = 5432
# 250 = 连接预算不变式的下限（每进程池上限 50 × 最大并发进程 4 + 保留 20 = 220，
# 取 250 留余量）。此值必须与 docker/deploy/README.md 的预算表一致，且
# pool × 进程数 + 保留 ≤ 本值；scripts/ci/check_connection_budget.py 会断言二者。
max_connections = 250
superuser_reserved_connections = 3

# ============================================================================
# 内存配置
# ============================================================================
shared_buffers = 256MB
effective_cache_size = 512MB
maintenance_work_mem = 64MB
# 16MB → 4MB（2026-10-15，DB_REVIEW §5 / 方案 B3）：work_mem 是**每个排序/哈希节点**的上限，
# 不是每连接上限。250 连接下 16MB 的理论上限是 4GB，远超容器的 mem_limit=1536MB，
# 而 cgroup OOM 杀的是 postmaster ⇒ 整库重启。4MB × 预算并发 100 = 400MB，预算才闭合。
# 少数需要大内存的查询请用 `SET LOCAL work_mem` 逐语句放大，不要全局放大。
# 不变式由 scripts/ci/check_connection_budget.py 断言（读本文件真值 + compose 的 mem_limit）。
work_mem = 4MB
temp_buffers = 8MB

# ============================================================================
# 查询规划
# ============================================================================
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# ============================================================================
# 扩展 (需要重启数据库生效)
# ============================================================================
shared_preload_libraries = 'pg_stat_statements'

# ============================================================================
# Write Ahead Log (WAL)
# ============================================================================
wal_level = replica
max_wal_size = 512MB
min_wal_size = 64MB
checkpoint_timeout = 30min
checkpoint_completion_target = 0.9

# ============================================================================
# 异步提交
# ============================================================================
synchronous_commit = on
wal_sync_method = fdatasync

# ============================================================================
# 复制
# ============================================================================
max_replication_slots = 10
wal_sender_timeout = 60s
wal_receiver_timeout = 60s

# ============================================================================
# WAL 归档（PITR 的唯一前提）—— 2026-10-15 DB_REVIEW §1 / 方案 B1.1
# ============================================================================
# `archive_mode` 是 postmaster 级参数 ⇒ 改这里**必须重启**才生效：
#   docker compose up -d --force-recreate db
# 归档落点必须**在 PGDATA 之外**（compose 挂了 ./wal_archive 到该路径）；
# 否则归档与数据同盘同损，等于没做。
# ⚠️ 归档**失败**时 PG 会保留 pg_wal 等重试 ⇒ 长时间失败会涨满磁盘。
#    上线后必须配「归档失败」与「该卷磁盘余量」两条告警（方案 B2.2 / §12 风险 2）。
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && mkdir -p /var/lib/postgresql/wal_archive && cp %p /var/lib/postgresql/wal_archive/%f'
# archive_timeout 只决定"低写入时段"的 RPO 上限（写满 16MB 段会自然触发归档）。
# 900s 与已定的 RPO ≤ 15min 对齐；调小会成比例放大归档量（每次一个 16MB 段）。
archive_timeout = 900s
# 归档/备库异常时的短期缓冲（长期保留靠归档，不靠这个值）。
wal_keep_size = 256MB

# ============================================================================
# 日志
# ============================================================================
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0

# ============================================================================
# 统计信息
# ============================================================================
track_activities = on
track_counts = on
track_io_timing = on
track_functions = none

# ============================================================================
# 自动清理
# ============================================================================
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.025

# ============================================================================
# 客户端连接默认值
# ============================================================================
datestyle = 'iso, mdy'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.english'

# ============================================================================
# 锁定
# ============================================================================
deadlock_timeout = 1s
max_locks_per_transaction = 64

# ============================================================================
# 错误处理
# ============================================================================
exit_on_error = off
restart_after_crash = on
