# =============================================================================
# synapse-rust 反向代理参考（W-D）—— 可被 `http { include ...; }` 引入
# =============================================================================
# ── 先读这一段：它决定了下面为什么"只有一路 upstream 是活的" ────────────────
# 本仓的 worker 进程（`synapse_worker`）**只提供 `/metrics` 一条路由**，
# 不提供任何 Matrix API（`src/bin/synapse_worker.rs` 的 `Router::new().route("/metrics", ..)`）。
# 与此同时，仓库里的"路由归属"模型（`WorkerType::owned_route_prefixes`、
# `expected_route_owner_for_probe`）**没有任何生产代码**据它决定谁 serve 什么
# ——全仓检索 `owned_route_prefixes` / `may_serve_delayed_events_route` 只有
# 校验器与 `/topology` 响应在用；`worker.worker_app` 这个配置项从未被读取。
# ⇒ 结论：**"按前缀把请求分给不同 worker"今天做不到**（打过去就是 502），
#   因为服务端那一半不存在。本文件因此：
#     1. 只启用 master 这一路（可用、可 `nginx -t`）；
#     2. 把分流写法作为**注释**保留 —— 它是目标形态的记录，也是"模型超前于运行时"
#        这一差距的可见化。等 W-F（按角色收敛 HTTP 面）落地后再取消注释。
# ⚠️ 不要图省事把注释掉的 worker upstream 直接启用：静态 upstream 的域名在 nginx
#    启动时就要解析，容器名解析不到会让 nginx **启动失败**（不是"请求时才 502"），
#    而且即使解析到了，那些进程上也没有 `/_matrix/*` 监听。
# =============================================================================

upstream synapse_master {
    # master 是唯一提供 Matrix API 的实例。
    server synapse-rust:8008 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ── 目标形态（W-F 落地后取消注释；现在启用会 502）────────────────────────────
# upstream synapse_sync_worker       { server sync_worker:8008; }
# upstream synapse_federation_reader { server federation_reader:8008; }
# upstream synapse_client_reader     { server client_reader:8008; }
# upstream synapse_media_repository  { server media_repository:8008; }

server {
    listen 80;
    server_name _;

    # 大附件上传：Matrix 默认媒体上限之内（改这里要同时看 homeserver 的
    # max_upload_size，代理先拒会表现为"上传莫名 413"）。
    client_max_body_size 64m;

    # /health 与 /metrics 都不该对外：前者是编排探针，后者会把内部队列深度、
    # worker 列表等暴露给任何能访问这个端口的人。运维端口请另开 listener 并只绑内网。
    location = /health {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://synapse_master;
    }

    location = /metrics {
        return 403;
    }

    # ── 控制面必须只打 master ────────────────────────────────────────────────
    # `/_synapse/worker/v1/*`（注册 / 心跳 / 任务领取 / 命令）和 `/_synapse/admin/*`
    # 都改的是**单一**注册表与队列；打到任意一个实例上都不安全（只有 master 挂了
    # 这些路由才有意义），而且 worker 进程上根本没有它们。
    location /_synapse/ {
        proxy_pass http://synapse_master;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # ── Matrix API ─────────────────────────────────────────────────────────
    # 现在全部 → master。分流版本见下方注释。
    location /_matrix/ {
        proxy_pass http://synapse_master;
        proxy_read_timeout 300s;   # /sync 长轮询：默认 60s 会把长轮询切开
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # 目标形态的分流（与上面的 `/_matrix/` 前缀共存时，nginx 会优先匹配更长的前缀；
    # `/_matrix/client/*/sync` 含通配段，所以只能用正则 location）：
    #
    # location ~ ^/_matrix/client/([^/]+/)?sync {
    #     proxy_pass http://synapse_sync_worker;
    #     proxy_read_timeout 300s;
    #     include /etc/nginx/conf.d/proxy_headers.inc;
    # }
    # location /_matrix/federation/ {
    #     proxy_pass http://synapse_federation_reader;
    #     include /etc/nginx/conf.d/proxy_headers.inc;
    # }
    # location /_matrix/media/ {
    #     proxy_pass http://synapse_media_repository;
    #     include /etc/nginx/conf.d/proxy_headers.inc;
    # }
    # location /_matrix/client/ {
    #     proxy_pass http://synapse_client_reader;
    #     include /etc/nginx/conf.d/proxy_headers.inc;
    # }

    location / {
        proxy_pass http://synapse_master;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }
}
