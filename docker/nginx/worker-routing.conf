# =============================================================================
# synapse-rust 反向代理参考（W-D / W-H）—— 可被 `http { include ...; }` 引入
# =============================================================================
# ── 先读这段：它决定了下面哪些 upstream 是活的 ───────────────────────────────
# 本仓现在有**两种** worker 进程（见 docker/docker-compose.workers.yml 头部）：
#
#   * **HTTP 角色实例** = 根二进制，一个容器一个角色，带 `surface_gate: true`：
#     非 master 实例对不属于自己角色的路径返回 404 `M_NOT_FOUND`。
#     ⇒ 这些**可以**进 nginx upstream，分流是真的。
#   * **任务消费者** = `synapse_worker`（`event_persister` 那一个）：只 mount `/metrics`，
#     没有任何 `/_matrix/*` 监听 ⇒ **绝不能**进 upstream（打过去就是 404/502）。
#
# ⚠️ 历史：W-D（2026-10-16）时整个栈都是 `synapse_worker`，所以当时只能启用 master
#    一路、把分流写成注释。W-H（2026-10-22）把 4 个角色实例换成根二进制、并补上
#    根二进制的心跳自注册（`spawn_instance_heartbeat`）之后，分流才真正成立。
#    如果只想跑单进程，**不要 include 这个文件**（它假定下面这些容器存在）。
#
# ⚠️ upstream 里的域名在 nginx **启动时**就要解析：走 `docker-compose.workers.yml`
#    时容器名存在；只起 `docker-compose.yml` 时这些名字不存在，nginx 会**启动失败**
#    （不是请求时才 502）。所以这个文件只属于多进程栈。
# =============================================================================

upstream synapse_master {
    # master 是唯一提供 Matrix API 的实例。
    server synapse-rust:8008 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ── 角色 upstream（根二进制实例，各带 `surface_gate: true`）──────────────────
upstream synapse_sync_worker {
    server sync_worker:8008 max_fails=3 fail_timeout=10s;
    keepalive 32;
}
upstream synapse_federation_reader {
    server federation_reader:8008 max_fails=3 fail_timeout=10s;
    keepalive 16;
}
upstream synapse_client_reader {
    server client_reader:8008 max_fails=3 fail_timeout=10s;
    keepalive 32;
}
upstream synapse_media_repository {
    server media_repository:8008 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 大附件上传：Matrix 默认媒体上限之内（改这里要同时看 homeserver 的
    # max_upload_size，代理先拒会表现为"上传莫名 413"）。
    client_max_body_size 64m;

    # /health 与 /metrics 都不该对外：前者是编排探针，后者会把内部队列深度、
    # worker 列表等暴露给任何能访问这个端口的人。运维端口请另开 listener 并只绑内网。
    location = /health {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://synapse_master;
    }

    location = /metrics {
        return 403;
    }

    # ── 控制面必须只打 master ────────────────────────────────────────────────
    # `/_synapse/worker/v1/*`（注册 / 心跳 / 任务领取 / 命令）和 `/_synapse/admin/*`
    # 都改的是**单一**注册表与队列；打到任意一个实例上都不安全（只有 master 挂了
    # 这些路由才有意义），而且 worker 进程上根本没有它们。
    location /_synapse/ {
        proxy_pass http://synapse_master;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # ── 分流（顺序与匹配规则都很关键）────────────────────────────────────────
    # nginx 先找最长前缀，再按顺序试正则；**正则命中就赢**（前缀没写 `^~`）。
    # 所以 `/sync` 用正则（路径里带通配段），其余用前缀。
    #
    # sync：`/_matrix/client/*/sync` 与房间级 `/_matrix/vendor/v1/rooms/*/sync`
    # 都归 `Synchrotron`。用 `.*` 而不是 `([^/]+/)?` —— 后者漏掉
    # `/_matrix/client/v3/rooms/{id}/sync`（surface_gate 的多段通配正是为此）。
    location ~ ^/_matrix/client/.*/sync$ {
        proxy_pass http://synapse_sync_worker;
        proxy_read_timeout 300s;   # /sync 长轮询：默认 60s 会把长轮询切开
        include /etc/nginx/conf.d/proxy_headers.inc;
    }
    location ~ ^/_matrix/vendor/v1/rooms/.*/sync$ {
        proxy_pass http://synapse_sync_worker;
        proxy_read_timeout 300s;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }
    location /_matrix/federation/ {
        proxy_pass http://synapse_federation_reader;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }
    location /_matrix/media/ {
        proxy_pass http://synapse_media_repository;
        client_max_body_size 64m;  # 媒体上传同理：代理先拒会表现为"上传莫名 413"
        include /etc/nginx/conf.d/proxy_headers.inc;
    }
    # 其余 client 面（含 `/_matrix/vendor/v1/*`）→ client_reader。
    # ⚠️ `/_matrix/client/v1/media/*` 在 Frontend 的 owned_route_prefixes 里（客户端
    #    鉴权媒体），所以它走这里而不是 media_repository —— 两者不要混。
    location /_matrix/client/ {
        proxy_pass http://synapse_client_reader;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }
    # `/_matrix/` 剩下的（`/_matrix/app/*`、`/_matrix/key/*` 等）仍归 master：
    # 它们没有独立角色实例，且 `/_matrix/key/*` 由 FederationReader 与 master 共同拥有。
    location /_matrix/ {
        proxy_pass http://synapse_master;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location / {
        proxy_pass http://synapse_master;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }
}
