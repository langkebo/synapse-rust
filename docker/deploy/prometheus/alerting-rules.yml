# =============================================================================
# 告警规则集 — HuLa/Tjg 监控栈
# =============================================================================
# 基于项目现有指标和 S-6/S-9 告警规则文档
#
# 类别：
#   - infrastructure：基础设施层（数据库、缓存、系统资源）
#   - application：应用层（API 错误、限流、同步）
#   - security：安全层（认证失败、限流失效）
#   - e2ee：加密层（Megolm、密钥管理）
#   - voip：RTC 层（TURN/STUN）
# =============================================================================

groups:
  # =========================================================================
  # Group 1: EventNotifier (S-6)
  # =========================================================================
  - name: event-notifier
    rules:
      - alert: EventNotifierRedisSubscriberDown
        expr: increase(event_notifier_subscriber_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          category: infrastructure
          service: synapse-rust
        annotations:
          summary: "EventNotifier Redis 订阅者断开"
          description: |
            实例 {{ $labels.instance }} 在 5 分钟内报告了 {{ $value }} 次订阅失败。
            这表示 Redis Pub/Sub 连接断开，跨实例事件广播可能失效。
            检查 Redis 实例健康状态和 synapse-rust 网络连接。
          runbook_url: "https://wiki.internal/runbooks/event-notifier-disconnect"

      - alert: EventNotifierSubscriberFailuresSpike
        expr: rate(event_notifier_subscriber_failures_total[1m]) > 0.1
        for: 2m
        labels:
          severity: warning
          category: infrastructure
          service: synapse-rust
        annotations:
          summary: "EventNotifier 订阅者失败率升高"
          description: |
            持续 2 分钟每秒超过 0.1 次失败（{{ $value | humanize }} req/s）。
            Redis 可能不稳定，正在尝试重连。

  # =========================================================================
  # Group 2: Rate Limiting (S-9)
  # =========================================================================
  - name: rate-limiting
    rules:
      - alert: RateLimitFailOpen
        expr: rate(rate_limit_fail_open_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          category: security
          service: synapse-rust
          impact: "限流失效，所有请求将被放行"
        annotations:
          summary: "限流 Fail-Open 触发"
          description: |
            限流系统故障，后端不可用但仍放行请求。
            可能导致服务雪崩。立即检查限流组件健康状态。
          action_items: "检查 Redis 连接；检查内存使用率；查看限流中间件日志"

      - alert: RateLimitFailClosed
        expr: rate(rate_limit_fail_closed_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          category: security
          service: synapse-rust
          impact: "全站 429，所有请求被拒绝"
        annotations:
          summary: "限流 Fail-Closed 触发"
          description: |
            限流系统故障，所有请求被拒绝。
            用户将看到大量 429 响应。
          action_items: "临时放宽限流规则；检查 Redis 连接"

      - alert: RateLimitRejectedHigh
        expr: |
          rate(rate_limit_requests_rejected_total[5m]) /
          rate(rate_limit_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          category: security
          service: synapse-rust
          impact: "5% 以上请求被限流"
        annotations:
          summary: "限流拒绝率过高"
          description: |
            过去 5 分钟内 {{ $value | humanizePercentage }} 的请求被限流。
            可能原因：DDoS 攻击或限流配置过严。
            检查 `/_synapse/admin/v1/rate-limit-status` 端点。

      - alert: RateLimitRejectedHighInfo
        expr: |
          rate(rate_limit_requests_rejected_total[5m]) /
          rate(rate_limit_requests_total[5m]) > 0.01
        for: 10m
        labels:
          severity: info
          category: security
          service: synapse-rust
        annotations:
          summary: "限流拒绝率关注"
          description: "拒绝率超过 1%，需关注但不紧急"

  # =========================================================================
  # Group 3: Database Health
  # =========================================================================
  - name: database-health
    rules:
      - alert: DatabasePoolUtilizationHigh
        expr: pool_utilization >= 0.9
        for: 2m
        labels:
          severity: warning
          category: infrastructure
          service: synapse-rust
          tier: database
        annotations:
          summary: "数据库连接池利用率过高"
          description: |
            连接池利用率 {{ $value | humanizePercentage }}，超过 90% 阈值。
            可能导致请求排队、延迟升高。
            建议：增大 `SYNAPSE__DATABASE__POOL_SIZE` 或检查慢查询。

      - alert: DatabasePoolExhausted
        expr: db_connections_idle == 0 and db_connections_active > 40
        for: 1m
        labels:
          severity: critical
          category: infrastructure
          service: synapse-rust
          tier: database
        annotations:
          summary: "数据库连接池耗尽"
          description: |
            无空闲连接，所有连接被占用。
            请求将阻塞等待。检查是否有长事务或锁竞争。

      - alert: DatabaseQueryDurationHigh
        # 阈值单位是**毫秒**（`db_query_duration_ms`）。被降级时写成 `> 0.5`，
        # 等于 0.5ms —— 比原阈值严 1000 倍，会长期误报；同批另两条规则保留了
        # 2000 / 100 的 ms 量级，自相矛盾，判为笔误。
        expr: histogram_quantile(0.95, sum(rate(db_query_duration_ms_bucket[5m])) by (le)) > 500
        for: 5m
        labels:
          severity: warning
          category: database
          service: synapse-rust
        annotations:
          summary: "数据库查询延迟高"
          description: "P95 查询延迟超过 500ms（当前 {{ $value | humanize }}ms）"

  # =========================================================================
  # Group 3b: PostgreSQL 自身健康 + 备份/归档新鲜度（2026-10-15，方案 B2）
  # =========================================================================
  # 与上面 Group 3（`database-health`）的区别，别混：
  #   * Group 3 是**应用视角** —— 应用的连接池利用率、db_connections_*、查询耗时。
  #     应用池一切正常，不代表 PG 本身正常。
  #   * 本组是**PG 自身视角** —— 归档是否在走、长事务/锁、PG 侧连接数上限、
  #     以及"备份到底有没有成功"（外部定时任务，必须由脚本上报才能观测）。
  #
  # ⚠️ 数据源是 `postgres` job（postgres_exporter，只读角色 synapse_monitor）。
  #    该 job 不存在时本组永远 inactive —— 那是"没数据"，**不是"健康"**。
  #    因此 job 与本组必须同批增删（见 docker-compose.monitoring.yml 的 exporter 注释）。
  # ⚠️ 标签集不同会让向量运算**静默返回空**（本仓踩过）：下面凡做除法一律先 `sum()`/`max()`。
  # ⚠️ `absent()` 用于兜住"指标从来没出现过" —— 比"值不对"更隐蔽。
  # ⚠️ 磁盘余量**不在本组**：沿用 infrastructure 组既有的 `HostDiskSpaceLow`
  #    （注意它没有 fstype 过滤，会把 tmpfs/overlay 也算进去 —— 见方案 B2 的后续项）。
  # 单元测试：docker/deploy/prometheus/promtool/alerting-rules.test.yml（promtool test rules）。
  - name: postgres-server-health
    rules:
      # 归档失败：WAL 送不出去 ⇒ PITR 断档，且 pg_wal 会持续增长直到涨满磁盘
      - alert: PostgresArchiveFailing
        expr: pg_stat_archiver_failed_count > 0
        for: 5m
        labels:
          severity: critical
          category: database
        annotations:
          summary: "🚨 PostgreSQL WAL 归档失败（累计 {{ $value }} 次）—— PITR 已断档"
          description: "归档失败时 PG 会**保留** pg_wal 等待重试，磁盘会持续增长，最终撑停数据库。\n先查归档目录：docker/deploy/wal_archive 是否存在、可写、所在卷是否已满。\n检查：docker exec synapse-postgres psql -U synapse -c \"SELECT * FROM pg_stat_archiver\""

      # 归档停滞：archive_timeout=900s ⇒ 低写入时也应每 15 分钟落一段，超 1 小时即异常
      - alert: PostgresArchiveStalled
        expr: pg_stat_archiver_last_archive_age > 3600
        for: 10m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "⚠️ PostgreSQL 归档停滞（{{ $value | humanizeDuration }} 没有新归档段）"
          description: "archive_timeout=900s，正常情况下 15 分钟内必有一段。超 1 小时说明归档链路断了（目录不可写/卷满/命令失败），RPO 正在变大。"

      # 备份新鲜度：由备份脚本上报到 pushgateway（>26h 未成功备份）
      - alert: PostgresBackupStale
        expr: time() - max(synapse_backup_last_success_timestamp_seconds) > 93600
        for: 15m
        labels:
          severity: critical
          category: database
        annotations:
          summary: "🚨 数据库备份已过期（最近一次成功备份超过 26 小时）"
          description: "备份脚本 success 后会上报时间戳；该值变旧说明定时任务没跑或跑失败。\n检查：systemctl list-timers synapse-backup.timer / systemctl --failed / journalctl -u synapse-backup\n注意：本告警只在**曾经上报过**之后才可能触发，'从没上报'由 PostgresBackupMetricMissing 兜住。"

      # 兜底：备份指标从未出现（定时任务压根没装 / 从没成功过）——没有这条，
      # 「从没上报」会让 PostgresBackupStale 永远为空，看起来像"从未出问题"
      - alert: PostgresBackupMetricMissing
        expr: absent(synapse_backup_last_success_timestamp_seconds)
        for: 30m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "⚠️ 没有收到任何备份成功上报（备份新鲜度不可判定）"
          description: "要么定时任务尚未安装，要么备份从未成功过、要么 BACKUP_PUSHGATEWAY_URL 未配置。\n装法见 docker/deploy/systemd/README.md；没有上报就等于没有这条监控。"

      # 连接数逼近 max_connections（**PG 侧**口径，区别于 Group 3 的应用池视角）
      - alert: PostgresConnectionsSaturating
        expr: |
          sum(pg_stat_activity_count)
          /
          sum(pg_settings_max_connections) > 0.85
        for: 5m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "⚠️ PostgreSQL 连接数逼近上限（{{ $value | humanizePercentage }}）"
          description: "max_connections=250，且容器 pids_limit 也要够（常驻进程 + 并行 worker 都占 pid）。\n连接耗尽的表现是**随机连接失败**，不是排队。检查 pg_stat_activity 里的 LONG-RUNNING 与 idle in transaction。"

      # 长事务（>5 分钟）：VACUUM 失效 → 膨胀；也是迁移期排他锁/阻塞链的常见成因
      - alert: PostgresLongRunningTransaction
        expr: max(pg_stat_activity_max_tx_duration{state!="idle"}) > 300
        for: 5m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "⚠️ PostgreSQL 存在超过 5 分钟的长事务（{{ $value | humanizeDuration }}）"
          description: "长事务会顶住 vacuum 的回收水位（表/索引膨胀），也可能在迁移期挡住 DDL。\n定位：SELECT pid, now()-xact_start AS age, state, query FROM pg_stat_activity WHERE xact_start IS NOT NULL ORDER BY age DESC;"

  # =========================================================================
  # Group 4: HTTP API Health (RED Methodology)
  # =========================================================================
  - name: http-api-health
    rules:
      - alert: HighHTTPErrorRate
        expr: |
          sum(rate(http_request_errors_total[5m])) by (service) /
          sum(rate(http_requests_total[5m])) by (service) > 0.01
        for: 5m
        labels:
          severity: warning
          category: application
        annotations:
          summary: "HTTP 错误率升高"
          description: |
            当前错误率 {{ $value | humanizePercentage }}，超过 1% 阈值。
            检查最近代码变更或依赖服务故障。

      - alert: HTTPRequestDurationHigh
        # 恢复真 P99（描述一直写的是 P99，降级后表达式实际算的是均值，名不符实）。
        # `sum by (le)` 是 histogram_quantile 的稳健写法：漏掉聚合时，
        # 任一新增标签都会把分布切成多份而静默失效。
        expr: |
          histogram_quantile(0.99, sum(rate(http_request_duration_ms_bucket[5m])) by (le)) > 2000
        for: 5m
        labels:
          severity: warning
          category: application
        annotations:
          summary: "API 响应时间高"
          description: "P99 延迟超过 2 秒（当前 {{ $value | humanize }}ms）"

      - alert: HTTPActiveRequestsGrowing
        expr: http_active_requests > 100
        for: 3m
        labels:
          severity: warning
          category: application
        annotations:
          summary: "活跃请求数异常增长"
          description: "当前 {{ $value }} 个活跃请求，可能意味着请求积压"

  # =========================================================================
  # Group 5: Cache Performance
  # =========================================================================
  - name: cache-performance
    rules:
      - alert: CacheHitRateLow
        expr: |
          sum(rate(cache_hits_total[10m])) by (instance) /
          (sum(rate(cache_hits_total[10m])) by (instance) +
           sum(rate(cache_misses_total[10m])) by (instance)) < 0.7
        for: 10m
        labels:
          severity: warning
          category: performance
          service: synapse-rust
        annotations:
          summary: "缓存命中率下降"
          description: |
            当前命中率 {{ $value | humanizePercentage }}，低于 70% 阈值。
            可能原因：缓存驱逐过度或热数据变化。

      - alert: CacheEvictionsHigh
        expr: rate(cache_evictions_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
          category: performance
          service: synapse-rust
        annotations:
          summary: "缓存驱逐率过高"
          description: "每秒超过 100 次缓存驱逐，Redis 内存可能紧张"

  # =========================================================================
  # Group 6: E2EE Health (Phase 2 metrics)
  # =========================================================================
  - name: e2ee-health
    rules:
      - alert: MegolmPicklePersistErrors
        expr: rate(megolm_vodozemac_pickle_persist_errors_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          category: e2ee
          service: synapse-rust
        annotations:
          summary: "Megolm 密钥持久化失败"
          description: |
            会话密钥写入失败，可能导致 E2EE 消息无法解密。
            检查存储和密钥文件权限。

      - alert: E2EESessionKeyReadSlow
        # 恢复真 P95（描述写的是 P95）。该 histogram 带 `result` 标签，
        # 必须 `sum by (le)` 合并后再取分位数。
        expr: |
          histogram_quantile(0.95, sum(rate(megolm_session_key_read_duration_ms_bucket[5m])) by (le)) > 100
        for: 5m
        labels:
          severity: warning
          category: e2ee
          service: synapse-rust
        annotations:
          summary: "E2EE 会话密钥读取延迟高"
          description: "P95 读取延迟超过 100ms"

      - alert: E2EECacheErrors
        expr: rate(megolm_share_cache_errors_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
          category: e2ee
          service: synapse-rust
        annotations:
          summary: "E2EE 缓存错误"
          description: "Megolm 共享缓存出现错误，检查 Redis 连接"

  # =========================================================================
  # Group 7: Infrastructure (Node Exporter)
  # =========================================================================
  - name: infrastructure
    rules:
      - alert: HostHighCpuLoad
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
          category: infrastructure
          tier: host
        annotations:
          summary: "主机 CPU 负载过高"
          description: "CPU 使用率超过 80% 持续 10 分钟（当前 {{ $value | humanize }}%）"

      - alert: HostMemoryPressure
        expr: |
          (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 5m
        labels:
          severity: critical
          category: infrastructure
          tier: host
        annotations:
          summary: "主机内存压力过高"
          description: "可用内存低于 10%（{{ $value | humanize }}%）"

      - alert: HostDiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 15
        for: 10m
        labels:
          severity: warning
          category: infrastructure
          tier: host
        annotations:
          summary: "磁盘空间不足"
          description: "磁盘可用空间低于 15%"

      - alert: HostDiskIOHigh
        expr: |
          rate(node_disk_io_time_seconds_total[5m]) > 0.9
        for: 5m
        labels:
          severity: warning
          category: infrastructure
          tier: host
        annotations:
          summary: "磁盘 I/O 饱和"
          description: "磁盘 I/O 利用率超过 90%"

  # =========================================================================
  # Group 8: Service Availability
  # =========================================================================
  - name: service-availability
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "服务 {{ $labels.job }} 不可用"
          description: "Prometheus 无法抓取 {{ $labels.job }} 指标已超过 1 分钟"

      - alert: PrometheusTargetMissing
        expr: up == 0
        for: 2m
        labels:
          severity: warning
          category: monitoring
        annotations:
          summary: "Prometheus 目标丢失"
          description: "目标 {{ $labels.job }} 无法抓取，检查网络和服务状态"

  # =========================================================================
  # Group: Worker 拓扑（W-E）
  # =========================================================================
  # 数据源：`synapse-services/src/worker/topology_metrics.rs`（W-E）周期性把
  # `evaluate_runtime_topology` 的结论写成指标；只有当 `worker.enabled` 为真时才注册
  # ⇒ 单进程部署下这些序列**不存在**，下面的规则不会触发（也不会误报）。
  # 背景（为什么需要告警而不是只做端点）：拓扑"声明 vs 实际"不一致的后果是
  # 「事件不落库 / 某个职责没人干」，而它不会让任何请求失败 —— 没人轮询端点就等于没有监控。
  - name: worker-topology
    rules:
      - alert: WorkerTopologyInvalid
        expr: synapse_worker_topology_valid == 0
        for: 5m
        labels:
          severity: critical
          category: availability
          service: synapse-rust
        annotations:
          summary: "Worker 拓扑与配置不一致"
          description: |-
            实例 {{ $labels.instance }} 的运行中拓扑已连续 5 分钟不符合配置
            （`synapse_worker_topology_valid == 0`）。
            含义：配置里声明的某个 worker 没在跑，或有实例心跳停了，或有流没有在活的属主。
            排查入口：`GET /_synapse/worker/v1/topology/validate` 的 `runtime.errors`
            与 `runtime.missing` / `runtime.stale` / `runtime.unowned_streams`。

      - alert: WorkerStreamUnowned
        expr: synapse_worker_unowned_streams > 0
        for: 5m
        labels:
          severity: warning
          category: availability
          service: synapse-rust
        annotations:
          summary: "有复制流没有在活的属主"
          description: |-
            {{ $value }} 条流（typing / receipts / events …）配置的属主实例**全部**不在活。
            2026-10-22（W-I）起这条告警的含义取决于配置：
            `worker.write_forwarding: true` 时写请求会被**转发**给该流的 writer，
            属主全灭 ⇒ 那一路上所有写都会 503（真的中断，按 outage 处理）；
            `write_forwarding: false`（默认）时写入仍由接请求的实例自己处理，不会中断 ——
            那说明的是"配置描述的分工与实际部署不符"，而不是"数据正在丢失"。

      - alert: WorkerInstanceHeartbeatStale
        expr: synapse_worker_instance_last_heartbeat_age_seconds > 300
        for: 5m
        labels:
          severity: warning
          category: availability
          service: synapse-rust
        annotations:
          summary: "Worker 实例 {{ $labels.instance }} 心跳过期"
          description: |-
            实例 {{ $labels.instance }} 距最后一次心跳已 {{ $value }} 秒（阈值 300 秒，
            健康检查的超时是 90 秒）。它仍在注册表里，但很可能已经不可用。
            检查该实例的容器/进程状态与其 `SYNAPSE_WORKER_BASE_URL` 连通性。

  # =========================================================================
  # Group: 写转发（W-I）
  # =========================================================================
  # 数据源：`synapse-web/src/middleware/write_forwarding.rs` 的
  # `worker_write_forward_total{stream,outcome}`，`outcome ∈ ok | upstream_error |
  # unreachable | refused`。只有 `worker.write_forwarding: true` 时该序列才存在
  # ⇒ 默认部署下这些规则不会触发（也不会误报）。
  #
  # 为什么必须有告警：写转发失败的症状是**写请求 503**，而读接口、`/sync`、
  # 健康探针全都正常。没有下面两条规则时，唯一能发现的方式是用户报障。
  #
  # 两个 outcome 的区别是本组的判据基础：
  #   * `unreachable` / `refused` —— 写**没送到** writer（传输失败 / 本地拒发）。
  #     这是真中断，critical。
  #   * `upstream_error` —— writer 收到了、答了非 2xx（403 / 429 / 500）。
  #     这是 writer 对某一次写的裁决，**不**进下面两条规则：把 403 洪峰当 outage
  #     会把告警训练成噪音。
  - name: worker-write-forwarding
    interval: 30s
    rules:
      - alert: WorkerWriteForwardFailed
        expr: |
          sum by (stream, outcome) (
            rate(worker_write_forward_total{outcome=~"unreachable|refused"}[5m])
          ) > 0
        for: 5m
        labels:
          severity: critical
          category: availability
          service: synapse-rust
        annotations:
          summary: "写转发到 writer 失败（流 {{ $labels.stream }}，{{ $labels.outcome }}）"
          description: |-
            过去 5 分钟里流 `{{ $labels.stream }}` 的写一直在 `{{ $labels.outcome }}`
            （速率 {{ $value }}/s）。`unreachable` = 连不上配置的 writer；
            `refused` = 本实例拒绝转发（worker.replication.http 密钥读不到，
            或 `instance_map` 里没有目标实例）。
            含义：这些路径上的写请求全部 503，**数据没有落库**。
            排查入口：`GET /_synapse/worker/v1/topology/validate` 的
            `write_forwarding.streams[]`（看 `route` / `reason` / `writer_live`），
            以及 `GET /_health` 的 `checks.write_forwarding`。

      - alert: WorkerWriteForwardStalled
        expr: |
          sum by (stream) (rate(worker_write_forward_total[5m])) > 0
          and
          sum by (stream) (rate(worker_write_forward_total{outcome="ok"}[5m])) == 0
        for: 10m
        labels:
          severity: warning
          category: availability
          service: synapse-rust
        annotations:
          summary: "流 {{ $labels.stream }} 的转发持续没有一次成功"
          description: |-
            过去 10 分钟流 `{{ $labels.stream }}` 有转发尝试、但 `ok` 一次都没有。
            与上一条的区别：这里**不**区分 outcome —— 若全落在 `upstream_error`，
            说明 writer 活着但在拒绝流量（权限 / 限流 / 内部错误），而不是网络不通。
            两条一起看：`WorkerWriteForwardFailed` 管"写根本没送到"，
            这条管"送到了但从没成功过"。
