# =============================================================================
# synapse-rust 监控栈 — Prometheus / Alertmanager / Grafana / Node Exporter /
# Alert Handler
# =============================================================================
# 为什么单独一个文件：
#   `docker-compose.yml`（核心栈：postgres/redis/migrator/synapse/nginx）不包含
#   监控服务，而监控容器此前是用裸 `docker run` 手工起的（无 compose 标签），
#   配置能改、栈却无法重建。本文件把监控栈变成可重建、可提交的一等公民。
#
# 与核心栈的关系（2026-10-31 起解耦）：
#   - 监控容器之间走本文件**自有**的网络 `synapse_monitoring_network`；
#     只有真正需要访问业务容器的两个服务（prometheus 抓 `synapse-app:9090`、
#     postgres-exporter 连 `postgres:5432`）才额外接入核心栈的
#     `synapse_network`（external，因此必须**在核心栈之后**启动）。
#   - 解耦前 8 个监控容器全部挂在 `synapse_network` 上，核心栈 `compose down`
#     收不回该网络（仍有 active endpoint），只能靠告警兜底。现在依赖面收敛到
#     2 个容器，且 deploy.sh 在拆除核心栈前会先停监控栈。
#
# 启动：
#   docker compose -p synapse-monitoring \
#     -f docker-compose.monitoring.yml up -d
#   正常路径由 `deploy.sh` 的“启动监控栈”步骤调用。
#
# 服务名即 DNS 名，**不要随意改名**：以下名字被配置文件硬编码引用——
#   - prometheus.yml  -> synapse-app / coturn / synapse-node-exporter /
#                        synapse-prometheus / synapse-alertmanager
#   - alertmanager.yml -> alert-handler
#   - datasources.yml  -> synapse-prometheus
# =============================================================================

services:
  # ---------------------------------------------------------------- Prometheus
  synapse-prometheus:
    image: prom/prometheus:v2.48.1
    container_name: synapse-prometheus
    restart: unless-stopped
    cpus: ${PROMETHEUS_CPU_LIMIT:-1.0}
    mem_limit: ${PROMETHEUS_MEMORY_LIMIT:-1024m}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
      - --web.enable-admin-api
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerting-rules.yml:/etc/prometheus/alerting-rules.yml:ro
      - ./prometheus/recording-rules.yml:/etc/prometheus/recording-rules.yml:ro
      # 抓取 worker 指标用的 bearer token。由 deploy.sh 在缺失时生成；
      # 若源文件不存在，Docker 会**建目录**再挂载，prometheus 会读到目录，
      # 所以部署流程必须保证它先存在。
      - ./prometheus/auth/worker-token:/etc/prometheus/worker-token:ro
    ports:
      # 变量必须叫 PROMETHEUS_UI_PORT，**不能**复用 PROMETHEUS_PORT：
      # 后者在核心栈里是「**应用自身**的 /metrics 端口」
      # （docker-compose.yml 的 `127.0.0.1:${PROMETHEUS_PORT:-9090}:9090`，
      #  且 homeserver.yaml 的 prometheus.port 也是 9090）。
      # 复用会让本服务去抢宿主 9090 —— 而它已被 synapse-app 占用，实测报错：
      #   Bind for 127.0.0.1:9090 failed: port is already allocated
      # 9092 与 grafana 数据源注释（datasources.yml）以及本站文档保持一致。
      - "127.0.0.1:${PROMETHEUS_UI_PORT:-9092}:9090"
    # coturn 在**独立 compose 项目**（../coturn，网络 coturn_turn_net）里，与
    # synapse_network 不互通；它把 9641 发布到宿主，prometheus.yml 因此经此别名抓取。
    # 显式声明 host-gateway，避免依赖 Docker Desktop/OrbStack 的隐式 DNS。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 两个网络：`monitoring` 访问 alertmanager/exporters 等监控同伴，
    # `synapse-network` 仅用于抓取业务容器的 /metrics（synapse-app:9090）。
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # 与核心栈一致：限制单容器日志体积，避免 Prometheus/生产环境长跑后撑爆宿主磁盘。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - monitoring
      - synapse-network

  # -------------------------------------------------------------- Alertmanager
  synapse-alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: synapse-alertmanager
    restart: unless-stopped
    cpus: ${ALERTMANAGER_CPU_LIMIT:-0.5}
    mem_limit: ${ALERTMANAGER_MEMORY_LIMIT:-256m}
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - alertmanager_data:/alertmanager
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9093/-/healthy || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - monitoring

  # ------------------------------------------------------------------ Grafana
  synapse-grafana:
    image: grafana/grafana:10.4.2
    container_name: synapse-grafana
    restart: unless-stopped
    cpus: ${GRAFANA_CPU_LIMIT:-0.5}
    mem_limit: ${GRAFANA_MEMORY_LIMIT:-512m}
    volumes:
      # 持久化 SQLite（面板改动、告警状态）。此前该项缺失，重建即丢状态。
      - grafana_data:/var/lib/grafana
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - monitoring

  # ------------------------------------------------------------- Node Exporter
  synapse-node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: synapse-node-exporter
    restart: unless-stopped
    cpus: ${NODE_EXPORTER_CPU_LIMIT:-0.5}
    mem_limit: ${NODE_EXPORTER_MEMORY_LIMIT:-128m}
    command:
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run/[^/]*)(/.*)?$$
      - --collector.netclass.ignored-devices=^(lo|sit0|veth.*|docker0|br-.*|wg.*)$
    volumes:
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    ports:
      - "127.0.0.1:${NODE_EXPORTER_PORT:-9100}:9100"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9100/metrics || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - monitoring

  # ------------------------------------------------- postgres_exporter（DB 观测）
  # 为什么现在才有：`prometheus.yml` 顶部写着一条纪律 —— "只声明真实存在的目标"，
  # 因为指向不存在主机的 job 只会永久 `down`，并让依赖它的面板静默变成 No data。
  # 所以顺序必须是**先有本服务、再有 `postgres` job**；两者缺一即自相矛盾。
  #
  # 权限：**只读角色** `synapse_monitor`（LOGIN + pg_monitor + CONNECT），
  # 口令来自 `docker/deploy/.env` 的 `MONITOR_DB_PASSWORD`（已 gitignore），
  # 由 `scripts/create-monitoring-role.sh` 幂等施加。
  # **不要**图省事直接复用 `POSTGRES_USER` —— 那是 owner 账号，等于把写权限给采集器。
  synapse-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: synapse-postgres-exporter
    restart: unless-stopped
    cpus: ${POSTGRES_EXPORTER_CPU_LIMIT:-0.3}
    mem_limit: ${POSTGRES_EXPORTER_MEMORY_LIMIT:-128m}
    environment:
      # sslmode 与核心栈 DATABASE_URL 保持一致（同网络内未启用 TLS）
      DATA_SOURCE_NAME: "postgresql://${MONITOR_DB_ROLE:-synapse_monitor}:${MONITOR_DB_PASSWORD:?MONITOR_DB_PASSWORD must be set (见 docker/deploy/.env)}@postgres:5432/${POSTGRES_DB:-synapse}?sslmode=disable"
      # 只采集显式列出的库，避免误连模板/测试库
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "false"
    # 刻意**不映射**宿主端口（不写 `ports:`）：Prometheus 与它同网络，直连 :9187，最小暴露面。
    # 但必须用 `expose:` **声明**该端口 —— 这不是装饰：
    #   `scripts/ci/check_prometheus_config.py` 的「死目标守卫」要求 `postgres` job 的
    #   目标端口在 compose 里被声明过（该守卫同时读 `ports` 与 `expose`），
    #   否则判红。2026-10-15 本服务首次加入时正是漏了这行，把 CI 判红了。
    expose:
      - "9187"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9187/metrics || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # 直连核心栈的 `postgres:5432`，因此必须同时接入业务网络。
    networks:
      - monitoring
      - synapse-network

  # ------------------------------------------------------------- Pushgateway
  # 为什么现在加（2026-10-15 方案 B2）：
  #   "备份新鲜度"是**外部定时任务**产生的信号，Prometheus 抓不到 —— 必须由备份脚本
  #   主动上报（`scripts/backup_database.sh` 的 `BACKUP_PUSHGATEWAY_URL`），
  #   再被 `PostgresBackupStale` / `PostgresBackupMetricMissing` 两条告警消费。
  #   ⚠️ 事实核查：**deploy 栈此前没有这个服务**（`docker/docker-compose.monitoring.yml`
  #   里有，但那是 dev 侧；本机运行的 deploy 栈 `docker ps` 里并没有 pushgateway），
  #   所以"备份新鲜度"当时根本没有数据源，不是"看起来正常"而是"从未存在"。
  synapse-pushgateway:
    image: prom/pushgateway:v1.6.2
    container_name: synapse-pushgateway
    restart: unless-stopped
    cpus: ${PUSHGATEWAY_CPU_LIMIT:-0.25}
    mem_limit: ${PUSHGATEWAY_MEMORY_LIMIT:-64m}
    ports:
      # 只绑回环：备份脚本跑在**宿主**上（systemd timer），需要经 127.0.0.1 上报。
      # 不绑 0.0.0.0 —— pushgateway 默认无鉴权，暴露到公网等于让人伪造备份成功。
      - "127.0.0.1:${PUSHGATEWAY_PORT:-9091}:9091"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9091/-/healthy || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - monitoring

  # ------------------------------------------------------------ Alert Handler
  # alertmanager.yml 把通知投递到 http://alert-handler:8080/api/v1/alerts*，
  # 因此本服务的 DNS 名必须是 `alert-handler`，且 app.py 必须提供这些路由。
  # 历史 bug：容器从未真正启动（用 alpine:3.19 裸建且命令是 /bin/sh），
  # 且 app.py 只提供 /webhook -> 投递必然 404 + 丢弃。
  alert-handler:
    build:
      context: ./alert-handler
      dockerfile: Dockerfile
    container_name: synapse-alert-handler
    restart: unless-stopped
    cpus: ${ALERT_HANDLER_CPU_LIMIT:-0.5}
    mem_limit: ${ALERT_HANDLER_MEMORY_LIMIT:-128m}
    environment:
      # 通知出口。**留空则告警只进本容器日志**（app.py 启动时会打 warning 提醒）。
      # 填钉钉/企业微信/任意接收 JSON POST 的 webhook 即可把告警推出去；
      # 改完需要 `docker compose up -d --build alert-handler` 重建（环境变量在镜像外）。
      ALERT_FORWARD_URL: ${ALERT_FORWARD_URL:-}
      ALERT_FORWARD_TIMEOUT_SECONDS: ${ALERT_FORWARD_TIMEOUT_SECONDS:-5}
      # 下游消息格式：raw（原样透传，只对自己写的接收器有用）/ dingtalk / wecom。
      # 填钉钉或企微的群机器人 URL 时**必须**同时设这一项，否则发出去的是 Alertmanager
      # 原始 payload，对方返回 200 但不会渲染成消息（静默无效果）。
      ALERT_FORWARD_FORMAT: ${ALERT_FORWARD_FORMAT:-raw}
    ports:
      - "127.0.0.1:${ALERT_HANDLER_PORT:-8080}:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - monitoring

  # ---------------------------------------------------------- Nginx Proxy (P4 Security)
  nginx-proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: synapse-nginx-proxy
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 128m
    ports:
      # HTTP port (redirects to HTTPS)
      - "127.0.0.1:${NGINX_PROXY_PORT:-8081}:8081"
      # HTTPS port
      - "127.0.0.1:${NGINX_PROXY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/prometheus.conf:/etc/nginx/conf.d/prometheus.conf:ro
      - ./nginx/auth/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - synapse-prometheus
      - synapse-alertmanager
      - synapse-grafana
    networks:
      - monitoring
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  # 监控栈自有网络：prometheus / alertmanager / grafana / exporters / alert-handler /
  # nginx-proxy 之间的流量全在这张网上，与业务栈解耦。
  # 显式固定 `name:`：本文件以 `-p synapse-monitoring` 启动，若用默认名会被
  # 项目前缀污染成 `synapse-monitoring_monitoring`，且改名即断流。
  monitoring:
    name: ${SYNAPSE_MONITORING_NETWORK_NAME:-synapse_monitoring_network}
    driver: bridge

  synapse-network:
    # 由核心栈 `docker-compose.yml` 创建（name: ${SYNAPSE_NETWORK_NAME:-synapse_network}）。
    # 这里只引用，不拥有 —— 两个 compose 声明同名非 external 网络会让 Docker 报
    # “network ... was found but has incorrect label”。
    #
    # 变量必须是 SYNAPSE_NETWORK_NAME，不能是 COMPOSE_PROJECT_NAME：本文件由
    # deploy.sh 以 `compose -p synapse-monitoring -f …` 启动，`-p` 会把
    # COMPOSE_PROJECT_NAME 覆盖成 `synapse-monitoring`，用后者会解析出一个
    # 不存在的 `synapse-monitoring_network` 而启动失败（2026-09-22 实测）。
    external: true
    name: ${SYNAPSE_NETWORK_NAME:-synapse_network}

volumes:
  prometheus_data:
    name: synapse-prometheus-data
    driver: local
  alertmanager_data:
    name: synapse-alertmanager-data
    driver: local
  grafana_data:
    name: synapse-grafana-data
    driver: local
