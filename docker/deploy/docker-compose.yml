# =============================================================================
# synapse-rust Docker Compose 配置文件 — 生产全栈
# =============================================================================
# 定位（与 docker/docker-compose.yml 的边界）：
#   - 本文件：生产部署全栈。postgres/redis/migrator/synapse/nginx 五个服务，
#     迁移由独立 migrator 服务执行，80/443/8448 + SSL，app 只读根文件系统，
#     container_name 硬编码（synapse-postgres / synapse-redis / synapse-migrator
#     / synapse-app / synapse-nginx）。
#   - docker/docker-compose.yml：开发/CI 栈（可就地 build、服务名短、无 nginx、
#     由 entrypoint 迁移）。两个 CI 工作流按那些服务名起栈，不要改名。
# 两者不是副本：服务集合与用途不同，故意并存。
#
# 唯一配置源：`docker/config/`（本文件以 `../config` 挂载，非本目录副本）。
# =============================================================================
# 使用方法:
#   1. 复制 .env.example 为 .env 并修改配置
#   2. 运行 ./deploy.sh 进行部署
# =============================================================================

services:
  postgres:
    # [O2-7] digest pin，避免浮动 tag 导致静默升级
    image: postgres:16-alpine@sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb
    container_name: synapse-postgres
    restart: unless-stopped
    shm_size: 256m
    cpus: ${POSTGRES_CPU_LIMIT:-1.5}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1536m}
    memswap_limit: ${POSTGRES_MEMORY_LIMIT:-1536m}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-256}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-synapse}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---encoding=UTF-8 --lc-collate=C --lc-ctype=C}
      TZ: ${TZ:-UTC}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
      # 保持**单文件**挂载：宿主文件名是 `postgres.conf`，容器要读的是
      # `/etc/postgresql/postgresql.conf`。改成目录挂载（`../config:/etc/postgresql`）
      # 会让容器只看到 `postgres.conf`，postgres 找不到 `postgresql.conf` 而崩溃
      # （已实测：`could not access the server configuration file ... No such file`，
      #  容器进入 restart loop）。名称不一致使目录挂载在此处不可行。
      # 该文件的单文件 bind mount 风险有限：postgres 只在启动时读一次配置。
      #
      # 配置唯一真相源是仓库根的 `docker/config/`，本目录不再保留副本。
      - ../config/postgres.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      # ⚠️ 探针必须走 **TCP 并真正认证查询一次**，不能用默认的 unix socket。
      # 官方 postgres 镜像在 initdb + `docker-entrypoint-initdb.d` 阶段会先起一个
      # **只监听 unix socket** 的临时实例（entrypoint 用 `-c listen_addresses=''`）。
      # 此时 `pg_isready`（不带 `-h`）报 "accepting connections" ⇒ 容器**在初始化
      # 中途就被判 healthy**，而 `pg_isready` 的返回码并不校验库/用户/密码是否可用。
      # 后果：`depends_on: condition: service_healthy` 与 deploy.sh 的
      # `wait_for_container_health` 一起过早放行 migrator，migrator 走 TCP 连不上；
      # 它的重试窗口只有 `retry 3 5`（约 10s），慢机器上初始化更久 ⇒ 部署以
      # "数据库迁移失败"中止（2026-09-19 用带 `pg_sleep(30)` 初始化脚本的全新
      # postgres:16-alpine 复现：旧探针连续 24s+ 报 rc=0，新探针同时段全部失败）。
      # `-h 127.0.0.1` 让临时实例不满足条件；末尾那次 psql 同时证明"这个用户名/库
      # 真的能认证并查询"，这正是 migrator 需要的语义。
      # `$$` 是 compose 转义 —— 交给容器 shell 的是字面 `$`。
      # 实测证据见 docs/audit/DB_REVIEW_2026-09-17.md §15.9。
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" && PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -tAc 'SELECT 1'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - synapse-network

  redis:
    # [O2-7] digest pin
    image: redis:7-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
    container_name: synapse-redis
    restart: unless-stopped
    cpus: ${REDIS_CPU_LIMIT:-1.0}
    mem_limit: ${REDIS_MEMORY_LIMIT:-512m}
    memswap_limit: ${REDIS_MEMORY_LIMIT:-512m}
    pids_limit: ${REDIS_PIDS_LIMIT:-128}
    # [O2-4] 通过 REDISCLI_AUTH 传递密码，避免在 healthcheck argv 中暴露
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAX_MEMORY:-256mb}
      - --maxmemory-policy
      - ${REDIS_EVICTION_POLICY:-allkeys-lru}
      - --save
      - "60"
      - "1000"
      - --save
      - "300"
      - "100"
      - --save
      - "900"
      - "1"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - synapse-network

  migrator:
    # [O2-7] digest pin，与 postgres 保持同一 digest
    image: postgres:16-alpine@sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb
    container_name: synapse-migrator
    # `on-failure:3` 而不是 `"no"`：migrator 失败的原因里最典型的一类是"postgres 还没
    # 真正可写"（见上面 postgres.healthcheck 的注释）。`deploy.sh` 走的是
    # `compose run --rm`，而 `run` **不套用** restart 策略、只有 `retry 3 5`（约 10s），
    # 所以本项不影响标准部署路径；它兜住的是直接 `docker compose up` 起整个栈的用法
    # —— 在那里 `"no"` 会让一次瞬时失败把整套服务留在"server 起来了、schema 没迁移"
    # 的状态。重试 3 次仍失败则照样停止，不会掩盖真正的错误。
    restart: "on-failure:3"
    cpus: ${MIGRATOR_CPU_LIMIT:-1.0}
    mem_limit: ${MIGRATOR_MEMORY_LIMIT:-1024m}
    memswap_limit: ${MIGRATOR_MEMORY_LIMIT:-1024m}
    pids_limit: ${MIGRATOR_PIDS_LIMIT:-128}
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      DB_NAME: ${POSTGRES_DB:-synapse}
      # 不在此注入"扩展选择"变量：migrator 的 entrypoint 链
      # (container-migrate.sh → db_migrate.sh) 从不读它，唯一消费者是宿主侧
      # deploy.sh（它用 `compose run -e ...` 显式传入，见 deploy.sh:1213）。
      # 曾在此写死该变量的第二个默认值：同一职责两份实现（铁律 2）兼死配置（铁律 1）。
    entrypoint:
      - /scripts/container-migrate.sh
    command: [ "migrate" ]
    volumes:
      # P3-fix: mount the canonical migrations directory directly.
      #
      # This used to be `./migrations`, a hand-synced copy under docker/deploy/.
      # That copy silently drifted: it carried extra files from a dead v7 lineage
      # (counts deliberately live in ONE place — `migrations/README.md`
      # §唯一真相源, which also carries the `comm`/`grep` recompute script)
      # and was missing 13 recent migrations (schema_p1_federation_and_integrity,
      # schema_p2_data_integrity, schema_p3_perf, schema_cleanup_dedup_and_dead_code,
      # extend_room_version_check, event_relations_pagination_index, ...), so a
      # fresh deploy built a schema without those fixes. `check_migration_consistency.py`
      # failed in CI on exactly this (`missing_deploy_mirror` x8).
      #
      # A symlink was tried first and does NOT work here: BSD/macOS `find` does not
      # follow a symlink given as the search root, so `find "$MIGRATIONS_DIR" -maxdepth 1
      # -type f -name '00000000_unified_schema_v*.sql'` matched nothing and the
      # migrator aborted with "找不到统一基线脚本".
      #
      # `deploy.sh` already resolves PROJECT_ROOT as `$SCRIPT_DIR/../..` and builds
      # the image from there, so the repo root is always present in this deploy path.
      - ../../migrations:/migrations:ro
      - ./scripts/container-migrate.sh:/scripts/container-migrate.sh:ro
      # 迁移的**唯一实现**，与 wrapper 同级挂载：container-migrate.sh 只做桥接后
      # exec 它。这里刻意用 bind mount 而**不是**复制进镜像 —— 复制就是第二份实现，
      # 会再次漂移（铁律 2）。postgres:16-alpine 里也没有这个文件。
      # 注意 `..` 是 docker/（compose 文件位于 docker/deploy/）。
      - ../db_migrate.sh:/scripts/db_migrate.sh:ro
      - ./logs:/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - synapse-network

  synapse:
    image: ${SYNAPSE_IMAGE:-synapse-rust:local}
    pull_policy: ${SYNAPSE_PULL_POLICY:-never}
    container_name: synapse-app
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cpus: ${SYNAPSE_CPU_LIMIT:-2.0}
    mem_limit: ${SYNAPSE_MEMORY_LIMIT:-2048m}
    memswap_limit: ${SYNAPSE_MEMORY_LIMIT:-2048m}
    pids_limit: ${SYNAPSE_PIDS_LIMIT:-512}
    env_file:
      - ./.env
    # [O2-3] 等待 migrator 完成迁移，确保 app 启动时 schema 已是最新
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SYNAPSE_CONFIG_PATH: /app/config/homeserver.yaml
      RATE_LIMIT_CONFIG_PATH: /app/config/rate_limit.yaml
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-synapse}?sslmode=disable
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      DB_NAME: ${POSTGRES_DB:-synapse}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      SERVER_NAME: ${SERVER_NAME:?SERVER_NAME must be set}
      PUBLIC_BASEURL: ${PUBLIC_BASEURL:?PUBLIC_BASEURL must be set}
      REGISTRATION_SECRET: ${REGISTRATION_SHARED_SECRET:?REGISTRATION_SHARED_SECRET must be set}
      ADMIN_SECRET: ${ADMIN_SHARED_SECRET:?ADMIN_SHARED_SECRET must be set}
      ADMIN_SHARED_SECRET: ${ADMIN_SHARED_SECRET:?ADMIN_SHARED_SECRET must be set}
      REGISTRATION_SHARED_SECRET: ${REGISTRATION_SHARED_SECRET:?REGISTRATION_SHARED_SECRET must be set}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      MACAROON_SECRET: ${MACAROON_SECRET:?MACAROON_SECRET must be set}
      FORM_SECRET: ${FORM_SECRET:?FORM_SECRET must be set}
      FEDERATION_SIGNING_KEY: ${FEDERATION_SIGNING_KEY:?FEDERATION_SIGNING_KEY must be set}
      # 用于在数据库中加密联邦签名私钥（HKDF-SHA256 → AES-256-GCM）。
      # 这里用 `:?` 显式做非空校验：`env_file: ./.env` 本来就会把该变量传进容器，
      # 但 `.env.example` 里它是**空值**，而 `${FEDERATION_MASTER_KEY:-}` 的空值会
      # 解析成空字符串 —— HKDF 对空输入照样派生出可用的 AES 密钥，于是私钥带
      # `enc:` 前缀入库，看似加密、实则拿到库导出即可解开，同时 fail-closed 的
      # "未配置主密钥"分支永远走不到。`:?` 让"空/缺失"变成启动即失败。
      FEDERATION_MASTER_KEY: ${FEDERATION_MASTER_KEY:?FEDERATION_MASTER_KEY must be set (openssl rand -hex 32, or scripts/generate-secrets.sh missing)}
      FEDERATION_KEY_ID: ${FEDERATION_KEY_ID:-ed25519:auto}
      WORKER_REPLICATION_SECRET: ${WORKER_REPLICATION_SECRET:?WORKER_REPLICATION_SECRET must be set}
      TOKEN_HASH_SECRET: ${TOKEN_HASH_SECRET:?TOKEN_HASH_SECRET must be set (>=32 bytes)}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8008,http://127.0.0.1:8008,http://localhost:6130,http://127.0.0.1:6130,http://localhost:8080,http://127.0.0.1:8080,https://localhost:8443,https://127.0.0.1:8443,tauri://localhost,https://tauri.localhost,vector://vector}
      CORS_ORIGIN_PATTERN: ${CORS_ORIGIN_PATTERN:-^https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?$}
      SYNAPSE__DATABASE__POOL_SIZE: ${SYNAPSE__DATABASE__POOL_SIZE:-20}
      SYNAPSE__DATABASE__MAX_SIZE: ${SYNAPSE__DATABASE__MAX_SIZE:-50}
      SYNAPSE__DATABASE__MIN_IDLE: ${SYNAPSE__DATABASE__MIN_IDLE:-10}
      SYNAPSE__DATABASE__CONNECTION_TIMEOUT: ${SYNAPSE__DATABASE__CONNECTION_TIMEOUT:-60}
      RUST_LOG: ${RUST_LOG:-info}
      # jemalloc profiler 配置（内存泄漏诊断）。空值=关闭；.env 里 MALLOC_CONF 设值即启用。
      MALLOC_CONF: ${MALLOC_CONF:-}
      TZ: ${TZ:-UTC}
      SYNAPSE_MEDIA_PATH: /app/data/media
      SYNAPSE_ENABLE_RUNTIME_DB_INIT: ${SYNAPSE_ENABLE_RUNTIME_DB_INIT:-false}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-synapse:}
      SYNAPSE__SERVER__MEGOLM_ENCRYPTION_KEY_PATH: ${SYNAPSE_MEGOLM_ENCRYPTION_KEY_PATH:-/app/data/megolm.key}
    volumes:
      # 必须挂载宿主机**目录**，不要改回 `synapse_data` 命名卷。
      #
      # /app/data 存放两把必须在容器启动前就存在的密钥：
      #   - megolm.key  ← SYNAPSE__SERVER__MEGOLM_ENCRYPTION_KEY_PATH 指向它。
      #     `resolve_at_rest_key` 是 **fail-closed** 的：只要路径被配置而文件缺失
      #     或不是合法的 32 字节 base64，服务就拒绝启动。
      #   - signing.key ← homeserver.yaml 的 server.signing_key_path，由服务写出。
      #
      # 用命名卷时这个目录是**空白**的，部署脚本也无从落盘（distroless 镜像没有
      # shell，无法在卷里生成文件）。实测（2026-09-21）：干净卷首次部署时
      # synapse-app 启动即 panic —— `Failed to read key file /app/data/megolm.key`，
      # 崩溃循环 exit 133。
      #
      # 改成宿主机目录后：deploy.sh 的 ensure_app_data_keys 可以先在宿主机把密钥
      # 备好（已实测 uid 1000 对该目录可读写），运维也能直接备份/审计它 ——
      # 与 ssl/、prometheus/auth/ 的做法一致。
      #
      # 注：`./media` 为嵌套挂载，Docker 会按路径深度先挂 /app/data/media，
      # 因此媒体文件仍落在 deploy/media/，不会进 synapse-data/。
      - ./synapse-data:/app/data
      - ./media:/app/data/media
      # ⚠️ 必须挂载**目录**，不要改回逐个文件挂载。
      #
      # 单文件 bind mount（`../config/x.yaml:/app/config/x.yaml`）绑定的是
      # 宿主机的 **inode**。对文件做原子替换（写临时文件 + rename，编辑器与
      # `sed -i` 的常见实现）会换掉 inode，但容器的绑定仍指向旧 inode ——
      # 容器内路径随之"消失"，而进程继续运行、继续用旧配置服务。
      # 实测（2026-09-11）：容器内 `head /app/config/rate_limit.yaml` 报
      # No such file or directory，而服务仍按旧限流规则运行，且必须
      # `docker compose restart` 才能恢复。
      #
      # 挂载目录后，容器按**名字**解析文件，宿主机替换文件不再影响挂载。
      # 详见 docs/audit/P4_performance_baseline_2026-09-11.md §5.6。
      #
      # 镜像内 /app/config 本身为空（默认值在 /app/config_defaults/），
      # 因此整目录挂载不会遮蔽任何内置文件。
      #
      # 配置唯一真相源是仓库根的 `docker/config/`（含 appservices/），
      # 本目录不再保留副本；与迁移目录 `../../migrations` 的处理方式一致。
      - ../config:/app/config:ro
    healthcheck:
      test: [ "CMD", "/app/healthcheck" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    # [O3-1] 给 /sync 长轮询和 DB 事务留出优雅关闭时间
    stop_grace_period: 30s
    cap_drop:
      - ALL
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      # 只绑回环。对外访问一律走 nginx（80/443/8448，见上面的 nginx 服务）。
      # 原先发布到所有接口，等于给 nginx 开了个旁路：绕过它就绕过了 TLS 和代理层。
      # 9090 更严重 —— `docker/config/homeserver.yaml` 里 `prometheus.enabled: true`，
      # 而 metrics 路由**没有任何鉴权**（`src/server/mod.rs` 直接
      # `Router::new().route(path, get(render_prometheus_metrics))`），
      # 发布即等于公网可读运维指标。
      # 若确实需要跨机抓取指标，把下面这行改成抓取端可访问的地址（例如内网 IP）。
      - "127.0.0.1:${SYNAPSE_PORT:-8008}:8008"
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - synapse-network

  nginx:
    # [O2-7] digest pin
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: synapse-nginx
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cpus: ${NGINX_CPU_LIMIT:-0.5}
    mem_limit: ${NGINX_MEMORY_LIMIT:-256m}
    memswap_limit: ${NGINX_MEMORY_LIMIT:-256m}
    pids_limit: ${NGINX_PIDS_LIMIT:-128}
    depends_on:
      synapse:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${FEDERATION_PORT:-8448}:8448"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
    # [O3-2] 日志已改为 stdout，无需挂载 nginx_logs
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - synapse-network

networks:
  synapse-network:
    driver: bridge
    # 刻意**不**用 `${COMPOSE_PROJECT_NAME:-synapse}_network`：
    # 监控栈是以 `docker compose -p synapse-monitoring -f docker-compose.monitoring.yml`
    # 启动的，`-p` 会把 COMPOSE_PROJECT_NAME 覆盖成 `synapse-monitoring`，于是同一个
    # 表达式在监控栈里解析成 `synapse-monitoring_network` —— 而该网络并不存在
    # （网络由核心栈拥有），实测报错：
    #   network synapse-monitoring_network declared as external, but could not be found
    # 用一个**独立**的变量名做「网络名」这一个用途，两个 compose 才不会随 `-p` 漂移。
    name: ${SYNAPSE_NETWORK_NAME:-synapse_network}

volumes:
  # [O3-14] 数据卷标签：标识用途与备份策略，便于运维自动化发现与恢复
  postgres_data:
    driver: local
    labels:
      synapse-rust.backup: "daily"
      synapse-rust.data-type: "postgres"
  redis_data:
    driver: local
    labels:
      synapse-rust.backup: "hourly"
      synapse-rust.data-type: "redis"
  # 注：原先的 `synapse_data` 命名卷已移除 —— /app/data 现为宿主机 bind mount
  # （`./synapse-data`），见 synapse 服务的 volumes 注释。若宿主机上还残留该卷，
  # 请先确认其中是否有现役 megolm.key（有则搬进 ./synapse-data 再删卷），
  # 然后 `docker volume rm ${COMPOSE_PROJECT_NAME:-synapse}_synapse_data` 清理。
  # deploy.sh 的 ensure_app_data_keys 在该卷**仍存在**时会拒绝继续 —— 这是刻意的
  # fail-closed：宁可要人确认一次，也不要静默换钥导致已入库的 megolm 密文不可解。
  nginx_logs:
    driver: local
    labels:
      synapse-rust.data-type: "nginx-logs"
