user  nginx;
worker_processes auto;
# [O3-2] 日志写入 stdout/stderr，由 Docker json-file driver 负责轮转（max-size/max-file）
error_log /dev/stdout warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'lrs="$limit_req_status" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    # access_log 写入 stdout，配合 docker logging driver 的 max-size 轮转
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    reset_timedout_connection on;
    underscores_in_headers on;
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # — Rate limiting zones —————————————————————————————————————————————
    # 职责：基础设施级防滥用兜底（只拦异常流量），业务限流权威在 Rust 中间件。
    # matrix_api: 100r/s 为正常客户端稳态预留 10x 余量，正常流量永不触发。
    limit_req_zone $binary_remote_addr zone=matrix_api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=matrix_login:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=matrix_register:10m rate=15r/m;
    limit_req_zone $binary_remote_addr zone=matrix_captcha:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=matrix_captcha_read:10m rate=60r/m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream synapse_backend {
        server synapse:8008;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
