# Nginx 反向代理配置 - Prometheus 安全加固

upstream prometheus {
    server synapse-prometheus:9090;
}

upstream alertmanager {
    server synapse-alertmanager:9093;
}

upstream grafana {
    server synapse-grafana:3000;
}

server {
    listen 8081;
    server_name _;

    # Basic Authentication
    auth_basic "Prometheus Monitoring";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # 速率限制区域
    limit_req_zone $binary_remote_addr zone=prom_limit:10m rate=10r/s;

    # Prometheus API v1
    location /prometheus/api/v1/ {
        limit_req zone=prom_limit burst=20 nodelay;
        
        proxy_pass http://prometheus:9090/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Prometheus API v1 (完整路径)
    location /prometheus/api/ {
        limit_req zone=prom_limit burst=20 nodelay;
        
        proxy_pass http://prometheus:9090/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Prometheus web UI
    location /prometheus/ {
        limit_req zone=prom_limit burst=20 nodelay;
        
        proxy_pass http://prometheus:9090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Alertmanager API v2
    location /alertmanager/api/v2/ {
        limit_req zone=prom_limit burst=20 nodelay;
        
        proxy_pass http://alertmanager:9093/api/v2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Grafana
    location /grafana/ {
        limit_req zone=prom_limit burst=20 nodelay;
        
        proxy_pass http://grafana:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # Health check endpoint (无认证)
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
