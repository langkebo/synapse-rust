# Prometheus 安全访问配置
# 基础认证 + 速率限制

server {
    listen 8081;
    server_name _;

    auth_basic "Prometheus Monitoring";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Prometheus API
    location /prometheus/api/v1/ {
        proxy_pass http://synapse-prometheus:9090/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /prometheus/ {
        proxy_pass http://synapse-prometheus:9090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /alertmanager/ {
        proxy_pass http://synapse-alertmanager:9093/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /grafana/ {
        proxy_pass http://synapse-grafana:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
