enabled: true
default:
  per_second: 50
  burst_size: 100
endpoints:
  - path: "/_matrix/client/v3/login"
    match_type: "prefix"
    rule:
      per_second: 5
      burst_size: 50
  - path: "/_matrix/client/r0/login"
    match_type: "prefix"
    rule:
      per_second: 5
      burst_size: 50
  - path: "/_matrix/client/v3/register"
    match_type: "prefix"
    rule:
      per_second: 50
      burst_size: 100
  - path: "/_matrix/client/r0/register"
    match_type: "prefix"
    rule:
      per_second: 50
      burst_size: 100
  - path: "/_matrix/client/v3/account/password"
    match_type: "prefix"
    rule:
      per_second: 1
      burst_size: 3
  - path: "/_matrix/client/v3/register/email/requestToken"
    match_type: "prefix"
    rule:
      per_second: 1
      burst_size: 3
  - path: "/_matrix/client/v3/refresh"
    match_type: "prefix"
    rule:
      per_second: 2
      burst_size: 5
  - path: "/_matrix/client/v3/keys/upload"
    match_type: "prefix"
    rule:
      per_second: 5
      burst_size: 10
  - path: "/_matrix/client/v3/keys/query"
    match_type: "prefix"
    rule:
      per_second: 50
      burst_size: 300
  - path: "/_matrix/client/v3/keys/claim"
    match_type: "prefix"
    rule:
      per_second: 10
      burst_size: 30
  - path: "/_matrix/client/v3/friends/"
    match_type: "prefix"
    rule:
      per_second: 20
      burst_size: 60
  - path: "/_matrix/client/v1/friends/"
    match_type: "prefix"
    rule:
      per_second: 20
      burst_size: 60
  - path: "/_matrix/client/r0/friends/"
    match_type: "prefix"
    rule:
      per_second: 20
      burst_size: 60
  - path: "/_matrix/client/unstable/org.matrix.msc4108/"
    match_type: "prefix"
    rule:
      per_second: 10
      burst_size: 20
  - path: "/_synapse/external/"
    match_type: "prefix"
    rule:
      per_second: 10
      burst_size: 20
ip_header_priority:
  - "x-forwarded-for"
  - "x-real-ip"
  - "forwarded"
include_headers: true
exempt_paths:
  - "/"
exempt_path_prefixes:
  - "/_matrix/client/v3/sync"
  - "/_matrix/client/r0/sync"
  - "/_matrix/client/v3/events"
  - "/_matrix/client/r0/events"
endpoint_aliases: {}
fail_open_on_error: false
sync:
  enabled: false
  initial:
    per_second: 5
    burst_size: 10
  incremental:
    per_second: 50
    burst_size: 100
