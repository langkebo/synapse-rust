enabled: true
default:
  per_second: 50
  burst_size: 100
endpoints:
  - path: "/_matrix/client/versions"
    rule:
      per_second: 10
      burst_size: 30
  - path: "/.well-known/matrix/client"
    rule:
      per_second: 10
      burst_size: 30
  - path: "/.well-known/matrix/server"
    rule:
      per_second: 10
      burst_size: 30
  - path: "/health"
    rule:
      per_second: 10
      burst_size: 30
  - path: "/_matrix/client/v3/login"
    match_type: "prefix"
    rule:
      per_second: 5
      burst_size: 50
  - path: "/_matrix/client/r0/login"
    match_type: "prefix"
    rule:
      per_second: 5
      burst_size: 50
  - path: "/_matrix/client/v3/register"
    match_type: "prefix"
    rule:
      per_second: 1
      burst_size: 10
  - path: "/_matrix/client/v3/account/password"
    match_type: "prefix"
    rule:
      per_second: 1
      burst_size: 3
  - path: "/_matrix/client/v3/register/email/requestToken"
    match_type: "prefix"
    rule:
      per_second: 1
      burst_size: 3
  - path: "/_matrix/client/v3/refresh"
    match_type: "prefix"
    rule:
      per_second: 2
      burst_size: 5
  - path: "/_matrix/client/v3/keys/upload"
    match_type: "prefix"
    rule:
      per_second: 5
      burst_size: 10
ip_header_priority:
  - "x-forwarded-for"
  - "x-real-ip"
  - "forwarded"
include_headers: true
exempt_paths:
  - "/"
exempt_path_prefixes:
  - "/_matrix/client/v3/sync"
  - "/_matrix/client/r0/sync"
  - "/_matrix/client/v3/events"
  - "/_matrix/client/r0/events"
endpoint_aliases: {}
fail_open_on_error: false
sync:
  # ⚠️ 必须保持 enabled: true。
  #
  # `/sync` 与 sliding sync 在路由 ledger 中被标记为 `rate_limit_exempt`，
  # 因此**不受上面 default: per_second=50 的通用 IP 限流约束**；本段是
  # `/sync` 唯一的限流来源。设为 false 时的实测后果（2026-09-11）：
  #     `/_matrix/client/v3/sync?timeout=0` 连续 120 次请求 → 120×200，零 429
  # 即一个已认证用户用 `timeout=0` 紧循环即可制造无上限的 DB 读放大。
  #
  # 阈值取宽松值：每分钟 50 次增量 sync 的客户端刚好命中 1 次、随时可用，
  # 正常长轮询客户端不会误伤。疑似误伤时先看 `sync_rate_limited_total`
  # 指标，再上调 incremental。
  enabled: true
  initial:
    per_second: 5
    burst_size: 10
  incremental:
    per_second: 50
    burst_size: 100
