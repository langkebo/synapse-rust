# coturn TURN server configuration for matrix.test
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# Realm
realm=matrix.test
server-name=matrix.test

# Use fingerprint in TURN message
fingerprint

# Long-term credential mechanism
lt-cred-mech

# Static long-term credentials (use shared secret with homeserver)
use-auth-secret
static-auth-secret=dev-turn-secret

# Total quota and per-user quota
total-quota=100
bps-capacity=0
stale-nonce=600

# Logging
log-file=stdout
simple-log
verbose

# Disable CLI
no-cli

# Allow private IP ranges (local dev)
no-loopback-peers
no-multicast-peers
