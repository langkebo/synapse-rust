# =============================================================================
# Synapse-B 实例配置 (Federation Test with TLS) — 独立完整栈（不 include 主 compose）
# =============================================================================
# 独立栈说明同 docker-compose-synapse-a.yml：不 include 主 compose，避免多网络
# 下 Tokio 异步 DNS 解析 `db` 失败的合并缺陷。
#
# 与 A 端的关键差异：B 端是**上游真 Synapse**（参考实现），而非 synapse-rust。
#   * A 端 = synapse-rust（被测对象）
#   * B 端 = ghcr.io/element-hq/synapse（对照实现）
# 这样 A↔B 的联邦互操作测试才是真正的「跨实现」验证（rust ↔ python）。
# 代价：失去 rust↔rust 的同构回归能力（该回归由 scripts/federation-test 之外的
# 单栈测试覆盖）。
#
# Synapse 配置由 docker/federation-test/synapse/entrypoint.sh 在容器启动时从
# 环境变量生成（/data/homeserver.yaml），再 exec 官方 /start.py 完成 schema
# 迁移与启动。签名字由 Synapse 自行生成于 /data/signing.key。
# =============================================================================

services:
  synapse:
    image: ${SYNAPSE_UPSTREAM_IMAGE:-ghcr.io/element-hq/synapse}:${SYNAPSE_UPSTREAM_TAG:-v1.162.0}
    container_name: synapse-federation-b
    restart: unless-stopped
    # 覆盖官方镜像的 ENTRYPOINT（/start.py），先由本脚本生成配置，最后再 exec /start.py。
    entrypoint: ["/bin/bash", "/synapse-setup/entrypoint.sh"]
    ports:
      - "127.0.0.1:18009:8008"
      # 联邦端口 18449 改由 nginx 边车暴露（TLS），Synapse 自身只在容器内提供明文 8448。
    env_file:
      - .env.b
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      # ── Server Identity (MUST match certificate CN/SAN) ──
      SERVER_NAME: "synapse-b.federation.test"
      PUBLIC_BASEURL: "https://synapse-b.federation.test:18449"
      # ── Database（Synapse 使用 psycopg2 连接本栈的 db 服务）──
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-synapse}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_NAME: ${DB_NAME:-synapse}
      DATA_DIR: "/data"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ../data/b:/data
      - ./synapse:/synapse-setup:ro
      # 自签测试 CA：供 Synapse 出站联邦 TLS 校验信任（federation_custom_ca_list）。
      - ./certs:/certs:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Synapse 自带 /health 端点（无需额外装 curl）。
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - federation_test_net_b
      - federation_test_net_shared

  # ===========================================================================
  # 联邦 8448 的 TLS 终结边车（与 A 实例对称，见 A 文件中的说明）
  # ===========================================================================
  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: synapse-federation-b-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:18449:8448"
    environment:
      SERVER_NAME: "synapse-b.federation.test"
      TLS_CERT: "/etc/nginx/certs/synapse-b.crt"
      TLS_KEY: "/etc/nginx/certs/synapse-b.key"
      UPSTREAM: "synapse:8448"
    volumes:
      - ./nginx/federation.conf.template:/etc/nginx/templates/federation.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - synapse
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8448 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      federation_test_net_b:
      federation_test_net_shared:
        aliases:
          - synapse-b.federation.test

  db:
    image: postgres:16-alpine@sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb
    container_name: synapse-federation-b-db
    restart: unless-stopped
    shm_size: "256m"
    environment:
      POSTGRES_USER: ${DB_USER:-synapse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:-synapse}
      POSTGRES_INITDB_ARGS: --encoding=UTF-8 --lc-collate=C --lc-ctype=C
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres_data_b:/var/lib/postgresql/data
      - ../config/postgres.conf:/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" && PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -tAc 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - federation_test_net_b

networks:
  federation_test_net_b:
    name: federation_test_net_b
    driver: bridge
  federation_test_net_shared:
    name: federation_test_net_shared
    driver: bridge

volumes:
  postgres_data_b:
    driver: local
