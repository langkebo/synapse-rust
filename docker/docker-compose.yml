# =============================================================================
# synapse-rust Docker Compose — 开发/CI 栈
# =============================================================================
# 定位（与 docker/deploy/docker-compose.yml 的边界）：
#   - 本文件：开发与 CI 用。可就地 `build`（target: tools）、服务名短
#     （synapse-rust/db/redis）、暴露 8008/28448、不带 nginx/SSL、迁移由
#     容器 entrypoint（RUN_MIGRATIONS=true）完成。
#     `.github/workflows/backend-validation.yml` 与 `.github/workflows/e2ee-interop.yml`
#     通过 scripts/ci_backend_validation.sh、scripts/test/run_sdk_verification_real_backend.sh
#     等脚本**按此处服务名**起栈，改名会直接打断这些 CI 门禁。
#   - docker/deploy/docker-compose.yml：生产全栈（postgres/redis/migrator/
#     synapse/nginx，独立 migrator 服务、80/443/8448、只读根文件系统、硬编码
#     container_name）。
# 两者**不是副本**：服务集合与用途不同，故意并存。唯一必须一致的是配置源：
# 两栈都挂 docker/config/ 这一份（deploy 用 ../config，此处用 ./config），
# 不得各自持有副本。见 tests/unit/config_mount_tests.rs。
# =============================================================================

services:
  synapse-rust:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: tools
      args:
        CARGO_FEATURE_ARGS: ${DOCKER_CARGO_FEATURE_ARGS:---features server,core-private-chat,widgets,external-services,voice-extended,cas-sso,saml-sso,friends --no-default-features}
        CARGO_BUILD_JOBS: ${DOCKER_CARGO_BUILD_JOBS:-2}
    image: ${SYNAPSE_IMAGE:-synapse-rust}:${SYNAPSE_IMAGE_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-synapse}-rust
    restart: unless-stopped
    cpus: ${SYNAPSE_CPU_LIMIT:-2.0}
    mem_limit: ${SYNAPSE_MEMORY_LIMIT:-2048m}
    pids_limit: ${SYNAPSE_PIDS_LIMIT:-512}
    env_file:
      - ./.env
    networks:
      - synapse_network
    ports:
      - "${SYNAPSE_PORT:-8008}:8008"
      - "${FEDERATION_PORT:-28448}:8448"
    environment:
      SYNAPSE_CONFIG_PATH: /app/config/homeserver.yaml
      RATE_LIMIT_CONFIG_PATH: /app/config/rate_limit.yaml
      DB_USER: ${DB_USER:-synapse}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_NAME: ${DB_NAME:-synapse}
      DATABASE_URL: postgres://${DB_USER:-synapse}:${DB_PASSWORD:?DB_PASSWORD must be set}@db:5432/${DB_NAME:-synapse}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      VERIFY_SCHEMA: ${VERIFY_SCHEMA:-true}
      STOP_ON_MIGRATION_FAILURE: ${STOP_ON_MIGRATION_FAILURE:-true}
      DB_WAIT_ATTEMPTS: ${DB_WAIT_ATTEMPTS:-30}
      DB_WAIT_INTERVAL: ${DB_WAIT_INTERVAL:-2}
      MIGRATION_TIMEOUT: ${MIGRATION_TIMEOUT:-300}
      SYNAPSE_ENABLE_RUNTIME_DB_INIT: ${SYNAPSE_ENABLE_RUNTIME_DB_INIT:-true}
      SYNAPSE_SKIP_SCHEMA_CHECK: ${SYNAPSE_SKIP_SCHEMA_CHECK:-false}
      SYNAPSE__SERVER__MEGOLM_ENCRYPTION_KEY_PATH: ${SYNAPSE_MEGOLM_ENCRYPTION_KEY_PATH:-/app/data/megolm.key}
      TOKEN_HASH_SECRET: ${TOKEN_HASH_SECRET:?TOKEN_HASH_SECRET must be set (>=32 bytes)}
      RUST_LOG: ${RUST_LOG:-info}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # ⚠️ 挂载目录而非单个文件。单文件 bind mount 绑定的是宿主机 inode；
      # 对文件做原子替换（写临时文件 + rename）会让容器内路径"消失"，
      # 而进程继续用旧配置运行（实测 `head /app/config/x.yaml` → No such file）。
      # 挂载目录后容器按名字解析，宿主机替换文件不再影响挂载。
      # 详见 docs/audit/P4_performance_baseline_2026-09-11.md §5.6。
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "/app/healthcheck" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
  db:
    image: postgres:${POSTGRES_VERSION:-16}
    container_name: ${COMPOSE_PROJECT_NAME:-synapse}-postgres
    restart: unless-stopped
    cpus: ${DB_CPU_LIMIT:-1.5}
    mem_limit: ${DB_MEMORY_LIMIT:-1536m}
    pids_limit: ${DB_PIDS_LIMIT:-256}
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${DB_USER:-synapse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:-synapse}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---encoding=UTF-8 --lc-collate=C --lc-ctype=C}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 保持单文件挂载：宿主文件名 `postgres.conf` 与容器要读的
      # `/etc/postgresql/postgresql.conf` 名称不同，目录挂载会让 postgres
      # 找不到配置文件而崩溃。理由详见 docker/deploy/docker-compose.yml。
      - ./config/postgres.conf:/etc/postgresql/postgresql.conf
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-synapse} -d ${DB_NAME:-synapse}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - synapse_network
    command: >
      postgres -c config_file=/etc/postgresql/postgresql.conf
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:${REDIS_VERSION:-7}-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-synapse}-redis
    restart: unless-stopped
    cpus: ${REDIS_CPU_LIMIT:-1.0}
    mem_limit: ${REDIS_MEMORY_LIMIT:-512m}
    pids_limit: ${REDIS_PIDS_LIMIT:-128}
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set} --appendonly yes --maxmemory ${REDIS_MAX_MEMORY:-256mb} --maxmemory-policy ${REDIS_EVICTION_POLICY:-allkeys-lru} --save 60 1000 --save 300 100 --save 900 1
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:?REDIS_PASSWORD must be set}\" ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - synapse_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
networks:
  synapse_network:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME:-synapse}_network
