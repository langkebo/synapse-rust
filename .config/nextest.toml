# CI 口径的 profile。⚠️ `ci.yml` 自己**不用**它：每个 nextest 步骤都在默认
# profile 上用命令行旗标表达同一批设置（`--test-threads 4`、`--no-fail-fast`）。
# 本 profile 服务的是本地 `--profile ci`（AGENTS.md / TESTING.md 推荐的集成测试
# 命令），所以这里的值必须等于 `ci.yml` 的值，否则本地复刻与 CI 结论不同 ——
# 曾经写 `test-threads = 12` / `retries = 2`，正是两处漂移（sweep A13）：
#   - 12 线程会重现 CI 已经修掉的 `53200 out of shared memory`（§14.13：共享锁表
#     在 6 线程即爆，集成车道因此定为 4）；
#   - 重试被 `ci.yml` 的 `Run library unit tests (--workspace --lib)` 步骤注释明确收回
#     （它曾把 main 上 11 个真实克隆失败重跑成绿），
#     且 `flaky-result = "fail"` 下重试**改变不了判定**，只白花时间。
# 改 CI 的线程数/重试口径时必须同步这里（反之亦然）。
[profile.ci]
fail-fast = false
retries = 0
test-threads = 4
# 保险：万一将来有人加回 retries，flaky 仍判失败，不会被重试掩盖。
flaky-result = "fail"
# P1: slow-timeout — mark tests exceeding 60s as slow, terminate after 120s.
# After P0 schema pooling, most tests finish in 2-3s; 60s is a generous threshold.
slow-timeout = { period = "60s", terminate-after = 2 }
# P1: leak-timeout — detect resource leaks (unclosed connections/pools) faster.
leak-timeout = "500ms"

[profile.ci.junit]
path = "artifacts/nextest-junit.xml"

# P1: Test grouping considered and rejected — non-DB tests are only 6.6%
# (86/1304: cache_tests, regex_cache_tests, coverage_tests, nullable_decode_tests).
# Adding cargo-test-group dev-dependency + marking 86 tests is not worth the
# complexity. Parallelism tuning (test-threads=12) already captures most gains.

# NOTE: the `retention-server-policy` test-group used to live here. It existed
# because `retention_service::db_tests` ran against the SHARED database and all
# three tests mutated the same global single-row `server_retention_policy`
# (id = 1); under nextest's process-per-test model `#[serial_test::serial]` is an
# in-process lock that does NOT serialize across processes, so concurrent runs
# raced. Those tests now use per-test isolated schemas
# (`prepare_isolated_test_pool`), so each process mutates its OWN copy of that
# row and the cross-process race is gone by construction (verified: the cohort
# passes 3/3 consecutive runs at --test-threads 4).
#
# The test-group was a workaround for shared mutable state. It is redundant now
# and was removed so the suite stays fully parallel. Do not re-add it: if a test
# needs a mutex, the correct fix is per-test schema isolation, not serialization.

# P4-3: TDD profile for fast Red-Green-Refactor cycles.
# Usage: cargo nextest run -p <crate> <test_name> -P tdd
# - fail-fast=true: stop on first failure (RED should be immediate)
# - retries=0: no flaky masking; if RED fails, it fails now
# - flaky-result=fail: treat flaky as failure (don't hide real bugs)
[profile.tdd]
fail-fast = true
retries = 0
flaky-result = "fail"
# P1: same slow-timeout for TDD cycles
slow-timeout = { period = "30s", terminate-after = 1 }

# Dev profile for zero-flags test runs (with nextest 0.9.140).
# Usage: cargo nt --lib          (lib tests with test-utils)
#        cargo nt --test unit    (unit test target)
#        cargo nt --test integration  (needs DB)
#
# NOTE: nextest 0.9.140 does NOT support 'features' in profile config;
#       the 'features = "test-utils"' line is silently ignored with a warning.
#       Use the 'cargo nt' alias instead:
#         cargo nt = nextest run --profile test --features test-utils
[profile.test]
fail-fast = true
retries = 0
# P1: dev profile uses higher parallelism for local iteration speed
test-threads = 12
