# ============================================================================
# docker-security-scan.yml — Docker 镜像安全门禁
# ============================================================================
# 触发时机：push 到 main / PR 到 main
# 作用：
#   1) hadolint — Dockerfile lint（基础镜像 pin、best practices）
#   2) trivy     — 镜像 CVE 扫描（HIGH/CRITICAL 级别阻断）
#   3) buildx cache — 启用 buildx 并传递 cache-from/cache-to，
#      加速后续构建 (对应 P1-5)
# ============================================================================
name: Docker Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-security-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── 1) Dockerfile lint ──────────────────────────────────────────────
  hadolint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ⚠️ `@v3` 不存在：该仓库只有 `v3.0.0` … `v3.5.0` 这类完整版本 tag，
      # 没有浮动的 `v3` tag（`gh api .../git/ref/tags/v3` → 404）。写成 `@v3`
      # 时 GitHub 在 **Set up job** 阶段就报
      #   Unable to resolve action `hadolint/hadolint-action@v3`,
      #   unable to find version `v3`
      # 整个 job 一个 step 都不跑（2026-09-20 push run 35493936815 实测）。
      # 这里钉到完整版本，而不是补一个浮动 tag —— 与 format-governance.yml
      # 钉 `ruff==0.16.8` 同一判据：门禁结论不应随运行日期变化。
      - name: Run hadolint on Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: docker/Dockerfile
          # ⚠️ `ignore` must be a **comma-separated string**, not a YAML list.
          # As a list, GitHub's workflow validator rejects the file
          # ("expected scalar node for string value but found sequence node")
          # and every run fails at startup with 0 jobs — which is exactly what
          # happened from the moment this workflow was added (2026-09-19) until
          # 2026-09-20. Verified with actionlint.
          #   已知忽略：Dockerfile 使用国内镜像源加速构建 (DL3008)
          #   多阶段构建中 RUN 后清理 apt 列表 (DL3009)
          #   基础镜像已通过 ARG pin 到 digest (DL3006)
          #   使用 --no-install-recommends 是刻意优化 (DL3007)
          ignore: DL3008,DL3009,DL3006,DL3007

  # ── 2) 构建镜像并扫描 CVE ───────────────────────────────────────────
  trivy-scan:
    name: Trivy Image Scan
    needs: hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # `upload-sarif` needs `security-events: write` to publish into Code
    # Scanning. This workflow had no `permissions:` block at all, so the upload
    # failed with `Resource not accessible by integration` (measured: main run
    # 35498321562) — the SARIF had already been produced and post-processed
    # (`Post-processing sarif files: ["trivy-results.sarif"]`), so the scan
    # result was simply discarded. Granted per-job instead of workflow-wide: the
    # hadolint and digest-pin jobs need no write scope. `actions: read` is what
    # codeql-action uses to correlate an upload with its workflow run.
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # P1-5 note (2026-09-20): the previous "Set up Docker Buildx" step passed
      # `cache-from` / `cache-to` to `docker/setup-buildx-action@v3`, which does
      # not define those inputs (actionlint: available inputs are append,
      # buildkitd-config, buildkitd-flags, cache-binary, cleanup, config,
      # driver, driver-opts, endpoint, install, keep-state, name, platforms,
      # use, version). Because the whole workflow file was invalid, nothing here
      # ever executed. The step is removed rather than corrected: the GHA build
      # cache is *not* wired, because `type=gha` cache export requires
      # `docker buildx build` with the docker-container driver, while the build
      # below is a plain `docker build`. P1-5 stays open in
      # docs/audit/DOCKER_REVIEW_2026-09-19.md.

      - name: Build image for scan
        run: |
          # `-f docker/Dockerfile` 不可省：构建上下文是仓库根（Dockerfile 的
          # `COPY Cargo.toml Cargo.lock ./` 等都以根为基准），但 Dockerfile 本身在
          # `docker/` 下。不给 `-f` 时 docker 默认找 `./Dockerfile`，实测 main run
          # 35497543078 报 `failed to read dockerfile: open Dockerfile: no such file
          # or directory`，job 在 5 秒内死掉、trivy-results.sarif 从未产出（于是
          # 上传 SARIF 步骤再报 `Path does not exist`）。本仓库其余 4 处调用点
          # （Makefile:285、build-and-push.sh:59、deploy.sh:1174、
          # docker/docker-compose.yml:23）都显式给了路径，这里是唯一的漏网处。
          docker build \
            -f docker/Dockerfile \
            --target tools \
            --build-arg CARGO_FEATURE_ARGS="--features core-private-chat,widgets,external-services,voice-extended,cas-sso,saml-sso,friends --no-default-features" \
            -t synapse-rust:scan \
            .

      # [P1-4] Trivy CVE 扫描：HIGH/CRITICAL 阻断
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'synapse-rust:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy results to SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'docker-image-vulnerabilities'

      # The SARIF upload above publishes to Code Scanning, which is the only
      # place the findings were readable — and it silently discards everything
      # when the token lacks `security-events: write`. Keeping the file as an
      # artifact makes the CVE list readable from the run itself, which is what
      # the gate's verdict has to be justified against. `if: always()` because
      # the scan step exits 1 by design when fixable HIGH/CRITICAL are found —
      # i.e. exactly in the case where the report is most needed.
      - name: Upload Trivy SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: 14

  # ── 3) 扫描基础镜像 digest pin 是否被篡改 ──────────────────────────
  digest-pin-check:
    name: Digest Pin Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 验证 Dockerfile 中的 digest pin 在公共 registry 上仍然有效
      # (P0-2 相关：确认 digest 没有被过期/替换)
      - name: Verify pinned base images
        run: |
          for img in \
            "rust:1.93.0-slim-bookworm@sha256:776861219cd851131c1cec3bbd7cbeb16b99a794048097eb69ad9682a8ed0d57" \
            "debian:bookworm-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251" \
            "gcr.io/distroless/cc-debian12@sha256:e8e7ee4b8b106d4c5fde9e422a321b2b8a2d5cca546c97adcce927f3e1d36e36"; do
            echo "Verifying $img ..."
            docker pull "$img" || { echo "FAILED: pin broken for $img"; exit 1; }
          done
          echo "All pinned base images verified successfully."
