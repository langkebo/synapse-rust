name: Route Contract Sync

# Branch-agnostic route-contract gate.
#
# `drift-detection.yml` already runs the same authoritative gate, but only for
# pushes/PRs **to main** and only when its path filter matches. This workflow
# exists to run it on *every* branch that touches the route surface, and to add
# three things that gate does not do: doc linting, artifact upload for downstream
# consumers, and the SDK notification dispatch.
#
# The extract → manifest → reconcile → doc → drift → SDK-coverage sequence is NOT
# re-implemented here on purpose. An earlier revision inlined it and got three
# steps wrong: it invoked `check_route_contract.py` (the gate is `.sh`; no such
# file exists), passed `gen_derived_routes.py --manifest-only` (the flag does not
# exist — the script only takes `--check`), and diffed the regenerated doc with a
# bare `git diff --exit-code`, which can never pass because the generated header
# carries a `自动生成于 <date>` line that changes daily. Delegating to
# `scripts/contract/check_route_contract.sh` keeps a single implementation of the
# comparison, including its timestamp normalisation.

on:
  push:
    paths:
      - 'synapse-web/src/routes/**'
      - 'scripts/contract/**'
      - 'scripts/ci/check_axum_path_syntax.py'
      - 'tests/unit/fixtures/**'
      - 'docs/synapse-rust/ROUTE_CONTRACT.md'
      - 'Cargo.toml'
      - '.github/workflows/route-contract.yml'
  pull_request:
    paths:
      - 'synapse-web/src/routes/**'
      - 'scripts/contract/**'
      - 'scripts/ci/check_axum_path_syntax.py'
      - 'tests/unit/fixtures/**'
      - 'docs/synapse-rust/ROUTE_CONTRACT.md'
      - 'Cargo.toml'
      - '.github/workflows/route-contract.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  route-contract:
    name: Route Contract Sync
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # `check_route_contract.sh` compares the regenerated doc against
          # `HEAD:<path>` via `git show`. A shallow checkout cannot resolve that,
          # so the drift gate would compare against an empty string and report a
          # spurious failure.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          # `gen_derived_routes.py` normalises the emitted tables through rustfmt
          # and fails loudly when rustfmt is unavailable, because a silent
          # fallback would emit unformatted source that the fmt ratchet then
          # reports as debt with no code change to explain it.
          components: rustfmt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node (for markdownlint)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ──────────────────────────────────────────────────────────────────────
      # Route contract gate — one step, because this is one gate.
      #
      # `check_route_contract.sh` runs, in order:
      #   1. guard tests for `extract_registered.py`, including a mutation pass
      #      that reinstates the historical S-13 defects and requires the suite to
      #      go red (a guard that cannot fail is not a guard);
      #   2. the axum path-syntax check (a `:param` / `*wildcard` literal panics
      #      `create_router` at startup, and neither `cargo check` nor the
      #      extractor notices);
      #   3. the strict extraction of the real served surface
      #      (`EXTRACT_STRICT=1`), which reconciles the router-derived tuples
      #      against the manifest oracle, the committed `ledger_export` fixtures,
      #      and the bidirectional unresolved-construct ratchet;
      #   4. regeneration of `docs/synapse-rust/ROUTE_CONTRACT.md`;
      #   5. the `gen_derived_routes.py --check` drift gate on the route table;
      #   6. the SDK ⊆ ledger coverage check;
      #   7. the structural drift gate on the regenerated doc, with the volatile
      #      generation date normalised away.
      # ──────────────────────────────────────────────────────────────────────
      - name: Route contract gate (extract / manifest / reconcile / doc / drift / SDK coverage)
        run: bash scripts/contract/check_route_contract.sh

      - name: Install markdownlint
        run: |
          # Pin the version: rule behaviour is version-dependent, so an unpinned
          # `latest` silently redefines what "passing" means. Kept in step with
          # `docs-quality-gate.yml`.
          npm i -g markdownlint-cli@0.49.1

      - name: markdownlint - ROUTE_CONTRACT.md
        run: markdownlint -c .markdownlint.json docs/synapse-rust/ROUTE_CONTRACT.md

      - name: Install aspell
        run: |
          sudo apt-get update
          sudo apt-get install -y aspell aspell-en

      - name: aspell - ROUTE_CONTRACT.md
        run: bash scripts/check_doc_spelling.sh docs/synapse-rust/ROUTE_CONTRACT.md

      - name: Upload route artifacts
        uses: actions/upload-artifact@v4
        with:
          name: route-contract-${{ github.sha }}
          path: |
            artifacts/registered_routes.json
            artifacts/manifest_routes.json
          # The extractor writes both files; a missing one means the extraction
          # silently produced nothing, which must not read as a green build that
          # simply has no artifacts.
          if-no-files-found: error
          retention-days: 7

      # Best-effort downstream dispatch, but not a no-op: the script exits 0 with
      # a notice when `MATRIX_JS_SDK_DISPATCH_TOKEN` is simply not configured, and
      # exits 1 only after three failed delivery attempts. That failure is left
      # visible on purpose — an SDK that silently stops hearing about route
      # changes drifts with nobody noticing.
      - name: Notify SDK repo
        if: github.ref == 'refs/heads/main'
        env:
          DISPATCH_TOKEN: ${{ secrets.MATRIX_JS_SDK_DISPATCH_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import ssl
          import sys
          import time
          import urllib.error
          import urllib.request

          dispatch_token = os.environ.get("DISPATCH_TOKEN", "")
          if not dispatch_token:
              print("MATRIX_JS_SDK_DISPATCH_TOKEN is not configured; skipping downstream notification")
              sys.exit(0)

          repository = os.environ.get("SDK_REPOSITORY", "langkebo/matrix-js-sdk")
          payload = {
              "event_type": "route-contract-update",
              "client_payload": {
                  "source_repository": os.environ["GITHUB_REPOSITORY"],
                  "source_sha": os.environ["GITHUB_SHA"],
                  "source_ref": os.environ["GITHUB_REF_NAME"],
                  "workflow_run_id": os.environ["GITHUB_RUN_ID"],
                  "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              },
          }

          url = f"https://api.github.com/repos/{repository}/dispatches"
          body = json.dumps(payload).encode("utf-8")
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {dispatch_token}",
              "Content-Type": "application/json",
              "User-Agent": "synapse-rust-route-contract",
          }

          for attempt, delay in enumerate([0, 2, 4], start=1):
              if delay:
                  time.sleep(delay)
              request = urllib.request.Request(url, data=body, headers=headers, method="POST")
              try:
                  with urllib.request.urlopen(request, context=ssl.create_default_context()) as response:
                      status = response.getcode()
                      if 200 <= status < 300:
                          print(f"Notification delivered on attempt {attempt} (status {status})")
                          sys.exit(0)
              except urllib.error.HTTPError as error:
                  print(f"Attempt {attempt} failed with HTTP {error.code}", file=sys.stderr)
              except Exception as error:
                  print(f"Attempt {attempt} failed: {error}", file=sys.stderr)

          print("Notification failed after retries", file=sys.stderr)
          sys.exit(1)
          PY
