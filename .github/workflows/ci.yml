name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synapse_test
  TEST_REDIS_URL: redis://localhost:6379

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      non-docs: ${{ steps.filter.outputs.non-docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            non-docs:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  # ──────────────────────────────────────────────
  # Fast Tier — runs on every PR and push (~5 min)
  # ──────────────────────────────────────────────

  repo-sanity:
    name: Repo Sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: No private keys (key files)
        run: |
          # Scan key/cert file extensions for private key markers.
          # *.pem is NOT included — docker/ssl/fullchain.pem is a public cert chain.
          # Private .pem files must be gitignored.
          # Uses `if` instead of `!` prefix because POSIX spec says `! pipeline`
          # disables set -e for that pipeline, so intermediate checks get skipped.
          if grep -R "BEGIN.*PRIVATE KEY" . --include="*.key" --include="*.p12" --include="*.pfx" --include="*.jks" 2>/dev/null; then
            echo "FAIL: private key marker found in key/cert file"
            exit 1
          fi

      - name: No private keys in source
        run: |
          # Catch hardcoded private keys in source/config files (git tracked only).
          # Searches for PEM headers with dashes to match real key content only.
          # Excludes:
          #   - TEST_*_PRIVATE_KEY (test fixtures under #[cfg(test)])
          #   - .github/workflows/ci.yml (this file — contains the search patterns)
          # SECURITY: this gate was bypassed on 2026-05-09 (commit cc5c295c) when
          # a real Ed25519 key was committed to docker/deploy/synapse-data/.
          # Branch protection must enforce this job as a required status check.
          MATCHES=$(git grep -In \
            -e "-----BEGIN PRIVATE KEY-----" \
            -e "-----BEGIN RSA PRIVATE KEY-----" \
            -e "-----BEGIN EC PRIVATE KEY-----" \
            -e "-----BEGIN OPENSSH PRIVATE KEY-----" \
            -- '*.rs' '*.json' '*.yml' '*.yaml' '*.toml' '*.sh' \
            | grep -v "TEST_.*PRIVATE_KEY" \
            | grep -v "^\.github/workflows/ci\.yml:" || true)
          if [ -n "$MATCHES" ]; then
            echo "FAIL: hardcoded private key found in source:"
            echo "$MATCHES"
            exit 1
          fi

      - name: No key files tracked
        run: |
          # *.pem excluded — docker/ssl/fullchain.pem is a public cert chain.
          # If you must track a private .pem, add an exception in .gitignore
          # and have it reviewed by a maintainer.
          TRACKED=$(git ls-files '*.key' '*.p12' '*.pfx' '*.jks' || true)
          if [ -n "$TRACKED" ]; then
            echo "FAIL: tracked key files found:"
            echo "$TRACKED"
            exit 1
          fi

      - name: No root artifacts
        run: |
          ! ls axum_test.rs 2>/dev/null
          ! ls *.db 2>/dev/null

      - name: Schema table coverage
        run: python3 scripts/check_schema_table_coverage.py

      - name: Schema contract coverage (static)
        run: |
          mkdir -p artifacts
          python3 scripts/check_schema_contract_coverage.py \
            --threshold 90 \
            --report artifacts/contract_coverage_report.md

      - name: Migration consistency
        run: |
          mkdir -p artifacts
          python3 scripts/check_migration_consistency.py \
            --json-report artifacts/migration_consistency.json

      # 配置双副本一致性：docker/config/ 与 docker/deploy/config/ 靠手工 cp 同步，
      # 无检查时曾漂移出 /sync 零限流（见 docs/audit/S_series_verification_2026-09-11.md §2）。
      # 与迁移双副本（2b16dc3c 已根治）同型问题 —— 本步骤是它的配置侧对等物。
      # 语义比较，注释差异不报；有意的开发/生产差异登记在脚本的 ALLOWED_DIFFERENCES。
      - name: Config consistency (dev vs deploy trees)
        run: |
          mkdir -p artifacts
          python3 scripts/check_config_consistency.py \
            --json-report artifacts/config_consistency.json

      - name: Route ↔ storage boundary gate
        run: bash scripts/ci/check_route_storage_boundary.sh

      # SQLx 棘轮：动态查询不得增加、编译期校验（query!/query_as!）不得减少。
      # 基线见 scripts/ci/sqlx_dynamic_ratio_baseline。
      # 历史：本脚本此前只扫 src/（漏掉 synapse-storage 等 crate 的 97% 调用）、
      # 硬编码不可达的 max=0.30、引用不存在的计划文档，且从未接入 CI —— 故从未生效。
      - name: SQLx dynamic/static ratio ratchet
        run: bash scripts/ci/check_sqlx_dynamic_ratio.sh

      # Supply-chain hardening: cargo-deny (licenses/bans/sources) and
      # cargo-audit (RustSec CVE database). Both must pass for the PR
      # to merge. The ignore list lives in deny.toml and .cargo/audit.toml.
      - name: Supply-chain gate (cargo-deny + cargo-audit)
        run: bash scripts/ci/supply_chain_gate.sh

  test:
    name: Test & Lint (${{ matrix.rust-toolchain }}, ${{ matrix.features-label }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        rust-toolchain: [stable, 1.93.0]
        features-args: ["", "--all-features"]
        include:
          - features-args: ""
            features-label: default-features
          - features-args: "--all-features"
            features-label: all-features

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain (${{ matrix.rust-toolchain }})
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust-toolchain }}
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust-toolchain }}-${{ matrix.features-label }}

      - name: Pre-cache swagger-ui zip (avoid GitHub 403 rate-limiting)
        if: matrix.features-args == '--all-features'
        run: bash scripts/precache-swagger-ui.sh

      # ── W7+: fmt debt 棘轮（ratchet）────────────────────────────
      # 原 step 是 `cargo fmt --all -- --check`（全有或全无）。仓库里累积的
      # 31 处 rustfmt 不合规（friend_room_service / sliding_sync_service 等
      # 12 个文件）让它长期是红的 —— 长期红的 CI 会被忽视，新引入的格式
      # 问题淹没在既有噪声里，比不检查更糟。
      #
      # 改成棘轮：只比对数量，不许增、也不许「悄悄减」。
      #   current > baseline -> 失败（引入新问题）
      #   current < baseline -> 失败（debt 减少了，必须收紧棘轮）
      #   current == baseline -> 通过
      # 详见 scripts/check_fmt_ratchet.sh 头注释（含更新 baseline 的命令）。
      - name: Check formatting (ratchet)
        if: matrix.rust-toolchain == 'stable' && matrix.features-args == ''
        run: ./scripts/check_fmt_ratchet.sh

      - name: Run clippy
        run: cargo clippy ${{ matrix.features-args }} --locked -- -D warnings

      - name: Install sqlx-cli
        if: matrix.features-args == '--all-features'
        # Pin to 0.8.x: matches the project's sqlx 0.8 and stays within MSRV.
        # sqlx-cli 0.9+ requires rustc >= 1.94, which the CI toolchain lacks.
        run: cargo install sqlx-cli --version '^0.8' --locked --no-default-features --features postgres

      - name: Install cargo-nextest
        if: matrix.features-args == '--all-features'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Build forward-only sqlx migration source
        if: matrix.features-args == '--all-features'
        run: python3 scripts/build_sqlx_migration_source.py artifacts/sqlx-migrations

      - name: Set up test database
        if: matrix.features-args == '--all-features'
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
        run: |
          sqlx database create
          sqlx migrate run --source artifacts/sqlx-migrations
          # P2 fail-fast: 关键表缺失直接报错，避免下游 11 个 burn_after_read::db_tests 全部 42P01
          missing=0
          for table in burn_after_read_pending burn_after_read_settings burn_after_read_log burn_after_read_user_defaults; do
            if ! psql -d synapse -tAc "SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='$table'" | grep -q 1; then
              echo "::error::Required table missing after migration: $table (schema drift — v11 baseline not applied)"
              missing=$((missing+1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing critical table(s) missing — refusing to run tests to avoid cascading 42P01 failures"
            exit 1
          fi

      # P5-fix: this gate used to be `cargo test --doc --locked`, which only
      # compiles the ROOT package. The root package has zero doc tests, so the
      # step reported `running 0 tests` and passed unconditionally — it verified
      # nothing, and a real rustdoc-only compile error shipped green through it:
      #   error[E0106]: missing lifetime specifiers
      #   --> src/federation/edu.rs  fn validate_profile_update_content(...) -> Option<(&str, ...)>
      # `cargo build`/`check`/`clippy` never flagged it (the returned lifetimes were
      # unconstrained); only rustdoc compiles doc examples and caught it.
      #
      # `--workspace` compiles every crate's documentation, which is what makes this
      # gate able to catch that class of error.
      #
      # Known limitation (do not mistake this gate for doc-test coverage): the whole
      # workspace currently contains only 4 doc tests and ALL of them are `#[ignore]`d,
      # so no doc example is actually executed. This step is a rustdoc COMPILE gate,
      # not execution coverage. Treat `cargo doc`'s ~3.5k unresolved-intra-doc-link
      # warnings as separate, pre-existing debt.
      - name: Run doc tests (workspace — rustdoc compile gate)
        if: matrix.features-args == '--all-features'
        run: cargo test --doc --locked --workspace

      # ── 测试作用域：必须 --workspace ──────────────────────────────────────
      # 此前这里是裸 `--lib`，**没有 --workspace**，因此只测根包（687 个），
      # synapse-common / synapse-storage / synapse-services / synapse-e2ee 等
      # crate 的 lib 测试（合计 6118+ 个）在 CI 中从未编译、从未运行 ——
      # 而这几个 crate 正是业务逻辑与持久化所在层。守卫
      # `tests/unit/ci_test_scope_tests.rs` 锁住这一点。
      #
      # `-E 'not test(/^media::tests::/)'`：仅排除 synapse-services 的
      # `media::tests`（13 个）。该套件存在**进程内串扰**，在 --test-threads 1
      # 下仍随机失败（实测同一命令连跑 4 次：0 / 1 / 3 / 3 个失败，且失败集每次
      # 不同）。把它挡在 blocking 门禁外，另设非阻塞步骤持续暴露（见下一步）。
      # 正则用 `^media::tests::` 锚定，避免误伤 synapse-storage 的
      # `media::s3` / `media::filesystem` 等 83 个健康测试。
      - name: Run library unit tests (--workspace --lib)
        if: matrix.features-args == '--all-features'
        env:
          SYNAPSE_TEST_ALLOW_PUBLIC_SCHEMA_WIPE: "1"
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          REDIS_URL: redis://localhost:6379
          RUST_BACKTRACE: 1
          RUST_LOG: info
          NEXTEST_RETRIES: 2
        run: cargo nextest run --workspace --lib --all-features --locked --test-threads 8 -E 'not test(/^media::tests::/)'

      # ── 已知抖动套件：豁免的"自动收回"守卫 ────────────────────────────────
      # synapse-services 的 `media::tests` 13 个用例存在进程内串扰：实测连跑 4 次
      # 得到 0 / 1 / 3 / 3 个失败且失败集漂移，单跑某用例又通过。根治前不能让
      # 它们阻塞主门禁（否则 CI 随机红）。
      #
      # 但**临时豁免最容易变成永久豁免**——一旦串扰被修好，上面的排除式和这一步
      # 往往没人回头删，等于永久缩小覆盖。所以这里不直接跑套件，而是跑
      # `scripts/ci/check_media_exemption_still_needed.sh`：
      #
      #   * 套件连跑 N 次（默认 3）中有**任何一次失败** → 豁免仍必要 → exit 0，绿
      #   * **每一次都通过** → 豁免已无必要 → **exit 1**，要求移除排除式与本步骤
      #
      # 即：这一步是"确定性的"，而不是"把随机失败吞掉"。它绿的时候含义是
      # "豁免仍有依据"，红的时候含义是"该收回了"。**因此不加
      # `continue-on-error`** —— 红必须看得见。
      - name: Check media exemption is still necessary (self-cleaning guard)
        if: matrix.features-args == '--all-features'
        env:
          SYNAPSE_TEST_ALLOW_PUBLIC_SCHEMA_WIPE: "1"
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          REDIS_URL: redis://localhost:6379
          RUST_BACKTRACE: 1
          RUST_LOG: info
        run: bash scripts/ci/check_media_exemption_still_needed.sh

      - name: Run unit test target (--test unit)
        if: matrix.features-args == '--all-features'
        env:
          SYNAPSE_TEST_ALLOW_PUBLIC_SCHEMA_WIPE: "1"
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          REDIS_URL: redis://localhost:6379
          RUST_BACKTRACE: 1
          RUST_LOG: info
          NEXTEST_RETRIES: 2
        run: cargo nextest run --test unit --features test-utils --locked --test-threads 8

      # ── W7+: Test 范围 clippy 锁住（防 test clippy debt 回退） ──
      # 之前的 `Run clippy` step 只检 lib 范围，test 范围（#[cfg(test)] 块）
      # 的 lint 完全没被 CI 覆盖。W7 修了 5 个 pre-existing test clippy debt
      # 后，本 step 锁住 "test 范围 clippy 0 error" 状态。
      #
      # 跑法：与 lib clippy 一样的 -D warnings，但加 --tests。
      # 限制：只检 synapse-services（包含 friend_room_service 等 feature-gated mod
      # 的最大 crate），避免整个 workspace test 编译时间爆炸。
      # 矩阵：仅 --all-features（friends / test-utils 等 feature 必须开才能看到
      # 它们的 test 代码）。
      - name: Run clippy (tests, synapse-services, all-features)
        if: matrix.features-args == '--all-features'
        run: cargo clippy -p synapse-services --all-features --tests --locked -- -D warnings

      # ── B3: missing_docs 棘轮 ──
      # 7 个 crate 都开了 crate 级 `#![allow(missing_docs)]`，存量几百个 warning
      # 不能直接打开。ratchet 只卡增量：新增 pub 项必须带 `///` doc，debt
      # 数字通过 scripts/.missing-docs-baseline 锁住。详见脚本头注释。
      - name: Check missing_docs ratchet
        run: ./scripts/check_missing_docs_ratchet.sh
        env:
          SQLX_OFFLINE: "true"

      # Upload test logs on failure. The default GH-Actions log storage has a
      # narrow retention window (often cleaned up by the time maintainers look
      # at the failed run). Persisting via artifacts keeps logs available for
      # 7 days. Path-agnostic because nextest writes to target/nextest/default*.
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.rust-toolchain }}-${{ matrix.features-label }}-${{ github.run_id }}
          path: |
            target/nextest/default-*/
            target/test-results.xml
          retention-days: 7
          if-no-files-found: ignore

  # ──────────────────────────────────────────────
  # PR Benchmark Gate — runs on every PR (~30-60s)
  # Pure-Rust benchmarks only (federation + membership)
  # ──────────────────────────────────────────────
  pr-benchmark-gate:
    name: PR Benchmark Gate
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.non-docs == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: pr-benchmark-gate

      - name: Download baseline benchmark results
        uses: dawidd6/action-download-artifact@v3
        # ⚠️ 不得设 continue-on-error: true。
        # 历史上这里容忍下载失败，而脚本在缺基线时打印 "PASSED (baseline
        # comparison skipped)" —— 二者叠加使「基线没下到」永久伪装成「没有回归」。
        # 现在缺基线会让门禁明确失败（首次在 main 上跑完后即有基线）。
        with:
          workflow: benchmark.yml
          name: benchmark-results
          path: baseline
          # 基线必须是 Criterion **文本**格式。benchmark.txt 是
          # --output-format bencher 的产物，本门禁的解析器读不了。
          check_artifacts: true
          search_artifacts: true

      - name: Locate baseline (Criterion text format)
        id: baseline
        run: |
          set -euo pipefail
          # benchmark.yml 上传的 artifact 同时含 benchmark.txt（bencher 格式）
          # 与 benchmark_standard.txt（Criterion 文本格式，覆盖 federation +
          # membership，与本门禁运行的基准一致）。
          if [ -f baseline/benchmark_standard.txt ]; then
            echo "path=baseline/benchmark_standard.txt" >> "$GITHUB_OUTPUT"
            echo "Using baseline/benchmark_standard.txt"
          else
            echo "::error::未找到 Criterion 文本格式基线 baseline/benchmark_standard.txt。"
            echo "::error::benchmark.txt 使用 --output-format bencher，与本门禁解析器不兼容。"
            echo "::error::请先在 main 上跑一次 benchmark.yml 以生成基线。"
            exit 1
          fi

      - name: Run PR benchmark gate
        run: bash scripts/ci/benchmark_pr_gate.sh
        env:
          BENCH_THRESHOLD_PERCENT: 15
          BENCH_BASELINE_PATH: ${{ steps.baseline.outputs.path }}
          # 必须与录制基线时使用的 profile 一致（benchmark.yml 用 release-perf）。
          BENCH_PROFILE: release-perf

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-benchmark-results-${{ github.run_id }}
          path: artifacts/pr_benchmark_results.json
          retention-days: 7

  # ──────────────────────────────────────────────────────────
  # Slow Tier — runs on merge to main/develop + weekly schedule
  # Skipped when only docs (*.md, docs/) changed
  # ──────────────────────────────────────────────────────────

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: >-
      github.event_name == 'schedule' ||
      (needs.changes.outputs.non-docs == 'true' &&
       github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        # Pin to 0.8.x: matches the project's sqlx 0.8 and stays within MSRV.
        # sqlx-cli 0.9+ requires rustc >= 1.94, which the CI toolchain lacks.
        run: cargo install sqlx-cli --version '^0.8' --locked --no-default-features --features postgres

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install cargo-insta
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-insta

      - name: Pre-cache swagger-ui zip
        run: bash scripts/precache-swagger-ui.sh

      - name: Build forward-only sqlx migration source
        run: python3 scripts/build_sqlx_migration_source.py artifacts/sqlx-migrations

      - name: Set up test database
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
        run: |
          sqlx database create
          sqlx migrate run --source artifacts/sqlx-migrations
          # P2 fail-fast: same guard as Test & Lint job — refuse to start tests
          # if critical tables are missing after migration.
          missing=0
          for table in burn_after_read_pending burn_after_read_settings burn_after_read_log burn_after_read_user_defaults; do
            if ! psql -d synapse -tAc "SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='$table'" | grep -q 1; then
              echo "::error::Required table missing after migration: $table"
              missing=$((missing+1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing critical table(s) missing — aborting"
            exit 1
          fi

      # P6 fix: run admin registration integration tests serially to avoid deadlock.
      # Multiple tests sharing the same nonce key + concurrent writes to users table
      # cause PostgreSQL deadlock at --test-threads > 1.
      - name: Run integration tests (serial — admin registration)
        env:
          SYNAPSE_TEST_ALLOW_PUBLIC_SCHEMA_WIPE: "1"
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          REDIS_URL: redis://localhost:6379
          RUST_BACKTRACE: 1
          RUST_LOG: info
          NEXTEST_RETRIES: 2
        run: cargo nextest run --test integration 'admin_registration_service_tests_migrated' --all-features --locked --test-threads 1

      - name: Run integration tests (--test integration)
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          REDIS_URL: redis://localhost:6379
          RUST_BACKTRACE: 1
          RUST_LOG: info
          NEXTEST_RETRIES: 2
        run: cargo nextest run --test integration --all-features --locked --test-threads 6

      # e2e 目标此前**没有任何 workflow 调用**（`grep -rn "test e2e" .github/workflows/` 无命中），
      # 而 CLAUDE.md 把它记为可用命令 —— 未被执行的测试会静默腐坏。
      #
      # 注意其内容：`e2e_scenarios.rs` 是**纯模拟**（零 I/O，断言对象是局部字面量），
      # 已改名为 `simulated_*` 并就地说明；`user_flow_tests.rs` 是真 HTTP 但全部
      # `#[ignore]`（需 E2E_RUN=1 + 运行中的 homeserver）。
      # 因此本步骤实际执行的是"模拟步骤大纲"，其价值在于**防止编译/链接腐坏**，
      # 而不是验证端到端行为 —— 后者由上面的 integration 步骤承担。
      - name: Run e2e target (simulated scenarios compile + run)
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          REDIS_URL: redis://localhost:6379
          RUST_BACKTRACE: 1
        run: cargo nextest run --test e2e --all-features --locked --test-threads 4

      # Snapshot gate: fail if any insta snapshot drifted or is missing.
      # Local devs must run `cargo insta test --review` to accept new snapshots
      # before pushing; CI runs in non-interactive --no-review mode and fails
      # on any pending .snap.new files.
      - name: Snapshot gate (cargo insta test --no-review)
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          REDIS_URL: redis://localhost:6379
          RUST_BACKTRACE: 1
          NEXTEST_RETRIES: 2
        run: cargo insta test --no-review --test-runner nextest -- --all-features --locked --test-threads 8

      - name: Run performance smoke gate
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          REDIS_URL: redis://localhost:6379
          RUN_PERF_SMOKE: 1
          PERF_SMOKE_LOG: artifacts/perf_smoke.log
        run: |
          mkdir -p artifacts
          cargo test --test performance_manual --features performance-tests --locked -- --ignored --nocapture 2>&1 | tee artifacts/perf_smoke.log

      - name: Upload performance smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-smoke-log
          path: artifacts/perf_smoke.log
          retention-days: 14

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: >-
      github.event_name == 'schedule' ||
      (needs.changes.outputs.non-docs == 'true' &&
       (github.event_name == 'pull_request' ||
        (github.event_name == 'push' &&
         (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Run the unified supply-chain gate. This is the same script that
      # `repo-sanity` invokes for fast PR feedback, but here we also
      # assert that no `rand::rng()` calls leaked into the tree (the
      # RUSTSEC-2026-0097 watch-out).
      - name: Supply-chain gate (cargo-deny + cargo-audit)
        run: bash scripts/ci/supply_chain_gate.sh

      - name: Assert rand::rng() is unused
        run: |
          if git grep -n "rand::rng()" -- '*.rs'; then
            echo "rand::rng() is temporarily banned until RUSTSEC-2026-0097 is resolved"
            exit 1
          fi

      # ── cargo-geiger: unsafe usage scan ──
      # Uses JSON output + baseline ratchet via scripts/ci/run_cargo_geiger.py.
      # Production unsafe must be zero (hard block); test unsafe is tracked
      # against a baseline (ratchet: only fails if count increases).
      - name: Install cargo-geiger
        run: cargo install cargo-geiger --locked

      - name: Run cargo-geiger (unsafe usage scan)
        run: python3 scripts/ci/run_cargo_geiger.py

      - name: Upload cargo-geiger report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-geiger-report
          path: artifacts/cargo-geiger.json
          retention-days: 14

      # m-2: Track outdated dependencies for security-relevant crates.
      # Non-blocking: only warns, does not fail the pipeline.
      # Focus on crypto crates that may need patch-level bumps.
      - name: Check outdated dependencies (cargo-outdated)
        continue-on-error: true
        run: |
          cargo install cargo-outdated --locked
          echo "=== Outdated dependencies (focus: crypto) ==="
          cargo outdated --root-deps-only 2>&1 | tee artifacts/outdated-deps.txt
          echo ""
          echo "=== Security-relevant crate status ==="
          cargo outdated 2>&1 | grep -E '(x25519-dalek|ed25519-dalek|curve25519-dalek|aes-gcm|chacha20poly1305|ring|openssl|rustls)' || echo "No updates available for tracked security crates."

      - name: Upload outdated-deps report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outdated-deps-report
          path: artifacts/outdated-deps.txt
          retention-days: 14

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: >-
      github.event_name == 'schedule' ||
      (needs.changes.outputs.non-docs == 'true' &&
       github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    strategy:
      matrix:
        profile:
          - name: core-matrix-min
            features: server
          - name: core-private-chat
            features: server,friends,burn-after-read
          - name: all-extensions
            features: server,all-extensions
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.profile.name }}

      - name: Build ${{ matrix.profile.name }}
        run: cargo build --release --no-default-features --features ${{ matrix.profile.features }} --locked

      - name: Build wasm (if applicable)
        if: matrix.profile.name == 'all-extensions'
        run: cargo build --release --workspace --exclude synapse_worker --locked || true

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [integration-test, changes]
    if: >-
      github.event_name == 'schedule' ||
      (needs.changes.outputs.non-docs == 'true' &&
       github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse
        ports:
          - 5432:5432

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: llvm-tools-preview

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Install sqlx-cli
        # Pin to 0.8.x: matches the project's sqlx 0.8 and stays within MSRV.
        # sqlx-cli 0.9+ requires rustc >= 1.94, which the CI toolchain lacks.
        run: cargo install sqlx-cli --version '^0.8' --locked --no-default-features --features postgres

      - name: Build forward-only sqlx migration source
        run: python3 scripts/build_sqlx_migration_source.py artifacts/sqlx-migrations

      - name: Set up test database
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
        run: |
          sqlx database create
          sqlx migrate run --source artifacts/sqlx-migrations

      - name: Run coverage
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          REDIS_URL: redis://localhost:6379
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          # llvm-cov two-step (mirrors scripts/run_local_coverage.sh; tarpaulin is
          # dropped because 0.35.2 has a broken --implicit-test-threads and drops
          # coverage data when any test exits non-zero):
          #   step 1: synapse-storage alone, single-threaded — its db_tests connect
          #           straight to the public schema and race under concurrency.
          #   step 2: everything else (--exclude synapse-storage) with the feature
          #           set that route_ledger snapshots were generated against.
          #   step 3: merge the two lcov files.
          mkdir -p coverage
          COV_FEATURES="test-utils,privacy-ext,voice-extended,voip-tracking,beacons,server-notifications,cas-sso,saml-sso"
          RUST_TEST_THREADS=1 cargo llvm-cov -p synapse-storage \
            --features "$COV_FEATURES" --lib \
            --lcov --output-path /tmp/storage.lcov
          cargo llvm-cov --workspace --exclude synapse-storage \
            --features "$COV_FEATURES" \
            --lcov --output-path /tmp/rest.lcov \
            -- --skip ledger_export_tests
          python3 scripts/merge_lcov.py /tmp/storage.lcov /tmp/rest.lcov -o coverage/lcov.info

      - name: Per-file coverage ratchet (B.3)
        # Enforces: TDD-mandated files ≥80%, core 13 paths ≥70%,
        # new files ≥30% (ramp-up grace), touched files must not regress,
        # global floor ≥40%.
        # Baseline at artifacts/coverage_baseline.json is auto-saved on first run
        # and auto-committed by the next step on main/develop pushes.
        run: |
          mkdir -p artifacts
          python3 scripts/check_file_coverage.py \
            --report coverage/lcov.info \
            --format lcov \
            --baseline artifacts/coverage_baseline.json \
            --threshold 80 \
            --global-floor 40 \
            --new-file-floor 30 \
            --core-files artifacts/core_file_list.txt \
            --core-threshold 70

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Commit coverage baseline (auto-ratchet)
        # Only on main/develop push; skip on PRs, schedules, and dispatches.
        # The baseline file is the only artifact this step touches.
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/coverage_baseline.json
          if git diff --cached --quiet; then
            echo "No baseline change; skipping commit."
          else
            git commit -m "chore(coverage): auto-update per-file baseline [skip ci]"
            git push
          fi

  # ──────────────────────────────────────────────────────────
  # k6 Smoke Test — manual/dispatch only
  # Requires a running Synapse server; start one via Docker or
  # point BASE_URL to an existing instance before triggering.
  # ──────────────────────────────────────────────────────────

  k6-smoke-test:
    name: k6 Smoke Test
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup k6
        run: |
          curl https://github.com/grafana/k6/releases/download/v0.47.0/k6-v0.47.0-linux-amd64.tar.gz -L | tar xvz
          sudo mv k6-*/k6 /usr/local/bin/

      - name: Run smoke test
        run: bash scripts/test/perf/run_tests.sh smoke
        env:
          BASE_URL: ${{ secrets.K6_SMOKE_BASE_URL || 'http://localhost:8448' }}
          RESULTS_DIR: artifacts/k6-smoke

      - name: Evaluate guardrails
        run: python3 scripts/test/perf/guardrail.py --results-dir artifacts/k6-smoke --scenario smoke --fail-on-breach

      - name: Upload k6 smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-results
          path: artifacts/k6-smoke
          retention-days: 14

  # ──────────────────────────────────────────────────────────────
  # CI Summary — compact failure digest for maintainers
  # Skips on success (no noise). On failure, prints only failed
  # jobs + one representative error line so the PR author can triage
  # without scrolling through 4 parallel matrix logs.
  # ──────────────────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    # Run even if all upstream jobs were skipped (cancelled/no-op)
    if: always()
    needs: [changes, test, integration-test, security-audit, build, pr-benchmark-gate]
    steps:
      - name: Print compact failure digest
        uses: actions/github-script@v7
        with:
          script: |
            // Fetch the current workflow run (works for push, PR, and dispatch events)
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

            const { data: jobsData } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });

            // Keep the latest conclusion per job name (matrix children share names)
            const jobConclusions = {};
            for (const job of jobsData.jobs ?? []) {
              if (job.status === 'completed') {
                jobConclusions[job.name] = job.conclusion;
              }
            }

            const failed = Object.entries(jobConclusions)
              .filter(([, c]) => c === 'failure' || c === 'cancelled')
              .map(([name]) => name);

            if (failed.length === 0) {
              console.log('No failed jobs detected — nothing to summarise.');
              core.summary.addRaw('<h2>CI Result: ALL GREEN</h2>');
              core.summary.write();
              return;
            }

            const html = `
              <h2>CI Result: FAILED</h2>
              <p>Compact digest of failed jobs (${failed.length} of ${Object.keys(jobConclusions).length} ran to completion). Navigate to each job link for detailed output.</p>
              <ul>
                ${failed.map(name => {
                  const job = jobsData.jobs.find(j => j.name === name);
                  const link = job?.html_url ?? '#';
                  return `<li><a href="${link}"><b>${name}</b></a></li>`;
                }).join('\n')}
              </ul>
              <p><i>Workflow run: <a href="${run.html_url}">${run.display_title}</a> on ${run.head_branch ?? 'unknown'}</i></p>
            `;

            core.summary.addRaw(html);
            core.summary.write();
            console.log('Failed jobs:', failed.join(', '));
