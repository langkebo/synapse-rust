name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse_test
  TEST_REDIS_URL: redis://localhost:6379

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      non-docs: ${{ steps.filter.outputs.non-docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            non-docs:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  # ──────────────────────────────────────────────
  # Fast Tier — runs on every PR and push (~5 min)
  # ──────────────────────────────────────────────

  repo-sanity:
    name: Repo Sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: No private keys (key files)
        run: |
          # Scan key/cert file extensions for private key markers.
          # *.pem is NOT included — docker/ssl/fullchain.pem is a public cert chain.
          # Private .pem files must be gitignored.
          # Uses `if` instead of `!` prefix because POSIX spec says `! pipeline`
          # disables set -e for that pipeline, so intermediate checks get skipped.
          if grep -R "BEGIN.*PRIVATE KEY" . --include="*.key" --include="*.p12" --include="*.pfx" --include="*.jks" 2>/dev/null; then
            echo "FAIL: private key marker found in key/cert file"
            exit 1
          fi

      - name: No private keys in source
        run: |
          # Catch hardcoded private keys in source/config files (git tracked only).
          # Searches for PEM headers with dashes to match real key content only.
          # Excludes:
          #   - TEST_*_PRIVATE_KEY (test fixtures under #[cfg(test)])
          #   - .github/workflows/ci.yml (this file — contains the search patterns)
          # SECURITY: this gate was bypassed on 2026-05-09 (commit cc5c295c) when
          # a real Ed25519 key was committed to docker/deploy/synapse-data/.
          # Branch protection must enforce this job as a required status check.
          MATCHES=$(git grep -In \
            -e "-----BEGIN PRIVATE KEY-----" \
            -e "-----BEGIN RSA PRIVATE KEY-----" \
            -e "-----BEGIN EC PRIVATE KEY-----" \
            -e "-----BEGIN OPENSSH PRIVATE KEY-----" \
            -- '*.rs' '*.json' '*.yml' '*.yaml' '*.toml' '*.sh' \
            | grep -v "TEST_.*PRIVATE_KEY" \
            | grep -v "^\.github/workflows/ci\.yml:" || true)
          if [ -n "$MATCHES" ]; then
            echo "FAIL: hardcoded private key found in source:"
            echo "$MATCHES"
            exit 1
          fi

      - name: No key files tracked
        run: |
          # *.pem excluded — docker/ssl/fullchain.pem is a public cert chain.
          # If you must track a private .pem, add an exception in .gitignore
          # and have it reviewed by a maintainer.
          TRACKED=$(git ls-files '*.key' '*.p12' '*.pfx' '*.jks' || true)
          if [ -n "$TRACKED" ]; then
            echo "FAIL: tracked key files found:"
            echo "$TRACKED"
            exit 1
          fi

      - name: No root artifacts
        run: |
          ! ls axum_test.rs 2>/dev/null
          ! ls *.db 2>/dev/null

      - name: Schema table coverage
        run: python3 scripts/check_schema_table_coverage.py

      - name: Schema contract coverage (static)
        run: |
          mkdir -p artifacts
          python3 scripts/check_schema_contract_coverage.py \
            --threshold 100 \
            --report artifacts/contract_coverage_report.md

      - name: Migration consistency
        run: |
          mkdir -p artifacts
          python3 scripts/check_migration_consistency.py \
            --json-report artifacts/migration_consistency.json

      - name: Route ↔ storage boundary gate
        run: bash scripts/ci/check_route_storage_boundary.sh

      # Workflow 自身的健全性：每个 Actions step 必须有 `run:` 或 `uses:`。
      # 缺了两者会让**整个 workflow 文件**校验失败，该 workflow 的所有步骤一起
      # 不生效（db-migration-gate.yml 在 2026-09-15 曾真实如此 —— Phase 0 删掉了
      # `run: echo "..."` 占位却留下 `- name:` 骨架）。纯注释在 YAML 里合法，
      # 所以仅靠 yaml.safe_load 发现不了，必须按 Actions 的 step schema 检。
      - name: Workflow step schema (every step needs run/uses)
        run: |
          mkdir -p artifacts
          python3 scripts/ci/check_workflow_steps.py \
            --json-report artifacts/workflow_steps.json

      # SQLx 棘轮：动态查询不得增加、编译期校验（query!/query_as!）不得减少。
      # 基线见 scripts/ci/sqlx_dynamic_ratio_baseline。
      # 历史：本脚本此前只扫 src/（漏掉 synapse-storage 等 crate 的 97% 调用）、
      # 硬编码不可达的 max=0.30、引用不存在的计划文档，且从未接入 CI —— 故从未生效。
      - name: SQLx dynamic/static ratio ratchet
        run: bash scripts/ci/check_sqlx_dynamic_ratio.sh

      # A2 / B4-4: the HTTP layer must reach persistence only through
      # `synapse-services`. The allowlist may only shrink; the gate fails on a new
      # offender AND on a stale entry, so it cannot be silenced by editing a number.
      - name: Web layer must not use synapse_storage directly (ratchet)
        run: python3 scripts/ci/check_web_layering.py

      # Same invariant, wider net: no `crate::storage` import, `sqlx::query` or
      # raw `PgPool` anywhere under synapse-web/src/routes/. This script existed
      # since before the crate extraction but was never wired into CI, so the
      # `Arc<PgPool>` on the route state went unnoticed (B4-5c — now removed).
      - name: Route layer must not touch storage or the pool directly
        run: bash scripts/quality/check_route_layering.sh

      # DB review 优先级 7：PostgreSQL max_connections 是全局资源，池上限 × 进程数
      # 必须有成文预算并被校验，否则连接耗尽会表现为随机的测试/部署失败。
      - name: Connection budget invariant
        run: python3 scripts/ci/check_connection_budget.py

      # A5 / B4-1: `pub trait` and `*StoreApi` counts may only go DOWN. The
      # baseline (`scripts/ci/trait_count_baseline`, TOTAL=65 / STORE_API=33) has
      # existed since 2026-09-15, but no workflow ever read it, so the ratchet
      # could not fire at all — a new storage trait had no gate (sweep C4 / E3).
      # Red-proved 2026-09-19: injecting one `pub trait` probe → exit 1
      # (`65 -> 66`); removing it → exit 0.
      - name: Trait-count ratchet (no new pub trait / StoreApi)
        run: python3 scripts/ci/check_trait_ratchet.py

      # Supply-chain hardening (cargo-deny + cargo-audit) runs in the
      # `security-audit` job, which installs both tools first. It used to be
      # invoked here as well ("for fast PR feedback"), but this job installs no
      # Rust toolchain and neither tool, so `supply_chain_gate.sh` skipped both
      # checks and still printed "supply_chain_gate: OK" — a step that could not
      # fail, sitting under a comment claiming "both must pass for the PR to
      # merge". The gate now exits 2 when a tool is missing, so invoking it here
      # would simply fail; one real invocation is the point (see ci.yml
      # `security-audit`).

  # ──────────────────────────────────────────────
  # OpenAPI Artifact Generation (B2-5)
  # Generates client.yaml + route-table.json as CI artifacts.
  # Outputs are uploaded, not committed to git.
  # ──────────────────────────────────────────────

  openapi-artifact:
    name: OpenAPI Artifact (client.yaml + route-table.json)
    runs-on: ubuntu-latest
    needs: repo-sanity
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build synapse_ledger_export binary
        run: cargo build --quiet --bin synapse_ledger_export

      # route-table.json's source is a fresh DEFAULT-FEATURE export, not the
      # committed scripts/api_test/ledger.json (a stale 2026-08-12 input that
      # yields a different route set). The timestamp is pinned so the export is
      # reproducible; it must equal the committed artifact's `generated_at` and
      # gen_client_yaml.py's FIXED_TIMESTAMP. If it drifts, the route-table
      # --check below goes red, so the pin is self-guarding.
      - name: Export default-feature ledger (fixed timestamp)
        run: |
          ./target/debug/synapse_ledger_export \
            --profile=default \
            --output="$RUNNER_TEMP/ledger_default_ci.json" \
            --timestamp=2026-09-16T00:00:00Z

      # Both checks MUST run BEFORE the generation steps below, which overwrite
      # the committed artifacts in the workspace; --check itself only ever writes
      # to a temp path. client.yaml is byte-reproducible from the committed
      # scripts/api_test/ledger.json, route-table.json from the fresh
      # default-feature export above. A ledger/generator change that ships
      # without regenerating the artifact fails here instead of silently
      # uploading a contract that disagrees with the committed one.
      - name: Verify committed client.yaml is in sync (fails on drift)
        run: python3 scripts/api_test/gen_client_yaml.py --skip-export --check

      - name: Verify committed route-table.json is in sync (fails on drift)
        run: python3 scripts/api_test/gen_route_table.py --check --ledger "$RUNNER_TEMP/ledger_default_ci.json"

      - name: Generate client.yaml (OpenAPI 3.0.3)
        run: |
          mkdir -p docs/openapi
          python3 scripts/api_test/gen_client_yaml.py --skip-export

      # Same fresh default-feature export as the check above, so the uploaded
      # artifact matches the committed one byte-for-byte.
      - name: Generate route-table.json
        run: python3 scripts/api_test/gen_route_table.py --ledger "$RUNNER_TEMP/ledger_default_ci.json"

      - name: Upload client.yaml artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-client-yaml
          path: docs/openapi/client.yaml
          retention-days: 30

      - name: Upload route-table.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-route-table
          path: docs/openapi/route-table.json
          retention-days: 30

  test:
    name: Test & Lint (${{ matrix.rust-toolchain }}, ${{ matrix.features-label }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        rust-toolchain: [stable, 1.93.0]
        features-args: ["", "--all-features"]
        include:
          - features-args: ""
            features-label: default-features
          - features-args: "--all-features"
            features-label: all-features

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # `check_missing_docs_ratchet.sh` diffs against `HEAD~1` (and the
          # follow-up `--base origin/main` form needs the ref too). A default
          # shallow checkout cannot resolve either, so the script exited 2 with
          # `fatal: ambiguous argument 'HEAD~1'` — the incremental pub-doc check
          # never actually ran in CI (gate-integrity sweep C7).
          fetch-depth: 0

      - name: Install Rust toolchain (${{ matrix.rust-toolchain }})
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust-toolchain }}
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust-toolchain }}-${{ matrix.features-label }}

      - name: Pre-cache swagger-ui zip (avoid GitHub 403 rate-limiting)
        if: matrix.features-args == '--all-features'
        run: bash scripts/precache-swagger-ui.sh

      # ── W7+: fmt debt 棘轮（ratchet）────────────────────────────
      # 原 step 是 `cargo fmt --all -- --check`（全有或全无）。仓库里累积的
      # 31 处 rustfmt 不合规（friend_room_service / sliding_sync_service 等
      # 12 个文件）让它长期是红的 —— 长期红的 CI 会被忽视，新引入的格式
      # 问题淹没在既有噪声里，比不检查更糟。
      #
      # 改成棘轮：只比对数量，不许增、也不许「悄悄减」。
      #   current > baseline -> 失败（引入新问题）
      #   current < baseline -> 失败（debt 减少了，必须收紧棘轮）
      #   current == baseline -> 通过
      # 详见 scripts/check_fmt_ratchet.sh 头注释（含更新 baseline 的命令）。
      - name: Check formatting (ratchet)
        if: matrix.rust-toolchain == 'stable' && matrix.features-args == ''
        run: ./scripts/check_fmt_ratchet.sh

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --features test-utils ${{ matrix.features-args }} --locked -- -D warnings

      # S-8: 检测 get_raw() 在生产路径的使用
      # 确保所有跨实例共享的缓存读使用 get_raw_shared().await
      # 而不是 get_raw()（仅读 L1 本地缓存）
      - name: Check get_raw() usage
        if: matrix.features-args == ''
        run: |
          python3 scripts/check_get_raw_usage.py
          echo "S-8: get_raw() audit passed"

      - name: Install sqlx-cli
        if: matrix.features-args == '--all-features'
        # Pin to 0.8.x: matches the project's sqlx 0.8 and stays within MSRV.
        # sqlx-cli 0.9+ requires rustc >= 1.94, which the CI toolchain lacks.
        run: cargo install sqlx-cli --version '^0.8' --locked --no-default-features --features postgres

      - name: Install cargo-nextest
        if: matrix.features-args == '--all-features'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Build forward-only sqlx migration source
        if: matrix.features-args == '--all-features'
        run: python3 scripts/build_sqlx_migration_source.py artifacts/sqlx-migrations

      - name: Create synapse_test database (idempotent)
        if: matrix.features-args == '--all-features'
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/postgres
        run: psql -c "CREATE DATABASE synapse_test;" || true

      # ── seed: public (storage) + template (services/root) 一库两态 ──────────
      # storage db_tests 直连 `public`；services/root 的 `prepare_shared_test_pool`
      # 从模板 schema 克隆。两者必须共存：给每个测试步骤设
      # `TEST_DB_TEMPLATE_SCHEMA` 钉住模板名，克隆池走 verify-only 路径，
      # **永不触发 `init_template_schema` 里的 `DROP SCHEMA public`**（根因修复）。
      # seed 步骤（本步）：先把迁移灌进 `public`，再用 PGOPTIONS 把同一份迁移
      # 灌进 `test_template_ci`，一次搞定两个 schema。
      #
      # 若有人把 `TEST_DATABASE_URL` 指回应用库 `synapse`：守卫
      # （DB 名不含 `test` 且 public.schema_migrations 存在）会快速失败，
      # 而不是静默清库。`SYNAPSE_TEST_ALLOW_PUBLIC_SCHEMA_WIPE` 在 CI 中绝不开。
      - name: Seed test schemas (public + template)
        if: matrix.features-args == '--all-features'
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse_test
        run: bash scripts/ci/prepare_test_db.sh

      # P5-fix: this gate used to be `cargo test --doc --locked`, which only
      # compiles the ROOT package. The root package has zero doc tests, so the
      # step reported `running 0 tests` and passed unconditionally — it verified
      # nothing, and a real rustdoc-only compile error shipped green through it:
      #   error[E0106]: missing lifetime specifiers
      #   --> synapse-web/src/federation/edu.rs  fn validate_profile_update_content(...) -> Option<(&str, ...)>
      # `cargo build`/`check`/`clippy` never flagged it (the returned lifetimes were
      # unconstrained); only rustdoc compiles doc examples and caught it.
      #
      # `--workspace` compiles every crate's documentation, which is what makes this
      # gate able to catch that class of error.
      #
      # Known limitation (do not mistake this gate for doc-test coverage): the whole
      # workspace currently contains only 4 doc tests and ALL of them are `#[ignore]`d,
      # so no doc example is actually executed. This step is a rustdoc COMPILE gate,
      # not execution coverage. Treat `cargo doc`'s ~3.5k unresolved-intra-doc-link
      # warnings as separate, pre-existing debt.
      - name: Run doc tests (workspace — rustdoc compile gate)
        if: matrix.features-args == '--all-features'
        run: cargo test --doc --locked --workspace

      # ── 测试作用域：必须 --workspace ──────────────────────────────────────
      # 此前这里是裸 `--lib`，**没有 --workspace**，因此只测根包（687 个），
      # synapse-common / synapse-storage / synapse-services / synapse-e2ee 等
      # crate 的 lib 测试（合计 6118+ 个）在 CI 中从未编译、从未运行 ——
      # 而这几个 crate 正是业务逻辑与持久化所在层。守卫
      # `tests/unit/ci_test_scope_tests.rs` 锁住这一点。
      #
      # 2026-09-14：移除了 `-E 'not test(/^media::tests::/)'` 排除。
      # media::tests 的 3 个确定性失败已随 §4 修复（改用共享隔离池
      # `prepare_isolated_test_pool`，从 v11 baseline 克隆完整 schema，
      # 不再自建部分 schema + 回退 public）。此前连跑 4 次出现
      # 0 / 1 / 3 / 3 个失败且失败集漂移，现本地实测 13/13 全绿、
      # 并发 --test-threads 4 连跑 3 次稳定。豁免守卫
      # `scripts/ci/check_media_exemption_still_needed.sh` 已随之删除。
      - name: Run library unit tests (--workspace --lib)
        if: matrix.features-args == '--all-features'
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse_test
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse_test
          TEST_DB_TEMPLATE_SCHEMA: test_template_ci
          REDIS_URL: redis://localhost:6379
          RUST_BACKTRACE: 1
          RUST_LOG: info
          NEXTEST_RETRIES: 2
        run: cargo nextest run --workspace --lib --all-features --locked --test-threads 4

      - name: Run unit test target (--test unit)
        if: matrix.features-args == '--all-features'
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse_test
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse_test
          TEST_DB_TEMPLATE_SCHEMA: test_template_ci
          REDIS_URL: redis://localhost:6379
          RUST_BACKTRACE: 1
          RUST_LOG: info
          NEXTEST_RETRIES: 2
        run: cargo nextest run --test unit --features test-utils --locked --test-threads 4

      # ── B16: 让 `cfg(not(any(...)))` 门控的 golden 真正编译 ──
      # `synapse-web/src/routes/derived_routes.rs` 里 default/worker/all 三个
      # ledger golden 用 `#[cfg(not(any(all-extensions, voice-extended, saml-sso,
      # cas-sso, voip-tracking, server-notifications, privacy-ext, builtin-oidc)))]`
      # 门控；上方 `--workspace --lib --all-features`（line ~380）打开
      # all-extensions 后它们被关掉，而 `--test unit` 不编译依赖 crate 的
      # `cfg(test)` ⇒ 三份 `ledger_export/*.json` 在 CI 里从未被校验
      # （sweep §3 B16）。用最小 feature 集单独跑 synapse-web 的 lib 测试补上；
      # all-features 下的三个 `ledger_export_sdk/*` golden 仍由上面那步覆盖。
      - name: Run synapse-web lib tests (minimal features, default ledger golden)
        if: matrix.features-args == '--all-features'
        env:
          SQLX_OFFLINE: "true"
          RUST_BACKTRACE: 1
        run: cargo nextest run -p synapse-web --lib --features test-utils --locked --test-threads 4

      # ── B17: 让 `#[cfg(feature = "voice-extended")]` 的 unit 模块真正编译 ──
      # `tests/unit/{voice_service_tests,voice_route_tests}.rs` 在 mod.rs 里按
      # `voice-extended` 门控，而 `--test unit` 步骤只带 `test-utils`
      # ⇒ 这两个模块从未在 CI 编译过（sweep §3 B17）。第一次让它们编译就暴露了
      # 两条真红（FT-130 断言写反、`get_event_context_admin` 断言永不成立），
      # 已在 993a1dd6 修复。
      - name: Run voice-gated unit modules (voice-extended)
        if: matrix.features-args == '--all-features'
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse_test
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse_test
          TEST_DB_TEMPLATE_SCHEMA: test_template_ci
          REDIS_URL: redis://localhost:6379
          RUST_BACKTRACE: 1
          NEXTEST_RETRIES: 2
        run: cargo nextest run --test unit --features "test-utils,voice-extended" --locked --test-threads 4 -E 'test(voice_)'

      # ── §6 修复：clippy 门禁覆盖范围 ──
      # 上方 `Run clippy` 已改为 `--workspace --all-targets --features test-utils`，
      # 覆盖全部 workspace crate 的 lib + test + bin 代码（旧版仅根 crate lib，
      # 子 crate 测试代码的 lint 完全漏检，见审计 §15.1 的变红实验）。原
      # `-p synapse-services --all-features --tests` 补丁步骤因被其完整覆盖而删除。
      #
      # ── B3: missing_docs 棘轮 ──
      # 7 个 crate 都开了 crate 级 `#![allow(missing_docs)]`，存量几百个 warning
      # 不能直接打开。ratchet 只卡增量：新增 pub 项必须带 `///` doc，debt
      # 数字通过 scripts/.missing-docs-baseline 锁住。详见脚本头注释。
      - name: Check missing_docs ratchet
        run: ./scripts/check_missing_docs_ratchet.sh
        env:
          SQLX_OFFLINE: "true"

      # Upload test logs on failure. The default GH-Actions log storage has a
      # narrow retention window (often cleaned up by the time maintainers look
      # at the failed run). Persisting via artifacts keeps logs available for
      # 7 days. Path-agnostic because nextest writes to target/nextest/default*.
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.rust-toolchain }}-${{ matrix.features-label }}-${{ github.run_id }}
          path: |
            target/nextest/default-*/
            target/test-results.xml
          retention-days: 7
          if-no-files-found: ignore

      # ── §9: cleanup accumulated test-schemas after each job ──
      # Every test step that calls `prepare_isolated_test_pool` leaves behind a
      # clone schema (`test_*`). Over time these accumulate (388+ locally on
      # 2026-09-14). This step drops them at the end of each CI job.
      #
      # Note: GitHub Actions service containers (postgres) are destroyed at job
      # end, so this cleanup is per-job only — it prevents intra-job bloat
      # when multiple test matrices share the same container. The `always()`
      # condition ensures cleanup runs even if prior steps fail.
      - name: Cleanup accumulated test schemas (§9)
        if: always() && matrix.features-args == '--all-features'
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse_test
          TEST_DB_TEMPLATE_SCHEMA: test_template_ci
        run: bash scripts/cleanup_test_schemas.sh --apply

  # ──────────────────────────────────────────────
  # PR Benchmark Gate — runs on every PR (~30-60s)
  # Pure-Rust benchmarks only (federation + membership)
  # ──────────────────────────────────────────────
  pr-benchmark-gate:
    name: PR Benchmark Gate
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.non-docs == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: pr-benchmark-gate

      - name: Download baseline benchmark results
        uses: dawidd6/action-download-artifact@v3
        # ⚠️ 不得设 continue-on-error: true。
        # 历史上这里容忍下载失败，而脚本在缺基线时打印 "PASSED (baseline
        # comparison skipped)" —— 二者叠加使「基线没下到」永久伪装成「没有回归」。
        # 现在缺基线会让门禁明确失败（首次在 main 上跑完后即有基线）。
        with:
          workflow: benchmark.yml
          name: benchmark-results
          path: baseline
          # 基线必须是 Criterion **文本**格式。benchmark.txt 是
          # --output-format bencher 的产物，本门禁的解析器读不了。
          check_artifacts: true
          search_artifacts: true

      - name: Locate baseline (Criterion text format)
        id: baseline
        run: |
          set -euo pipefail
          # benchmark.yml 上传的 artifact 同时含 benchmark.txt（bencher 格式）
          # 与 benchmark_standard.txt（Criterion 文本格式，覆盖 federation +
          # membership，与本门禁运行的基准一致）。
          if [ -f baseline/benchmark_standard.txt ]; then
            echo "path=baseline/benchmark_standard.txt" >> "$GITHUB_OUTPUT"
            echo "Using baseline/benchmark_standard.txt"
          else
            echo "::error::未找到 Criterion 文本格式基线 baseline/benchmark_standard.txt。"
            echo "::error::benchmark.txt 使用 --output-format bencher，与本门禁解析器不兼容。"
            echo "::error::请先在 main 上跑一次 benchmark.yml 以生成基线。"
            exit 1
          fi

      - name: Run PR benchmark gate
        run: bash scripts/ci/benchmark_pr_gate.sh
        env:
          BENCH_THRESHOLD_PERCENT: 15
          BENCH_BASELINE_PATH: ${{ steps.baseline.outputs.path }}
          # 必须与录制基线时使用的 profile 一致（benchmark.yml 用 release-perf）。
          BENCH_PROFILE: release-perf

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-benchmark-results-${{ github.run_id }}
          path: artifacts/pr_benchmark_results.json
          retention-days: 7

  # ──────────────────────────────────────────────────────────
  # Slow Tier — runs on merge to main + weekly schedule
  # Skipped when only docs (*.md, docs/) changed
  # ──────────────────────────────────────────────────────────

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: >-
      github.event_name == 'schedule' ||
      (needs.changes.outputs.non-docs == 'true' &&
       github.event_name == 'push' &&
       (github.ref == 'refs/heads/main'))

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        # Pin to 0.8.x: matches the project's sqlx 0.8 and stays within MSRV.
        # sqlx-cli 0.9+ requires rustc >= 1.94, which the CI toolchain lacks.
        run: cargo install sqlx-cli --version '^0.8' --locked --no-default-features --features postgres

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install cargo-insta
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-insta

      - name: Pre-cache swagger-ui zip
        run: bash scripts/precache-swagger-ui.sh

      - name: Build forward-only sqlx migration source
        run: python3 scripts/build_sqlx_migration_source.py artifacts/sqlx-migrations

      # `synapse` 是"部署形态"库：只用来验证 `artifacts/sqlx-migrations`（部署路径的
      # 迁移源）能干净地 apply 到应用库形状上。**测试步骤不连它。**
      #
      # 这里曾经把 integration/e2e/snapshot/perf 四步指向 `synapse`，那是坏的：
      # `src/test_utils.rs::init_template_schema` 的守卫只把"库名含 test"的库当作
      # 可重建测试库，`synapse` 一旦带上 `public.schema_migrations` 就被判定为
      # "像部署库"直接返回 Err —— 于是 `default_fixture()` 拿到 None，
      # `api_route_ledger_tests` 的 14 个用例 + key_backup 的 2 个用例全部静默
      # `return`，**ledger 契约链（manifest → ledger → export → SDK）在 CI 里
      # 从未真正跑过**（18 处静默跳过，见 PROJECT_ACTUAL_ISSUES §2.5）。
      # 现统一改为 `synapse_test` + 钉死 `TEST_DB_TEMPLATE_SCHEMA`，并让跳过行为
      # fail-closed（`tests/integration/mod.rs::skip_or_fail_without_db`）。
      - name: Create synapse_test database (idempotent)
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/postgres
        run: psql -c "CREATE DATABASE synapse_test;" || true

      # 只做"部署路径迁移源能否干净 apply 到应用库形状"的验证，**不供任何测试使用**。
      # 后续步骤一律连 `synapse_test`。
      - name: Verify deploy-path migrations apply to an app-shaped DB (synapse, not used by tests)
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
        run: |
          sqlx database create
          sqlx migrate run --source artifacts/sqlx-migrations
          # P2 fail-fast: same guard as Test & Lint job — refuse to start tests
          # if critical tables are missing after migration.
          missing=0
          for table in burn_after_read_pending burn_after_read_settings burn_after_read_log burn_after_read_user_defaults; do
            if ! psql -d synapse -tAc "SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='$table'" | grep -q 1; then
              echo "::error::Required table missing after migration: $table"
              missing=$((missing+1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing critical table(s) missing — aborting"
            exit 1
          fi

      - name: Set up synapse_test schema
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse_test
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse_test
          TEST_DB_TEMPLATE_SCHEMA: test_template_ci
        run: bash scripts/ci/prepare_test_db.sh

      # P6 fix: run admin registration integration tests serially to avoid deadlock.
      # Multiple tests sharing the same nonce key + concurrent writes to users table
      # cause PostgreSQL deadlock at --test-threads > 1.
      #
      # Pin `TEST_DB_TEMPLATE_SCHEMA` so this step's `prepare_shared_test_pool`
      # takes the verify-only clone path and never DROPs `public` (see Test & Lint
      # job's seed note). `synapse_test` is a throwaway DB, but the DB-name guard
      # is a backstop, not the primary defence.
      - name: Run integration tests (serial — admin registration)
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse_test
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse_test
          TEST_DB_TEMPLATE_SCHEMA: test_template_ci
          REDIS_URL: redis://localhost:6379
          RUST_BACKTRACE: 1
          RUST_LOG: info
          NEXTEST_RETRIES: 2
        run: cargo nextest run --test integration 'admin_registration_service_tests_migrated' --all-features --locked --test-threads 1

      - name: Run integration tests (--test integration)
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse_test
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse_test
          TEST_DB_TEMPLATE_SCHEMA: test_template_ci
          REDIS_URL: redis://localhost:6379
          RUST_BACKTRACE: 1
          RUST_LOG: info
          NEXTEST_RETRIES: 2
        run: cargo nextest run --test integration --all-features --locked --test-threads 6

      # e2e 目标此前**没有任何 workflow 调用**（`grep -rn "test e2e" .github/workflows/` 无命中），
      # 而 CLAUDE.md 把它记为可用命令 —— 未被执行的测试会静默腐坏。
      #
      # 注意其内容：`e2e_scenarios.rs` 是**纯模拟**（零 I/O，断言对象是局部字面量），
      # 已改名为 `simulated_*` 并就地说明；`user_flow_tests.rs` 是真 HTTP 但全部
      # `#[ignore]`（需 E2E_RUN=1 + 运行中的 homeserver）。
      # 因此本步骤实际执行的是"模拟步骤大纲"，其价值在于**防止编译/链接腐坏**，
      # 而不是验证端到端行为 —— 后者由上面的 integration 步骤承担。
      - name: Run e2e target (simulated scenarios compile + run)
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse_test
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse_test
          TEST_DB_TEMPLATE_SCHEMA: test_template_ci
          REDIS_URL: redis://localhost:6379
          RUST_BACKTRACE: 1
        run: cargo nextest run --test e2e --all-features --locked --test-threads 4

      # Snapshot gate: fail if any insta snapshot drifted or is missing.
      # Local devs must run `cargo insta test --review` to accept new snapshots
      # before pushing; CI runs in non-interactive --no-review mode and fails
      # on any pending .snap.new files.
      - name: Snapshot gate (cargo insta test --no-review)
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse_test
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse_test
          TEST_DB_TEMPLATE_SCHEMA: test_template_ci
          REDIS_URL: redis://localhost:6379
          RUST_BACKTRACE: 1
          NEXTEST_RETRIES: 2
        run: cargo insta test --no-review --test-runner nextest -- --all-features --locked --test-threads 8

      - name: Run performance smoke gate
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse_test
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse_test
          TEST_DB_TEMPLATE_SCHEMA: test_template_ci
          REDIS_URL: redis://localhost:6379
          RUN_PERF_SMOKE: 1
          PERF_SMOKE_LOG: artifacts/perf_smoke.log
        run: |
          # `2>&1 | tee` 掩盖退出码（bash 默认无 pipefail）。
          set -o pipefail
          mkdir -p artifacts
          cargo test --test performance_manual --features performance-tests --locked -- --ignored --nocapture 2>&1 | tee artifacts/perf_smoke.log

      - name: Upload performance smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-smoke-log
          path: artifacts/perf_smoke.log
          retention-days: 14

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: >-
      github.event_name == 'schedule' ||
      (needs.changes.outputs.non-docs == 'true' &&
       (github.event_name == 'pull_request' ||
        (github.event_name == 'push' &&
         (github.ref == 'refs/heads/main'))))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Run the unified supply-chain gate. This is the same script that
      # `repo-sanity` invokes for fast PR feedback, but here we also
      # assert that no `rand::rng()` calls leaked into the tree (the
      # RUSTSEC-2026-0097 watch-out).
      - name: Supply-chain gate (cargo-deny + cargo-audit)
        run: bash scripts/ci/supply_chain_gate.sh

      - name: Assert rand::rng() is unused
        run: |
          if git grep -n "rand::rng()" -- '*.rs'; then
            echo "rand::rng() is temporarily banned until RUSTSEC-2026-0097 is resolved"
            exit 1
          fi

      # ── cargo-geiger: unsafe usage scan ──
      # Uses JSON output + baseline ratchet via scripts/ci/run_cargo_geiger.py.
      # Production unsafe must be zero (hard block); test unsafe is tracked
      # against a baseline (ratchet: only fails if count increases).
      - name: Install cargo-geiger
        # 钉住版本：run_cargo_geiger.py 依赖 cargo-geiger 的 JSON schema
        # （SafetyReport.packages / ReportEntry.unsafety.used）。之前是未钉版本的
        # `cargo install cargo-geiger --locked`，上游一发新版就可能再次漂移成"恒 0 假绿"。
        run: cargo install cargo-geiger --version '^0.13' --locked

      - name: Run cargo-geiger (unsafe usage scan)
        run: python3 scripts/ci/run_cargo_geiger.py

      - name: Upload cargo-geiger report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-geiger-report
          path: artifacts/cargo-geiger.json
          retention-days: 14

      # m-2: Track outdated dependencies for security-relevant crates.
      # Non-blocking: only warns, does not fail the pipeline.
      # Focus on crypto crates that may need patch-level bumps.
      - name: Check outdated dependencies (cargo-outdated)
        continue-on-error: true
        run: |
          # Even though this step is `continue-on-error`, the pipeline must not
          # lie about what `cargo outdated` did: `| tee` alone reports tee's 0.
          # `set -o pipefail` keeps the reported status the command's own.
          set -o pipefail
          cargo install cargo-outdated --locked
          echo "=== Outdated dependencies (focus: crypto) ==="
          cargo outdated --root-deps-only 2>&1 | tee artifacts/outdated-deps.txt
          echo ""
          echo "=== Security-relevant crate status ==="
          cargo outdated 2>&1 | grep -E '(x25519-dalek|ed25519-dalek|curve25519-dalek|aes-gcm|chacha20poly1305|ring|openssl|rustls)' || echo "No updates available for tracked security crates."

      - name: Upload outdated-deps report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outdated-deps-report
          path: artifacts/outdated-deps.txt
          retention-days: 14

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: >-
      github.event_name == 'schedule' ||
      (needs.changes.outputs.non-docs == 'true' &&
       github.event_name == 'push' &&
       (github.ref == 'refs/heads/main'))
    strategy:
      matrix:
        profile:
          - name: core-matrix-min
            features: ""
          - name: core-private-chat
            features: "friends,burn-after-read"
          - name: all-extensions
            features: "all-extensions"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.profile.name }}

      - name: Build ${{ matrix.profile.name }}
        run: cargo build --release --no-default-features --features ${{ matrix.profile.features }} --locked

      - name: Build wasm (if applicable)
        run: cargo build --release --bin synapse_worker --locked

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [integration-test, changes]
    if: >-
      github.event_name == 'schedule' ||
      (needs.changes.outputs.non-docs == 'true' &&
       github.event_name == 'push' &&
       (github.ref == 'refs/heads/main'))

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse
        ports:
          - 5432:5432

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: llvm-tools-preview

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Install sqlx-cli
        # Pin to 0.8.x: matches the project's sqlx 0.8 and stays within MSRV.
        # sqlx-cli 0.9+ requires rustc >= 1.94, which the CI toolchain lacks.
        run: cargo install sqlx-cli --version '^0.8' --locked --no-default-features --features postgres

      - name: Build forward-only sqlx migration source
        run: python3 scripts/build_sqlx_migration_source.py artifacts/sqlx-migrations

      # Coverage 要走 root/services 的 `prepare_shared_test_pool`（模板克隆路径），
      # 所以必须连**测试库**并钉死模板 schema。此前这里连的是应用库 `synapse`，
      # 守卫（`current_database()` 不含 "test" 且 public.schema_migrations 存在）
      # 会直接拒绝 → 非 storage 的用例全部拿不到池。改用与 integration-test job
      # 同一套 seed（`prepare_test_db.sh` 同时产出 public + test_template_ci）。
      - name: Create synapse_test database (idempotent)
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/postgres
        run: psql -c "CREATE DATABASE synapse_test;" || true

      - name: Set up test database (public + test_template_ci in synapse_test)
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse_test
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse_test
          TEST_DB_TEMPLATE_SCHEMA: test_template_ci
        run: bash scripts/ci/prepare_test_db.sh

      - name: Run coverage
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse_test
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse_test
          TEST_DB_TEMPLATE_SCHEMA: test_template_ci
          REDIS_URL: redis://localhost:6379
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          # llvm-cov two-step (mirrors scripts/run_local_coverage.sh; tarpaulin is
          # dropped because 0.35.2 has a broken --implicit-test-threads and drops
          # coverage data when any test exits non-zero):
          #   step 1: synapse-storage alone, single-threaded — its db_tests connect
          #           straight to the public schema and race under concurrency.
          #   step 2: everything else (--exclude synapse-storage) with the feature
          #           set that route_ledger snapshots were generated against.
          #   step 3: merge the two lcov files.
          mkdir -p coverage
          COV_FEATURES="test-utils,privacy-ext,voice-extended,voip-tracking,beacons,server-notifications,cas-sso,saml-sso"
          RUST_TEST_THREADS=1 cargo llvm-cov -p synapse-storage \
            --features "$COV_FEATURES" --lib \
            --lcov --output-path /tmp/storage.lcov
          cargo llvm-cov --workspace --exclude synapse-storage \
            --features "$COV_FEATURES" \
            --lcov --output-path /tmp/rest.lcov \
            -- --skip ledger_export_tests
          python3 scripts/merge_lcov.py /tmp/storage.lcov /tmp/rest.lcov -o coverage/lcov.info

      - name: Bootstrap coverage baseline (main, first run only)
        # The per-file ratchet is meaningless without a baseline: with an empty
        # one every file takes the "new" branch (30% ramp-up floor) and the
        # "touched files must not regress" branch is unreachable. That is the
        # state this repo was actually in — scripts/ci/coverage_baseline.json was
        # never committed, while all four sibling ratchet baselines
        # (.fmt-baseline, .missing-docs-baseline, trait_count_baseline,
        # sqlx_dynamic_ratio_baseline) are in git.
        #
        # check_file_coverage.py now exits 2 when the baseline is missing, so the
        # bootstrap runs first, with every floor at 0 (a pass by construction),
        # purely to materialise the file for the follow-up commit step.
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main')
        run: |
          if [ -f scripts/ci/coverage_baseline.json ]; then
            echo "Baseline present; nothing to bootstrap."
            exit 0
          fi
          mkdir -p artifacts
          python3 scripts/check_file_coverage.py \
            --report coverage/lcov.info \
            --format lcov \
            --baseline scripts/ci/coverage_baseline.json \
            --save-baseline scripts/ci/coverage_baseline.json \
            --global-floor 0 --new-file-floor 0 --core-threshold 0

      - name: Per-file coverage ratchet (B.3)
        # Enforces: any file already recorded in the baseline must not regress;
        # NEW files must clear core ≥70% (or the 30% ramp-up otherwise);
        # test-support sources are skipped (see scripts/check_file_coverage.py).
        # `--non-unit-coverable` exempts `src/bin/` and `src/main.rs` from the
        # NEW-file floors only: `cargo llvm-cov --workspace --lib` never executes a
        # binary entry point, so those files record 0.0% by construction. A
        # baseline-known file under an exempt prefix is still checked for
        # regression, and a missing/empty/stale list exits 2 (fail-closed).
        # `--global-floor 40` is retained for the ramp-up warning only; absolute
        # floors are deliberately not re-applied to baseline-known files, because
        # doing so made the first committed baseline red on 188 files that had not
        # regressed at all (measured 2026-09-19).
        # Fails (exit 2) when scripts/ci/coverage_baseline.json is absent, because
        # the "touched must not regress" half of the ratchet is unreachable
        # without it. On main the previous step bootstraps it and the
        # follow-up step commits it; fix locally with the same command.
        run: |
          mkdir -p artifacts
          python3 scripts/check_file_coverage.py \
            --report coverage/lcov.info \
            --format lcov \
            --baseline scripts/ci/coverage_baseline.json \
            --global-floor 40 \
            --new-file-floor 30 \
            --core-files scripts/ci/core_file_coverage_prefixes.txt \
            --core-threshold 70 \
            --non-unit-coverable scripts/ci/non_unit_coverable_prefixes.txt

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Commit coverage baseline (auto-ratchet)
        # Only on main push; skip on PRs, schedules, and dispatches.
        # The baseline file is the only artifact this step touches.
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/ci/coverage_baseline.json
          if git diff --cached --quiet; then
            echo "No baseline change; skipping commit."
          else
            git commit -m "chore(coverage): auto-update per-file baseline [skip ci]"
            git push
          fi

  # ──────────────────────────────────────────────────────────
  # k6 Smoke Test — manual/dispatch only
  # Requires a running Synapse server; start one via Docker or
  # point BASE_URL to an existing instance before triggering.
  # ──────────────────────────────────────────────────────────

  k6-smoke-test:
    name: k6 Smoke Test
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup k6
        run: |
          curl https://github.com/grafana/k6/releases/download/v0.47.0/k6-v0.47.0-linux-amd64.tar.gz -L | tar xvz
          sudo mv k6-*/k6 /usr/local/bin/

      - name: Run smoke test
        run: bash scripts/test/perf/run_tests.sh smoke
        env:
          BASE_URL: ${{ secrets.K6_SMOKE_BASE_URL || 'http://localhost:8448' }}
          RESULTS_DIR: artifacts/k6-smoke

      - name: Evaluate guardrails
        run: python3 scripts/test/perf/guardrail.py --results-dir artifacts/k6-smoke --scenario smoke --fail-on-breach

      - name: Upload k6 smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-results
          path: artifacts/k6-smoke
          retention-days: 14

  # ──────────────────────────────────────────────────────────────
  # CI Summary — compact failure digest for maintainers
  # Skips on success (no noise). On failure, prints only failed
  # jobs + one representative error line so the PR author can triage
  # without scrolling through 4 parallel matrix logs.
  # ──────────────────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    # Run even if all upstream jobs were skipped (cancelled/no-op)
    if: always()
    # `repo-sanity` carries four real gates (migration consistency, schema table
    # coverage, schema contract coverage, route-storage boundary). It was missing
    # from this list, so its failures never appeared in the digest — and the
    # digest is what a PR author reads first. Whether the job *blocks* a merge is
    # decided by branch protection, not by this list; this only makes a failure
    # visible.
    needs: [changes, repo-sanity, test, integration-test, security-audit, build, pr-benchmark-gate]
    steps:
      - name: Print compact failure digest
        uses: actions/github-script@v7
        with:
          script: |
            // Fetch the current workflow run (works for push, PR, and dispatch events)
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

            const { data: jobsData } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });

            // Keep the latest conclusion per job name (matrix children share names)
            const jobConclusions = {};
            for (const job of jobsData.jobs ?? []) {
              if (job.status === 'completed') {
                jobConclusions[job.name] = job.conclusion;
              }
            }

            const failed = Object.entries(jobConclusions)
              .filter(([, c]) => c === 'failure' || c === 'cancelled')
              .map(([name]) => name);

            if (failed.length === 0) {
              console.log('No failed jobs detected — nothing to summarise.');
              core.summary.addRaw('<h2>CI Result: ALL GREEN</h2>');
              core.summary.write();
              return;
            }

            const html = `
              <h2>CI Result: FAILED</h2>
              <p>Compact digest of failed jobs (${failed.length} of ${Object.keys(jobConclusions).length} ran to completion). Navigate to each job link for detailed output.</p>
              <ul>
                ${failed.map(name => {
                  const job = jobsData.jobs.find(j => j.name === name);
                  const link = job?.html_url ?? '#';
                  return `<li><a href="${link}"><b>${name}</b></a></li>`;
                }).join('\n')}
              </ul>
              <p><i>Workflow run: <a href="${run.html_url}">${run.display_title}</a> on ${run.head_branch ?? 'unknown'}</i></p>
            `;

            core.summary.addRaw(html);
            core.summary.write();
            console.log('Failed jobs:', failed.join(', '));
