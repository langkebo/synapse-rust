name: Schema Drift Detection

on:
  push:
    branches:
      - main
    paths:
      - 'migrations/**/*.sql'
      - 'scripts/**'
      - 'synapse-web/src/routes/**'
      - 'docs/synapse-rust/ROUTE_CONTRACT.md'
      - 'scripts/contract/**'
  pull_request:
    branches:
      - main
    paths:
      - 'migrations/**/*.sql'
      - 'scripts/**'
      - 'synapse-web/src/routes/**'
      - 'docs/synapse-rust/ROUTE_CONTRACT.md'
      - 'scripts/contract/**'

env:
  FLYWAY_DB_HOST: ${{ vars.PGHOST || 'localhost' }}
  FLYWAY_DB_PORT: ${{ vars.PGPORT || '5432' }}
  FLYWAY_DB_NAME: ${{ vars.PGDATABASE || 'synapse' }}
  FLYWAY_DB_USER: ${{ vars.PGUSER || 'synapse' }}
  FLYWAY_DB_PASSWORD: ${{ secrets.PGPASSWORD || 'synapse' }}

jobs:
  # Detect which path groups changed so each drift job only runs when relevant,
  # avoiding the heavy migration/perf jobs on pure route-contract changes.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            migrations:
              - 'migrations/**/*.sql'
              - 'scripts/**'
            contract:
              - 'synapse-web/src/routes/**'
              - 'docs/synapse-rust/ROUTE_CONTRACT.md'
              - 'scripts/contract/**'

  drift-detection:
    name: Schema Drift Detection
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install psycopg2-binary pg8000

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U synapse; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          echo "PostgreSQL did not start in time"
          exit 1

      - name: Check migration consistency
        run: |
          mkdir -p artifacts
          python3 scripts/check_migration_consistency.py \
            --json-report artifacts/migration_consistency.json

      # `sqlx migrate run` executes each migration inside a transaction block, and
      # the consolidated baseline contains `CREATE INDEX CONCURRENTLY`, which
      # PostgreSQL refuses to run in a transaction. Measured failure:
      #   error: while executing migration 0: error returned from database:
      #   CREATE INDEX CONCURRENTLY cannot run inside a transaction block
      # Apply through the project's single migration implementation
      # (`docker/db_migrate.sh` -> psql per file, autocommit) — the same tool the
      # next step validates with, and the same one used by db-migration-gate.yml
      # and by benchmark.yml's two perf gates (`scripts/init_test_public_schema.sh`,
      # the test-schema variant). The forward-only sqlx source build this step used
      # to consume was deleted along with the `sqlx migrate run` path: it copied
      # `migrations/` into `artifacts/` (AGENTS.md rules 2/4) and its only consumer
      # could never apply the consolidated baseline.
      #
      # Keep the rationale outside `run:` — `every_ci_db_migrate_call_supplies_an_explicit_target`
      # (tests/unit/migration_consistency_tests.rs) requires `DATABASE_URL:` within
      # 15 lines above the call, so a long in-`run` comment silently breaks H-14.
      - name: Apply consolidated migration chain
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
        run: |
          bash docker/db_migrate.sh migrate

      - name: Validate schema after migration
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: synapse
          DB_USER: synapse
          DB_PASSWORD: synapse
        run: |
          bash docker/db_migrate.sh validate

      - name: Upload migration consistency report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-consistency-report
          path: artifacts/migration_consistency.json
          retention-days: 30

  migration-validation:
    name: Migration Script Validation
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check migration naming convention
        run: |
          echo "Checking migration script naming conventions..."
          echo "Legacy migrations (YYYYMMDDHHMMSS_*.sql) are allowed for backward compatibility."
          echo "New migrations must follow: V{version}__{Jira}_{description}.sql"
          echo ""

          legacy_errors=0
          new_format_errors=0

          for f in migrations/*.sql; do
            filename=$(basename "$f")

            if [[ "$filename" == *.undo.sql ]] || [[ "$filename" == *.down.sql ]]; then
              echo "[ROLLBACK] $filename - validated by rollback check"
              continue
            fi

            if [[ "$filename" =~ ^[0-9]{14}_.*\.sql$ ]]; then
              echo "[LEGACY] $filename - allowed (to be migrated to archive/incremental)"
              continue
            fi

            if [[ "$filename" =~ ^V[0-9]+(_[0-9]+)*__[A-Z]+-[0-9]+_[a-z0-9_]+\.sql$ ]]; then
              echo "[NEW] $filename - follows new convention"
              continue
            fi

            if [[ "$filename" =~ ^V[0-9]+_[0-9]+__.*\.sql$ ]]; then
              echo "[LEGACY-V] $filename - allowed but should be normalized to new convention later"
              continue
            fi

            if [[ "$filename" =~ ^00000000_unified_schema_v[0-9]+\.sql$ ]] || \
               [[ "$filename" =~ ^00000001_extensions_v[0-9]+\.sql$ ]] || \
               [[ "$filename" == "99999999_unified_incremental_migration.sql" ]] || \
               [[ "$filename" == "MANIFEST-template.txt" ]]; then
              echo "[SPECIAL] $filename - baseline/unified migration"
              continue
            fi

            echo "[ERROR] $filename - invalid naming convention"
            if [[ "$filename" =~ ^V.*\.sql$ ]]; then
              new_format_errors=$((new_format_errors + 1))
            else
              legacy_errors=$((legacy_errors + 1))
            fi
          done

          echo ""
          if [ $new_format_errors -gt 0 ]; then
            echo "Found $new_format_errors migrations with invalid NEW format naming"
            echo "New migrations must follow: V{version}__{Jira}_{description}.sql"
            exit 1
          fi

          if [ $legacy_errors -gt 0 ]; then
            echo "Found $legacy_errors migrations with unrecognized naming"
            exit 1
          fi

          echo "Migration naming validation passed (legacy allowed, new format enforced)"

      - name: Check for duplicate migrations
        run: |
          echo "Checking for duplicate migration scripts across every shipped source..."
          # `migrations/` is the single source of truth (AGENTS.md rule 4); any
          # migration copy in another shipped directory is a duplicate. The old
          # check ran `basename | sort | uniq -d` over `migrations/` alone, where
          # filenames are unique by construction — structurally always empty
          # (sweep A11.2). It then scanned `artifacts/sqlx-migrations*`, generated
          # build outputs that were deleted together with the `sqlx migrate run`
          # path (2026-09-20), so the scan went empty a second time. Enumerate
          # every `*.sql` in the working tree instead: a reintroduced copy (e.g.
          # `docker/deploy/migrations/`) collides by basename and fails the job.
          sources=()
          while IFS= read -r f; do
            sources+=("$f")
          done < <(
            find . \( -name .git -o -name target -o -name node_modules -o -name artifacts \) -prune -o \
              -type f -name '*.sql' -print | sed 's|^\./||' | sort
          )
          echo "Migration source directories: $(printf '%s\n' "${sources[@]}" | xargs -n1 dirname | sort -u | tr '\n' ' ')"

          duplicates=$(
            for f in "${sources[@]}"; do
              name=$(basename "$f")
              if [[ "$name" == *undo* || "$name" == *rollback* ]]; then
                continue
              fi
              printf '%s\t%s\n' "$name" "$f"
            done | sort | awk -F'\t' '
                  { count[$1]++; where[$1] = where[$1] " " $2 }
                  END { for (n in count) if (count[n] > 1) printf "%s ->%s\n", n, where[n] }
                ' | sort
          )

          if [ -n "$duplicates" ]; then
            echo "::error::duplicate migration scripts found across source directories:"
            echo "$duplicates"
            exit 1
          fi
          echo "No duplicate migration scripts across ${#sources[@]} .sql file(s)"

      - name: Check for missing rollback scripts
        run: |
          echo "Checking for missing rollback scripts..."
          missing=0

          for f in migrations/*.sql; do
            filename=$(basename "$f")
            if [[ "$filename" =~ ^00000000_unified_schema_v[0-9]+\.sql$ ]] || \
               [[ "$filename" =~ ^00000001_extensions_v[0-9]+\.sql$ ]] || \
               [[ "$filename" == "99999999_unified_incremental_migration.sql" ]] || \
               [[ "$filename" == *.undo.sql ]] || \
               [[ "$filename" == *.down.sql ]] || \
               [[ "$filename" == *.rollback.sql ]]; then
              continue
            fi

            if [[ ! "$filename" =~ ^[0-9]{14}_.*\.sql$ ]] && [[ ! "$filename" =~ ^V.*\.sql$ ]]; then
              continue
            fi

            rollback_name="${f%.sql}.undo.sql"
            rollback_down="${f%.sql}.down.sql"
            rollback_alt="migrations/rollback/$(basename ${f%.sql}).rollback.sql"

            if [ ! -f "$rollback_name" ] && [ ! -f "$rollback_down" ] && [ ! -f "$rollback_alt" ]; then
              echo "Missing rollback for: $f"
              missing=$((missing + 1))
            fi
          done

          if [ $missing -gt 0 ]; then
            echo "Found $missing migrations without rollback scripts"
            exit 1
          fi
          echo "All migrations have rollback scripts"

  performance-baseline:
    name: Migration Performance Baseline
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Setup PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U synapse; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      # 曾经的这里：先插 1000 万行进 `test_events`，然后 `echo "::warning::…"` +
      # `failed=0` + `if [ "$failed" -ne 0 ]` → **永不可能变红**。付出 10M 行的代价
      # 换零断言（见 PROJECT_ACTUAL_ISSUES §2.2）。而且那 1000 万行是纯浪费：
      # 它模拟的是"大表上的增量迁移"，而目标迁移文件已在 redundancy cleanup 中整体
      # 删除，baseline 根本不引用 `test_events`。
      #
      # 现改为真断言：把 baseline 应用到一台干净的 PG 上，失败即红，并断言对象数下限
      # 与耗时上限。job 名保持不变（改名会让 required status check 永久 pending）。
      - name: Apply baseline and assert it completes
        run: |
          set -euo pipefail
          export PGPASSWORD=synapse
          PSQL="psql -h localhost -U synapse -d synapse -v ON_ERROR_STOP=1"

          # The baseline filename is versioned (00000000_unified_schema_v12.sql ->
          # ..._v13.sql ...). A hard-coded path rots into "psql: ... No such file
          # or directory" the moment it is bumped (sweep A11.3). Resolve it from the
          # single `migrations/00000000_*.sql` and fail loudly unless exactly one
          # exists.
          baselines=$(find migrations -maxdepth 1 -type f -name '00000000_*.sql' | sort || true)
          baseline_count=$(printf '%s\n' "$baselines" | grep -c . || true)
          if [ "$baseline_count" -ne 1 ]; then
            echo "::error::expected exactly one migrations/00000000_*.sql baseline, found $baseline_count"
            printf '  candidate: %s\n' "$baselines"
            exit 1
          fi
          baseline="$baselines"
          echo "Applying migration baseline: $baseline"

          start=$(date +%s)
          $PSQL -f "$baseline"
          elapsed=$(( $(date +%s) - start ))
          tables=$($PSQL -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")
          indexes=$($PSQL -tAc "SELECT count(*) FROM pg_indexes WHERE schemaname='public'")
          echo "baseline applied in ${elapsed}s: tables=${tables} indexes=${indexes}"
          if [ "$tables" -lt 200 ]; then
            echo "::error::baseline apply produced only ${tables} tables (expected >=200) — migrations are silently dropping objects"
            exit 1
          fi
          if [ "$indexes" -lt 200 ]; then
            echo "::error::baseline apply produced only ${indexes} indexes (expected >=200)"
            exit 1
          fi
          # 宽松上限：只拦"灾难性劣化"，不做脆弱的性能阈值断言。
          if [ "$elapsed" -gt 600 ]; then
            echo "::error::baseline apply took ${elapsed}s (>600s ceiling)"
            exit 1
          fi

  # Route Contract Drift Gate: regenerates docs/synapse-rust/ROUTE_CONTRACT.md from
  # the real route surface (synapse-web/src/routes/**) and fails if the committed doc drifted.
  # Local equivalent: `make route-contract-check` (scripts/contract/check_route_contract.sh)
  route-contract-drift:
    name: Route Contract Drift Check
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check ROUTE_CONTRACT.md against source route surface
        run: |
          bash scripts/contract/check_route_contract.sh
