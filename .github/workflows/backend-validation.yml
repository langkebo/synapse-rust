name: Backend Validation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: backend-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# 顶层默认只读（与仓库 Settings → Actions → Workflow permissions 的 read-only 一致）；
# 需要写仓库的 job 必须在该 job 上单独提权并注明原因，不要改这里的默认。
permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust Full Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-backend-validation-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Rust validation
        run: bash scripts/ci_backend_validation.sh rust

  migration-validation:
    name: Migration Validation
    runs-on: ubuntu-latest
    needs: rust-tests
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run migration validation
        run: bash scripts/ci_backend_validation.sh migration

  docker-smoke:
    name: Docker Smoke
    runs-on: ubuntu-latest
    needs: migration-validation
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Docker smoke validation
        run: bash scripts/ci_backend_validation.sh docker
