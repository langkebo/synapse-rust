name: Format Governance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  format-compliance:
    name: Format Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # `rust-src` must be listed here even though this job only runs `rustfmt`,
      # `ruff` and `shfmt`: `rust-toolchain.toml` declares it, so every rustup
      # shim invocation re-resolves the toolchain and tries to install it. Left
      # implicit, that install happened lazily inside the *first* `rustfmt` call,
      # and when it failed (main run 35498321546: `detected conflict:
      # 'lib/rustlib/src/rust/library/Cargo.lock'` against the runner's cached
      # 1.93.0) rustfmt never ran — the gate then reported a phantom
      # "whole file deleted" diff instead of a toolchain error. Declaring it here
      # moves the failure into the step that owns toolchain installation, where
      # rustup's own message is visible and attributable.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy, rust-src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install format tools
        run: |
          python -m pip install --upgrade pip
          # Pin ruff: `ruff format` output is version-dependent, so an unpinned
          # install makes this gate's verdict depend on the day it runs (a
          # formatter bump would redden CI with no source change). The tree is
          # formatted with 0.16.8 (25 files, AST-verified as format-only).
          # shfmt comes from apt and is 3.8.0 on ubuntu-24.04; the shell tree is
          # clean under both 3.8.0 and 3.13.1 (measured 2026-09-20).
          python -m pip install 'pre-commit' 'ruff==0.16.8'
          sudo apt-get update
          sudo apt-get install -y shfmt

      - name: Generate format audit report
        run: |
          mkdir -p artifacts
          python3 scripts/quality/format_audit.py --output artifacts/format_audit.md

      - name: Run format compliance
        run: bash scripts/quality/format_check.sh

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: format-audit
          path: artifacts/format_audit.md
          retention-days: 14
