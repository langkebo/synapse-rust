name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: Run Criterion benchmarks
        required: false
        default: true
        type: boolean
      run_performance_manual:
        description: Run manual performance test target
        required: false
        default: false
        type: boolean
      run_performance_soak:
        description: Run performance soak gate
        required: false
        default: false
        type: boolean
      soak_base_url:
        description: Base URL for soak environment
        required: false
        default: ''
        type: string
      soak_duration:
        description: Soak duration passed to k6
        required: false
        default: 24h
        type: string
      soak_vus:
        description: Concurrent users for soak gate
        required: false
        default: '40'
        type: string

jobs:
  benchmark:
    name: Run benchmarks
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_benchmarks == 'true'
    # `pages: write` / `id-token: write` existed only for the removed
    # `github-action-benchmark` gh-pages push (see the note at `Store benchmark
    # results`). Publishing the report page is done by `peaceiris/actions-gh-pages`
    # in the `Generate benchmark report` job, which declares its own permissions.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Run benchmarks
        env:
          # 低内存 friendly config：thin LTO + 多 codegen-units
          RUSTFLAGS: "-Ccodegen-units=16"
          # 关键：让"被请求的基准静默跳过"变成硬失败。
          # 历史上该步骤在工作流里跑 performance_api_benchmarks，但从未设置
          # BENCH_ADMIN_TOKEN、也没有 homeserver —— 11 个基准里 10 个静默跳过，
          # 而 `cargo bench` 仍退出 0（与 `cargo test --doc` 空门禁同型的假绿）。
          # 见 docs/audit/P4_performance_baseline_2026-09-11.md §2。
          #
          # 本 job 只请求 pagination 组（纯内存、无需服务）。
          # 注意不能用"有没有任何基准跑过"来判定 —— pagination 总会跑，
          # 那种判据永远为真、抓不住静默跳过。
          BENCH_REQUIRE: "pagination"
        run: |
          # 四条 `cargo bench … | tee` 都会把退出码换成 tee 的 0：某条基准编译失败或
          # 崩溃时这一步照样"成功"，下面的计算 smoke check 再基于缺失的数据做判断。
          set -o pipefail
          : > benchmark.txt
          # pagination 基准是纯内存计算，不依赖服务/DB，因此在本 job 中真实执行。
          # 阻塞断言见下方 "Check in-memory pagination compute smoke check (no DB)"。
          # 真实（DB 支撑）的分页门禁在 benchmark.yml::pagination-perf-gate。
          cargo bench --locked --profile release-perf --bench performance_api_benchmarks \
            -- --output-format bencher pagination_ | tee -a benchmark.txt
          cargo bench --locked --profile release-perf --bench performance_federation_benchmarks -- --output-format bencher | tee -a benchmark.txt
          # Also generate standard text output for PR gate comparison
          : > benchmark_standard.txt
          cargo bench --locked --profile release-perf --bench performance_federation_benchmarks -- --noplot | tee -a benchmark_standard.txt
          cargo bench --locked --profile release-perf --bench performance_membership_benchmarks -- --noplot | tee -a benchmark_standard.txt

      # 分页**计算路径** smoke check（不是分页性能门禁）。
      #
      # 本步骤比较的 `pagination_offset_deep_page` / `pagination_keyset_deep_page`
      # 是 `benches/performance_api_benchmarks.rs` 里的两个**内存仿真**函数
      # （250k 合成行上的 Vec 扫描 vs 二分）。仿真差值约 1500×，30% 阈值由构造
      # 满足，因此**真实 SQL 退化不可能触发它**（E4，见
      # docs/audit/GATE_INTEGRITY_FOLLOWUP_2026-09-19.md §9）。
      #
      # 历史：本步骤自 a465d0fd（2026-05-09）起存在，但它断言的基准在
      # 8c7b4860（2026-06-05）被从 benches 中删除而未同步移除本步骤，于是它
      # **必然失败**且分页性能完全未被测量（持续 98 天）。基准已恢复。
      #
      # 本步骤仍然有价值：它 fail-closed 地证明这两个计算基准存在、被执行、
      # 且计算路径本身没有退化。**真实分页保护不在本 job**（本 job 无 DB）——
      # 它在 benchmark.yml::pagination-perf-gate：真实 `synapse-storage` keyset
      # SQL vs 真实 `LIMIT/OFFSET`，阈值 PAGINATION_MIN_GAIN（默认 2×，实测
      # 5–9×），见 scripts/ci/pagination_perf_gate.sh。
      # 回归保护见 tests/unit/pagination_gate_tests.rs。
      - name: Check in-memory pagination compute smoke check (no DB)
        run: |
          python3 scripts/check_pagination_benchmark.py benchmark.txt --minimum-improvement 0.30

      # 纯计算性能门禁：真实测量、真实阈值。
      #
      # 取代 TESTING.md 里那三组从未被执行的 P95 数字（500/1000/100ms）。
      # 这些基准不需要 server/DB，因此在 CI 中总能真正运行；
      # 阈值写在脚本内（约 10× 实测基线），目标是数量级退化而非 10% 漂移。
      # 回归保护见 tests/unit/perf_gate_honesty_tests.rs。
      - name: Compute performance regression gate
        env:
          RUSTFLAGS: "-Ccodegen-units=16"
        run: bash scripts/ci/compute_perf_gate.sh

      - name: Upload compute perf logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compute-perf-logs
          path: artifacts/compute_perf_*.log
          retention-days: 14

      - name: Analyze results
        run: |
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat benchmark.txt >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Pagination Compute Smoke Check (in-memory simulation; real DB gate is pagination-perf-gate)" >> $GITHUB_STEP_SUMMARY
          python3 scripts/check_pagination_benchmark.py benchmark.txt --minimum-improvement 0.30 >> $GITHUB_STEP_SUMMARY

      # ⚠️ The `benchmark-action/github-action-benchmark@v1` step that used to sit
      # here (`auto-push: true`) was removed 2026-09-20. It could never succeed,
      # for two independent reasons measured on `main` (run 35484657071):
      #   * `auto-push` fetches and pushes the `gh-pages` branch, but this repo
      #     has none: `fatal: couldn't find remote ref gh-pages`;
      #   * even with the branch, this job's permissions are `contents: read`
      #     (pages: write / id-token: write), so the push would be denied.
      # It was also circular: `gh-pages` is (re)created by the `Generate
      # benchmark report` job, which `needs: benchmark` — the job that required
      # the branch to exist.
      # Regression comparison is not lost: `scripts/ci/compute_perf_gate.sh`
      # (ceilings, above), `performance-comparison` (artifact diff), and
      # `pr-benchmark-gate` (threshold, below) all measure it. Because this step
      # aborted the job, `Store benchmark results` never ran, so no
      # `benchmark-results` artifact has ever been uploaded on `main` — which is
      # why `pr-benchmark-gate` failed with
      # `no matching workflow run found with any artifacts?`.
      - name: Store benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark.txt
            benchmark_standard.txt
          retention-days: 30

  sliding-sync-perf-gate:
    # ── Sliding Sync 性能回滚门禁 ─────────────────────────────────────────────
    # `scripts/ci/sliding_sync_perf_gate.sh` 的注释自述其存在理由：
    # 上游 Synapse v1.153.0rc3 因为**没有阈值门禁**而没能及时发现滑动同步的
    # 性能退化，最终回滚了该优化（AGENTS.md 亦记录了这条教训）。
    #
    # 该脚本此前写好但**从未被任何 workflow 调用** —— 即"回滚门禁"本身不存在。
    # 本 job 把它接入 CI。它需要带 schema 的 Postgres，因此这里起一个 service
    # 并应用迁移。
    name: Sliding sync perf gate
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_benchmarks == 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-perf-gate-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-perf-gate-

      - name: Prepare benchmark database schema
        env:
          # `scripts/init_test_public_schema.sh` reads `TEST_DATABASE_URL` (or the
          # `TEST_DB_*` parts) — it does **not** read `DATABASE_URL`. Passing the
          # URL under the wrong name made the script fall back to its default
          # database `synapse_test`, which does not exist in this job's postgres
          # service (`POSTGRES_DB: synapse_bench`), so the step failed with
          # `FATAL: database "synapse_test" does not exist` (CI run 35489156862)
          # and the strict perf gate below was skipped. The pagination job
          # further down already passes `TEST_DATABASE_URL`.
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse_bench
        run: |
          # `sqlx migrate run` cannot apply this baseline: it executes the file
          # inside a transaction, and `CREATE INDEX CONCURRENTLY` refuses to run
          # in one (measured 2026-09-19: `error: while executing migration 0:
          # CREATE INDEX CONCURRENTLY cannot run inside a transaction block`).
          # Apply the single-source `migrations/` with psql per file (autocommit),
          # exactly like the DB-backed `pagination-perf-gate` job does.
          bash scripts/init_test_public_schema.sh

      - name: Run sliding sync perf gate (strict)
        env:
          BENCHMARK_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse_bench
          # strict=1: 数据库不可达或没有任何 [perf] 采样都必须失败，
          # 否则门禁会在没有测量结果的情况下"通过"。
          SLIDING_SYNC_PERF_GATE_STRICT: "1"
          RUSTFLAGS: "-Ccodegen-units=16"
        run: bash scripts/ci/sliding_sync_perf_gate.sh

      - name: Upload sliding sync perf log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sliding-sync-perf-gate
          path: artifacts/sliding_sync_perf_gate.log
          retention-days: 14

  pagination-perf-gate:
    # ── E4：DB 支撑的真实分页门禁 ────────────────────────────────────────────
    #
    # `scripts/check_pagination_benchmark.py`（benchmark job）比较的是两个
    # **内存仿真**函数，仿真差值约 1500×，真实 SQL 退化永远不会触发它的 30%
    # 阈值 —— 它只是计算路径的 smoke check。真正的分页保护在这里。
    #
    # `benches/performance_pagination_benchmarks.rs` 在真实迁移过的 `events`
    # 表上跑生产 keyset 查询（`EventStorage::get_room_events_paginated_cursor`，
    # 即 /messages 使用的 SQL）与 ISSUE-06 之前的 `LIMIT/OFFSET` 形状，比较
    # 同一深页；`scripts/ci/pagination_perf_gate.sh` 断言真实差距 ≥2×（实测
    # 5–9×）、两者返回同一页、且计划仍走索引。故意退化 keyset（去掉索引或改回
    # OFFSET）会把差距压到 ~1–1.5× 并让它变红。
    #
    # 为什么是独立 job 而不是复用 `sliding-sync-perf-gate` 的步骤：那个 job 的
    # "Prepare benchmark database schema" 用 `sqlx migrate run`，而合并 baseline
    # 含 14 处 `CREATE INDEX CONCURRENTLY`（不能在事务内执行），该步骤在当前
    # 基线下必然失败；追加在那里的步骤永远不会执行。本 job 改用
    # `scripts/init_test_public_schema.sh`（psql 逐文件 apply，autocommit），
    # 与 ci.yml 的测试库 seed 是同一实现。
    name: Pagination perf gate (DB-backed)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_benchmarks == 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-pagination-gate-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pagination-gate-

      - name: Install PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Prepare benchmark database schema
        env:
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse_bench
        # psql 逐文件 apply `migrations/`（单一迁移实现）；`sqlx migrate run`
        # 在合并 baseline 上必然失败，见 scripts/init_test_public_schema.sh 头注释。
        run: bash scripts/init_test_public_schema.sh

      - name: Run DB-backed pagination perf gate
        env:
          BENCHMARK_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse_bench
          PAGINATION_MIN_GAIN: "2.0"
          RUSTFLAGS: "-Ccodegen-units=16"
        run: bash scripts/ci/pagination_perf_gate.sh

      - name: Upload pagination perf log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pagination-perf-gate
          path: artifacts/pagination_perf_gate.log
          retention-days: 14

  performance-comparison:
    name: Performance comparison
    runs-on: ubuntu-latest
    needs: benchmark
    if: github.event_name == 'pull_request'
    permissions:
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The baseline MUST come from `main`, not from the branch this PR is on.
      # `dawidd6/action-download-artifact` resolves the workflow run to read from
      # the *current* branch unless `branch` is given, and this job only runs on
      # `pull_request` — so the unqualified form looked for a `benchmark.yml` run
      # on the PR's own head branch. That is either absent (the action then fails
      # the step, because `if_no_artifact_found` defaults to `fail`) or, worse,
      # the PR's own run, which makes the comparison diff a run against itself
      # and always print "no difference".
      #
      # `workflow_conclusion` is spelled out rather than left implicit: its
      # default is `success`, and a baseline from a failed or cancelled run would
      # compare against a truncated `benchmark.txt` (the job that uploads it
      # aborts before `Store benchmark results` on failure). Naming the value
      # makes the requirement auditable instead of inherited.
      #
      # The step carries no `if:` of its own: the job already declares
      # `if: github.event_name == 'pull_request'`, so repeating the condition
      # here was dead weight that also hid which level actually gates the step.
      - name: Download baseline results
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: benchmark.yml
          workflow_conclusion: success
          branch: main
          name: benchmark-results
          path: baseline
          check_artifacts: true
          search_artifacts: true

      - name: Download current results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: current

      - name: Compare results
        run: |
          if [ -f baseline/benchmark.txt ] && [ -f current/benchmark.txt ]; then
            echo "## Performance Comparison" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Comparing with baseline..." >> $GITHUB_STEP_SUMMARY
            diff baseline/benchmark.txt current/benchmark.txt || true
          else
            echo "No baseline found for comparison"
          fi

      # Same dead `if:` as above — the job-level condition already gates this.
      - name: Post performance comparison
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## 📊 Performance Comparison\n\n';
            if (fs.existsSync('current/benchmark.txt')) {
              const current = fs.readFileSync('current/benchmark.txt', 'utf8');
              body += '### Current Results\n```\n' + current + '\n```\n\n';
            }
            if (fs.existsSync('baseline/benchmark.txt')) {
              const baseline = fs.readFileSync('baseline/benchmark.txt', 'utf8');
              body += '### Baseline (main)\n```\n' + baseline + '\n```\n';
            } else {
              body += 'No baseline found for comparison.\n';
            }
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

  performance-manual:
    name: Run manual performance tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_performance_manual == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Run manual performance suite
        run: cargo test --features performance-tests --test performance_manual -- --nocapture

  performance-soak:
    name: Run performance soak gate
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_performance_soak == 'true')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Resolve soak target
        env:
          WORKFLOW_SOAK_BASE_URL: ${{ github.event.inputs.soak_base_url }}
          SECRET_SOAK_BASE_URL: ${{ secrets.PERF_SOAK_BASE_URL }}
        run: |
          SOAK_BASE_URL="${WORKFLOW_SOAK_BASE_URL:-$SECRET_SOAK_BASE_URL}"
          if [ -z "$SOAK_BASE_URL" ]; then
            echo "PERF_SOAK_BASE_URL is required for soak gate"
            exit 1
          fi
          echo "SOAK_BASE_URL=$SOAK_BASE_URL" >> "$GITHUB_ENV"

      - name: Run soak guardrail
        env:
          BASE_URL: ${{ env.SOAK_BASE_URL }}
          RESULTS_DIR: artifacts/perf_soak
          SOAK_DURATION: ${{ github.event.inputs.soak_duration || '24h' }}
          SOAK_VUS: ${{ github.event.inputs.soak_vus || '40' }}
        run: bash scripts/test/perf/run_tests.sh soak

      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-soak-report
          path: artifacts/perf_soak
          retention-days: 14

  benchmark-report:
    name: Generate benchmark report
    runs-on: ubuntu-latest
    needs: benchmark
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: reports

      - name: Generate report
        run: |
          echo "# Synapse Rust Performance Benchmark Report" > reports/REPORT.md
          echo "" >> reports/REPORT.md
          echo "**Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> reports/REPORT.md
          echo "**Commit:** ${{ github.sha }}" >> reports/REPORT.md
          echo "" >> reports/REPORT.md
          echo "## Results" >> reports/REPORT.md
          echo "" >> reports/REPORT.md
          cat reports/benchmark.txt >> reports/REPORT.md

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
