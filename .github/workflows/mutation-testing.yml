name: Mutation Testing (cargo-mutants)

on:
  schedule:
    # Nightly run at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to mutate (empty = use batched file smoke)'
        required: false
        type: string
        default: ''
      mutation_files:
        description: 'Whitespace-separated file list for batched smoke runs'
        required: false
        type: string
        default: 'synapse-web/src/routes/extractors/json.rs synapse-web/src/middleware/security.rs synapse-services/src/media/mod.rs synapse-storage/src/event/pagination.rs'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  mutation-test:
    name: Mutation Testing (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Non-blocking: failure does not prevent merge
    continue-on-error: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synapse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mutants-

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synapse_test
        run: |
          bash docker/db_migrate.sh migrate
          bash docker/db_migrate.sh validate

      - name: Run mutation tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synapse_test
          TEST_REDIS_URL: redis://localhost:6379
        run: |
          MUTATION_FILES="${{ inputs.mutation_files }}"
          if [ -z "$MUTATION_FILES" ]; then
            MUTATION_FILES="synapse-web/src/routes/extractors/json.rs synapse-web/src/middleware/security.rs synapse-services/src/media/mod.rs synapse-storage/src/event/pagination.rs"
          fi

          if [ -n "${{ inputs.package }}" ]; then
            cargo mutants --package "${{ inputs.package }}" \
              --timeout 30 \
              -- --test-threads=2
            exit 0
          fi

          # Two things used to make this loop a no-op:
          #
          #   1. `--package synapse-rust` was hard-coded for every entry, but the
          #      default list is entirely outside that package (the root package
          #      only covers `src/` and `benches/`). cargo-mutants matches
          #      `--file` against the selected package, so nothing was mutated.
          #   2. Two of the four default paths did not exist at all
          #      (`src/services/media/mod.rs` moved to `synapse-services/src/...`
          #      in the B4-5b crate split; there is no
          #      `routes/extractors/pagination.rs` — the pagination module is
          #      `synapse-storage/src/event/pagination.rs`).
          #
          # Both are now checked up front, so a stale path fails loudly instead of
          # silently producing an empty mutation run.
          package_for() {
            case "$1" in
              synapse-*/src/*) printf '%s\n' "${1%%/src/*}" ;;
              src/*|benches/*) printf '%s\n' "synapse-rust" ;;
              *)               printf '%s\n' "" ;;
            esac
          }

          failures=""
          for file in $MUTATION_FILES; do
            if [ ! -f "$file" ]; then
              echo "::error::mutation-testing: listed file does not exist: $file"
              failures="$failures $file"
              continue
            fi
            pkg="$(package_for "$file")"
            if [ -z "$pkg" ]; then
              echo "::error::mutation-testing: cannot map $file to a workspace package"
              failures="$failures $file"
              continue
            fi
            echo "==> $file (package $pkg)"
            cargo mutants --package "$pkg" \
              --file "$file" \
              --timeout 30 \
              --baseline skip \
              -- --test-threads=2 || true
          done

          if [ -n "$failures" ]; then
            echo "::error::mutation-testing: invalid file list entries:$failures"
            exit 1
          fi

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: |
            mutants.out/
            target/mutants/
          retention-days: 30
