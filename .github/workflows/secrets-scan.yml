# ============================================================================
# secrets-scan.yml — 硬编码密钥泄露门禁
# ============================================================================
# 触发时机：push 到 main / PR 到 main / 手动
# 作用：用 gitleaks 拦截**本次变更引入**的硬编码密钥（API key、token、
#       私钥、口令等）。
#
# ── 为什么是"本次变更"而不是全历史 ──────────────────────────────────────────
# 实测（2026-10-03，gitleaks 8.30.1，`detect --no-git` 扫 `git archive HEAD`
# 的 3048 个受版本控制文件）：全树扫描报 **158 条** 命中，绝大多数是**测试夹具**
# （`scripts/test/fullstack-redo/results/details.tsv` 的 E2EE 测试密钥、
# `scripts/api_test/response_schemas.json` 的示例口令等），并非真实泄露。
# 一个"扫全历史并阻断"的门禁会从第一天起永久变红，等于没有门禁。
#
# 因此本门禁用 gitleaks-action 的**事件范围**语义：它在 push/PR 上把扫描范围
# 收窄到本次推送的提交区间（dist/index.js 里为
# `--log-opts=--no-merges --first-parent <base>^..<head>`），只对新增提交负责
# ——这才是一条"现在能绿、新泄露会红"的真棘轮。
#
# ── pin 策略 ────────────────────────────────────────────────────────────────
# 与 hadolint(`@v3.5.0`) / trivy(`@v0.36.0`) / ruff(`==0.16.8`) 同一判据：
# 门禁结论不应随运行日期变化，故 action 钉完整版本、gitleaks CLI 钉 8.30.1，
# 而不是 `@v3` / `latest`。
#
# ── 许可 ────────────────────────────────────────────────────────────────────
# `GITLEAKS_LICENSE` 仅**组织账号**需要；本仓库为个人账号，留空即可。若将来
# 迁入组织账号，需在仓库 Secret 里补该值，否则本 job 会因缺 license 而失败。
# ============================================================================
name: Secrets Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# gitleaks-action 在 PR 上用 GITHUB_TOKEN 回评命中的行（`GITLEAKS_ENABLE_COMMENTS`
# 默认 true）。fork PR 的 token 为只读，评论会退化为日志告警但**不阻断**判断；
# 其余权限保持最小。
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # `fetch-depth: 0` 不可省：action 要解析 push/PR 的提交区间
      # （`<base>^..<head>`），浅克隆下 base 的父提交不存在，区间退化为
      # 单提交扫描（`--log-opts=-1`），门禁覆盖度被静默削弱。
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # 钉 CLI 版本，避免规则/行为随 action 默认值漂移。
          GITLEAKS_VERSION: '8.30.1'
