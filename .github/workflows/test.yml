name: Manual Coverage Validation

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
  TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse

jobs:
  test:
    name: Test and Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust 1.93.0
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.93.0
        components: rustfmt, clippy, llvm-tools-preview

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Install sqlx-cli and cargo-llvm-cov
      run: |
        cargo install sqlx-cli --version '^0.8' --locked --no-default-features --features postgres
        cargo install cargo-llvm-cov --locked

    - name: Build forward-only sqlx migration source
      run: python3 scripts/build_sqlx_migration_source.py artifacts/sqlx-migrations

    - name: Run Migrations
      run: |
        sqlx migrate run --source artifacts/sqlx-migrations

    - name: Run Tests and Generate Coverage
      run: |
        # llvm-cov two-step (mirrors scripts/run_local_coverage.sh; tarpaulin is
        # dropped — 0.35.2 has a broken --implicit-test-threads and drops coverage
        # data when any test exits non-zero):
        #   step 1: synapse-storage alone, single-threaded (db_tests connect to
        #           public schema and race under concurrency).
        #   step 2: everything else with the feature set that route_ledger
        #           snapshots were generated against.
        #   step 3: merge the two lcov files.
        mkdir -p coverage
        COV_FEATURES="test-utils,privacy-ext,voice-extended,voip-tracking,beacons,server-notifications,cas-sso,saml-sso"
        RUST_TEST_THREADS=1 cargo llvm-cov -p synapse-storage \
          --features "$COV_FEATURES" --lib \
          --lcov --output-path /tmp/storage.lcov
        cargo llvm-cov --workspace --exclude synapse-storage \
          --features "$COV_FEATURES" \
          --lcov --output-path /tmp/rest.lcov \
          -- --skip ledger_export_tests
        python3 scripts/merge_lcov.py /tmp/storage.lcov /tmp/rest.lcov -o coverage/lcov.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: coverage/lcov.info
        fail_ci_if_error: true
