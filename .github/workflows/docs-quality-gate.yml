name: Docs Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docs-quality:
    name: Docs Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install markdownlint
        run: |
          # Pin the version. Rule behaviour is version-dependent, so an unpinned
          # `latest` silently redefines what "passing" means for every local re-run
          # of this gate. Measured 2026-09-22: `markdownlint-cli@0.37.0` reports
          # `MD012` for the trailing blank line in CLAUDE.md that 0.49.1 accepts — a
          # false red for anyone verifying locally with an older pin (and a false
          # sense of safety for anyone on a newer one).
          npm i -g markdownlint-cli@0.49.1

      - name: Discover active markdown files
        id: docs
        run: |
          # Collect root-level *.md and docs/*.md excluding all archive/ directories
          files=$(find . -maxdepth 1 -name "*.md" -type f | sort)
          docs_files=$(find docs -name "*.md" -type f -not -path "*/archive/*" 2>/dev/null | sort)
          all_files="$files"$'\n'"$docs_files"
          # Filter out empty lines and format as space-separated for shell steps
          active=$(echo "$all_files" | grep -v '^$' | tr '\n' ' ')
          echo "files=$active" >> "$GITHUB_OUTPUT"
          echo "Active docs: $active"

      - name: markdownlint - Active Docs
        run: |
          files="${{ steps.docs.outputs.files }}"
          if [ -z "$(echo "$files" | tr -d ' ')" ]; then
            echo "No markdown files to lint"
            exit 0
          fi
          markdownlint -c .markdownlint.json $files

      - name: Install aspell
        run: |
          sudo apt-get update
          sudo apt-get install -y aspell aspell-en

      - name: aspell - Active Docs
        run: |
          files="${{ steps.docs.outputs.files }}"
          if [ -z "$(echo "$files" | tr -d ' ')" ]; then
            echo "No markdown files to spell-check"
            exit 0
          fi
          # Spelling issues FAIL the workflow.
          #
          # The previous form was
          #   bash scripts/check_doc_spelling.sh "$f" || { echo "::warning::..."; }
          # which made the step unconditionally succeed: on a failure the `||`
          # branch ran, its exit status was 0, and the `for` loop's status was
          # therefore 0. `check_doc_spelling.sh` itself does `exit 1` on unknown
          # words, so the gate existed but could never go red (AGENTS.md 铁律 8).
          #
          # Every file is checked before failing, so one run reports all of them
          # instead of stopping at the first typo.
          failed=""
          for f in $files; do
            echo "--- Checking $f ---"
            if ! bash scripts/check_doc_spelling.sh "$f"; then
              failed="$failed $f"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::aspell found spelling issues in:$failed"
            echo "Fix the typos, or add legitimate words to .aspell.en.pws / .aspell.ignore.txt."
            exit 1
          fi
          echo "aspell: OK (no unknown words)"

      - name: lychee - Active Docs
        uses: lycheeverse/lychee-action@v1.10.0
        with:
          args: --base . --exclude-loopback ${{ steps.docs.outputs.files }}
