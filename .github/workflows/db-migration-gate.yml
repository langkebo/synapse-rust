name: DB Migration Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  schema-blind-guards:
    name: Schema Blind Guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for schema-blind guards
        run: python3 scripts/check_schema_blind_guards.py

  baseline-consolidation-check:
    name: Baseline Consolidation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate baseline absorbs all incremental migrations
        run: |
          # `| tee` 会把步骤退出码变成 tee 的（0）；bash 默认不开 pipefail，
          # 于是脚本报 ❌ 且 exit 1 时这一步仍判绿。门禁步骤必须显式开启。
          set -o pipefail
          mkdir -p artifacts
          python3 scripts/check_baseline_consolidation.py | tee artifacts/baseline_consolidation.txt

      - name: Upload consolidation report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: baseline-consolidation-report
          path: artifacts/baseline_consolidation.txt
          retention-days: 14

  schema-table-coverage:
    name: Schema Table Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate referenced tables have schema coverage
        run: |
          mkdir -p artifacts
          python3 scripts/check_schema_table_coverage.py --json-report artifacts/schema_table_coverage.json

      - name: Upload schema table coverage report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: schema-table-coverage-report
          path: artifacts/schema_table_coverage.json
          retention-days: 14

  schema-contract-coverage:
    name: Schema Contract Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate critical schema contracts with threshold
        run: |
          mkdir -p artifacts
          python3 scripts/check_schema_contract_coverage.py \
            --threshold 100 \
            --report artifacts/contract_coverage_report.md \
            --json-report artifacts/contract_coverage_report.json

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: contract-coverage-report
          path: |
            artifacts/contract_coverage_report.md
            artifacts/contract_coverage_report.json
          retention-days: 14

  unified-schema-apply:
    name: Unified Schema Apply
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client postgresql-contrib

      - name: Apply unified schema
        env:
          PGPASSWORD: synapse
        run: |
          # Discover the latest unified schema baseline dynamically so the gate
          # does not have to be bumped each time the baseline version is
          # rolled forward (e.g. v10 -> v11).  Falls back to a hard-coded
          # pointer if the discovery scan finds nothing.
          schema_file="$(ls -1 migrations/00000000_unified_schema_v*.sql 2>/dev/null | sort -V | tail -1)"
          if [ -z "$schema_file" ]; then
            echo "ERROR: no migrations/00000000_unified_schema_v*.sql baseline found" >&2
            exit 1
          fi
          echo "Applying unified schema baseline: $schema_file"
          psql -h localhost -U synapse -d synapse -v ON_ERROR_STOP=1 -f "$schema_file"

      - name: Run pg_amcheck
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          PG_AMCHECK_REPORT: artifacts/db-amcheck-report.txt
        run: |
          mkdir -p artifacts
          python3 scripts/run_pg_amcheck.py

      - name: Upload pg_amcheck report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: db-amcheck-report
          path: artifacts/db-amcheck-report.txt
          retention-days: 14

  db-migrate-script-run:
    name: db_migrate.sh Migrate Run
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse_actual
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply migration-managed schema through db_migrate.sh
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: synapse_actual
          DB_USER: synapse
          DB_PASSWORD: synapse
        run: bash docker/db_migrate.sh migrate

      - name: Validate migrations through db_migrate.sh
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: synapse_actual
          DB_USER: synapse
          DB_PASSWORD: synapse
        run: bash docker/db_migrate.sh validate

  sqlx-migrate-run:
    name: sqlx Migrate Run
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: pip install psycopg2-binary

      - name: Install PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version '^0.8' --locked --no-default-features --features postgres

      - name: Build forward-only sqlx migration source
        run: python3 scripts/build_sqlx_migration_source.py artifacts/sqlx-migrations

      - name: Create database and run migrations
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
        run: |
          sqlx database create
          sqlx migrate run --source artifacts/sqlx-migrations

      # ⚠️ 下面 5 个 "storage/db smoke" 步骤原先写的是
      #   `--test unit <module>`，但那些模块**只存在于 tests/integration**，且名字带
      #   `_migrated` 后缀 ⇒ libtest 匹配 0 个测试并 exit 0 —— 5 个"DB 门禁"长期空转
      #   （门禁诚实性清查 A2，实测 2026-09-19）。
      # 现在改为 `--test integration <module>_migrated`，并统一用
      # scripts/ci/require_tests_ran.sh 包裹：**跑了 0 个测试即失败**，
      # 这样下次目标名再漂移会立刻红，而不是继续假装通过。
      - name: Run thread storage database smoke tests
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
        run: >-
          bash scripts/ci/require_tests_ran.sh
          cargo test --locked
            --features test-utils,privacy-ext,voice-extended,voip-tracking,beacons,server-notifications
            --test integration thread_storage_tests_migrated -- --test-threads=1

      - name: Run retention storage database smoke tests
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
        run: >-
          bash scripts/ci/require_tests_ran.sh
          cargo test --locked
            --features test-utils,privacy-ext,voice-extended,voip-tracking,beacons,server-notifications
            --test integration retention_storage_tests_migrated -- --test-threads=1

      - name: Run room summary storage database smoke tests
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
        run: >-
          bash scripts/ci/require_tests_ran.sh
          cargo test --locked
            --features test-utils,privacy-ext,voice-extended,voip-tracking,beacons,server-notifications
            --test integration room_summary_storage_tests_migrated -- --test-threads=1

      - name: Run db schema smoke tests
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
        run: >-
          bash scripts/ci/require_tests_ran.sh
          cargo test --locked
            --features test-utils,privacy-ext,voice-extended,voip-tracking,beacons,server-notifications
            --test integration db_schema_smoke_tests_migrated -- --test-threads=1

      - name: Run schema contract p0 tests
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
        run: >-
          bash scripts/ci/require_tests_ran.sh
          cargo test --locked
            --features test-utils,privacy-ext,voice-extended,voip-tracking,beacons,server-notifications
            --test integration schema_contract_p0_tests_migrated -- --test-threads=1

      # 18 个「schema contract integration tests」占位步骤已于 2026-09-15 整体删除。
      #
      # 这些步骤原先只有 `run: echo "..."`（恒绿、零断言）。Phase 0 把 `run:` 删掉、
      # 只留注释后，**反而使整个 workflow 文件非法**：GitHub Actions 要求每个 step
      # 必须有 `run:` 或 `uses:`，否则整套 workflow 校验失败
      # （"Required property is missing: run"）—— 一个非法文件会让
      # `sqlx-migrate-run` 里**所有**步骤（包括下方真实存在的门禁）一起不生效。
      # 即"删掉空 echo"这个正确意图，因保留 `- name:` 骨架而产生了更坏的后果。
      #
      # 这 18 个 cargo test 目标（`--test schema_contract_*_tests`）在当前树中并不
      # 存在，且属于 `--test integration` 之外的独立测试二进制命名。真正的契约检查
      # 由下方的 `Run schema contract p0 tests`、`Run placeholder contract P1/P2
      # integration tests`、`Run database integrity migration gates` 承担。
      #
      # 恢复其中任何一项时，必须连同**真实可运行的测试目标**一起加回，不要只留
      # `- name:` —— `scripts/ci/check_workflow_steps.py` 会拦住无 `run`/`uses` 的步骤。

      - name: Run placeholder contract P1/P2 integration tests
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          INTEGRATION_TESTS_REQUIRED: "1"
        run: |
          cargo test --locked \
            --features test-utils,privacy-ext,voice-extended,voip-tracking,beacons,server-notifications \
            --test integration api_placeholder_contract_p1p2_tests -- --test-threads=1 --nocapture

      - name: Run database integrity migration gates
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          INTEGRATION_TESTS_REQUIRED: "1"
        run: |
          set -euo pipefail
          # `test_verification_requests_pending_index_survives_full_migration_chain`
          # 曾在数组里，但它**全仓不存在**；配合 `--exact`，libtest 匹配 0 个测试并
          # exit 0，于是这一条"迁移后索引仍在"的断言从未执行（清查 A3，实测 2026-09-19）。
          # 该索引的覆盖由 test_audit_critical_indexes_exist 与
          # schema_health_check::REQUIRED_INDEXES 承担，故直接删除名字而不是
          # 编造一个替代断言。
          tests=(
            "database_integrity_tests::tests::test_audit_critical_indexes_exist"
            "database_integrity_tests::tests::test_audit_critical_constraints_exist"
            "database_integrity_tests::tests::test_public_schema_contract_repairs_apply_cleanly"
            "database_integrity_tests::tests::test_orphan_data_diagnostics_query_executes"
          )
          for test_name in "${tests[@]}"; do
            # 用 require_tests_ran.sh 包住：某个名字若再写错/被删，就是 exit 1 而不是静默通过。
            bash scripts/ci/require_tests_ran.sh cargo test --locked \
              --features test-utils,privacy-ext,voice-extended,voip-tracking,beacons,server-notifications \
              --test integration "$test_name" -- --exact --nocapture
          done

      - name: Run invite blocklist database smoke tests
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          TEST_DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
        run: >-
          bash scripts/ci/require_tests_ran.sh
          cargo test --locked
            --features test-utils,privacy-ext,voice-extended,voip-tracking,beacons,server-notifications
            --test integration invite_blocklist_tests_migrated -- --test-threads=1

      - name: Generate logical checksum report
        env:
          DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse
          LOGICAL_CHECKSUM_TABLES_FILE: scripts/logical_checksum_tables.txt
          LOGICAL_CHECKSUM_REPORT: artifacts/db-logical-checksum-report.json
        run: python3 scripts/generate_logical_checksum_report.py

      - name: Upload logical checksum report
        uses: actions/upload-artifact@v4
        with:
          name: db-logical-checksum-report
          path: artifacts/db-logical-checksum-report.json
          retention-days: 14
